{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ezto-verify.fullname" . }}-minio
  labels:
    {{- include "ezto-verify.labels" (dict "root" . "component" "minio") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "ezto-verify.selectorLabels" (dict "root" . "component" "minio") | nindent 4 }}
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
{{- end }}
