{{- if .Values.liveness.enabled }}
{{/* nc -z needs bare host+port; ezto-verify.minioHostPort strips scheme/path
     and fails fast if the URL has no explicit port. */}}
{{- $minioHostPort := include "ezto-verify.minioHostPort" . -}}
{{- $minioHostPortParts := splitList ":" $minioHostPort -}}
{{- $minioHost := index $minioHostPortParts 0 -}}
{{- $minioPort := index $minioHostPortParts 1 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ezto-verify.fullname" . }}-liveness
  labels:
    {{- include "ezto-verify.labels" (dict "root" . "component" "liveness") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ezto-verify.selectorLabels" (dict "root" . "component" "liveness") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ezto-verify.labels" (dict "root" . "component" "liveness") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z -w2 {{ $minioHost }} {{ $minioPort }}; do echo "waiting for minio"; sleep 2; done
      containers:
        - name: liveness
          image: "{{ .Values.liveness.image.repository }}:{{ .Values.liveness.image.tag }}"
          imagePullPolicy: {{ include "ezto-verify.imagePullPolicy" (dict "root" . "policy" .Values.liveness.image.pullPolicy) }}
          envFrom:
            - secretRef:
                name: {{ include "ezto-verify.fullname" . }}-liveness
          env:
            - name: MINIO_HOST
              value: {{ $minioHostPort | quote }}
            - name: FACE_TOLERANCE
              value: {{ .Values.liveness.faceTolerance | quote }}
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            {{- toYaml .Values.liveness.resources | nindent 12 }}
{{- end }}
