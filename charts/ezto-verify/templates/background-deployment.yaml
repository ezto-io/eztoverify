{{- $pgPort := include "ezto-verify.pgPort" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ezto-verify.fullname" . }}-background
  labels:
    {{- include "ezto-verify.labels" (dict "root" . "component" "background") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ezto-verify.selectorLabels" (dict "root" . "component" "background") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ezto-verify.labels" (dict "root" . "component" "background") | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z -w2 {{ include "ezto-verify.pgHost" . }} {{ $pgPort }}; do echo "waiting for postgres"; sleep 2; done
      containers:
        - name: background
          image: "{{ .Values.background.image.repository }}:{{ .Values.background.image.tag }}"
          imagePullPolicy: {{ include "ezto-verify.imagePullPolicy" (dict "root" . "policy" .Values.background.image.pullPolicy) }}
          envFrom:
            - secretRef:
                name: {{ include "ezto-verify.fullname" . }}-background
          env:
            - name: JOB_DB_TYPE
              value: psql
          ports:
            - name: http
              containerPort: 8070
          readinessProbe:
            tcpSocket:
              port: 8070
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 8070
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.background.resources | nindent 12 }}
