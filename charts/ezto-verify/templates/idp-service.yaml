apiVersion: v1
kind: Service
metadata:
  name: {{ include "ezto-verify.fullname" . }}-idp
  labels:
    {{- include "ezto-verify.labels" (dict "root" . "component" "idp") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ezto-verify.selectorLabels" (dict "root" . "component" "idp") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
