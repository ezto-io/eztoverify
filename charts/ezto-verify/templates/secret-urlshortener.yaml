{{- $pgPort := include "ezto-verify.pgPort" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ezto-verify.fullname" . }}-url-shortener
  labels:
    {{- include "ezto-verify.labels" (dict "root" . "component" "url-shortener") | nindent 4 }}
type: Opaque
stringData:
  # Credentials are URL-encoded: a password containing @ : / ? # would
  # otherwise corrupt the connection URL that Prisma parses.
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s?schema=public" (urlquery .Values.postgres.user) (urlquery .Values.postgres.password) (include "ezto-verify.pgHost" .) $pgPort .Values.urlShortener.db.database | quote }}
  VALID_API_KEYS: {{ .Values.urlShortener.apiKeys | quote }}
