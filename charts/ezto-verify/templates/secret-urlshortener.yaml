{{- $pgPort := "5432" -}}
{{- if not .Values.postgres.enabled -}}
{{- $pgPort = .Values.postgres.external.port -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ezto-verify.fullname" . }}-url-shortener
  labels:
    {{- include "ezto-verify.labels" (dict "root" . "component" "url-shortener") | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s?schema=public" .Values.postgres.user .Values.postgres.password (include "ezto-verify.pgHost" .) $pgPort .Values.urlShortener.db.database | quote }}
  VALID_API_KEYS: {{ .Values.urlShortener.apiKeys | quote }}
