{{- $minioAccessKey := .Values.minio.rootUser -}}
{{- $minioSecretKey := .Values.minio.rootPassword -}}
{{- if not .Values.minio.enabled -}}
{{- $minioAccessKey = required "minio.external.accessKey is required when minio.enabled is false" .Values.minio.external.accessKey -}}
{{- $minioSecretKey = required "minio.external.secretKey is required when minio.enabled is false" .Values.minio.external.secretKey -}}
{{- end -}}
{{/* idp.db.user/password default to "" => inherit postgres.user/password. This
     is required (not just convenient) for the bundled-postgres path: init
     SQL (files/init-databases.sql) only CREATE DATABASEs, it creates no
     separate role, so the idp must authenticate as the same superuser. */}}
{{- $dbUser := .Values.idp.db.user | default .Values.postgres.user -}}
{{- $dbPassword := .Values.idp.db.password | default .Values.postgres.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ezto-verify.fullname" . }}-idp
  labels:
    {{- include "ezto-verify.labels" (dict "root" . "component" "idp") | nindent 4 }}
type: Opaque
stringData:
  KEYCLOAK_ADMIN: {{ .Values.idp.admin.user | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.idp.admin.password | quote }}
  KC_DB_USERNAME: {{ $dbUser | quote }}
  KC_DB_PASSWORD: {{ $dbPassword | quote }}
  MINIO_ACCESS_KEY: {{ $minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ $minioSecretKey | quote }}
  SHORTENER_KEY: {{ .Values.idp.shortenerKey | quote }}
