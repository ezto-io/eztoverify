{{- $minioAccessKey := .Values.minio.rootUser -}}
{{- $minioSecretKey := .Values.minio.rootPassword -}}
{{- if not .Values.minio.enabled -}}
{{- $minioAccessKey = .Values.minio.external.accessKey -}}
{{- $minioSecretKey = .Values.minio.external.secretKey -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ezto-verify.fullname" . }}-idp
  labels:
    {{- include "ezto-verify.labels" (dict "root" . "component" "idp") | nindent 4 }}
type: Opaque
stringData:
  KEYCLOAK_ADMIN: {{ .Values.idp.admin.user | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.idp.admin.password | quote }}
  KC_DB_USERNAME: {{ .Values.idp.db.user | quote }}
  KC_DB_PASSWORD: {{ .Values.idp.db.password | quote }}
  MINIO_ACCESS_KEY: {{ $minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ $minioSecretKey | quote }}
  SHORTENER_KEY: {{ .Values.idp.shortenerKey | quote }}
