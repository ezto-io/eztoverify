{{- if .Values.liveness.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ezto-verify.fullname" . }}-liveness
  labels:
    {{- include "ezto-verify.labels" (dict "root" . "component" "liveness") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ezto-verify.selectorLabels" (dict "root" . "component" "liveness") | nindent 4 }}
  ports:
    - name: http
      port: 5000
      targetPort: 5000
{{- end }}
