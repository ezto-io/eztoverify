{{- if .Values.elasticsearch.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ezto-verify.fullname" . }}-elasticsearch
  labels:
    {{- include "ezto-verify.labels" (dict "root" . "component" "elasticsearch") | nindent 4 }}
spec:
  serviceName: {{ include "ezto-verify.fullname" . }}-elasticsearch
  replicas: 1
  selector:
    matchLabels:
      {{- include "ezto-verify.selectorLabels" (dict "root" . "component" "elasticsearch") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ezto-verify.labels" (dict "root" . "component" "elasticsearch") | nindent 8 }}
    spec:
      containers:
        - name: elasticsearch
          image: "{{ .Values.elasticsearch.image.repository }}:{{ .Values.elasticsearch.image.tag }}"
          imagePullPolicy: {{ include "ezto-verify.imagePullPolicy" (dict "root" . "policy" .Values.elasticsearch.image.pullPolicy) }}
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: {{ .Values.elasticsearch.javaOpts | quote }}
          ports:
            - name: http
              containerPort: 9200
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            periodSeconds: 15
            failureThreshold: 10
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          resources:
            {{- toYaml .Values.elasticsearch.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.elasticsearch.storage }}
{{- end }}
