{{- $pgPort := include "ezto-verify.pgPort" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ezto-verify.fullname" . }}-background
  labels:
    {{- include "ezto-verify.labels" (dict "root" . "component" "background") | nindent 4 }}
type: Opaque
stringData:
  JOB_DB_USER: {{ .Values.postgres.user | quote }}
  JOB_DB_PASSWORD: {{ .Values.postgres.password | quote }}
  JOB_DB_URL: {{ printf "jdbc:postgresql://%s:%v/%s" (include "ezto-verify.pgHost" .) $pgPort .Values.background.db.database | quote }}
