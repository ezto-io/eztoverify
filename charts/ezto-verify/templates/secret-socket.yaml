apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ezto-verify.fullname" . }}-socket
  labels:
    {{- include "ezto-verify.labels" (dict "root" . "component" "socket") | nindent 4 }}
type: Opaque
stringData:
  PGUSER: {{ .Values.postgres.user | quote }}
  PGPASSWORD: {{ .Values.postgres.password | quote }}
