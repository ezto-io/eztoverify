{{- if .Values.maildev.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ezto-verify.fullname" . }}-maildev
  labels:
    {{- include "ezto-verify.labels" (dict "root" . "component" "maildev") | nindent 4 }}
spec:
  selector:
    {{- include "ezto-verify.selectorLabels" (dict "root" . "component" "maildev") | nindent 4 }}
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: web
      port: 1080
      targetPort: 1080
{{- end }}
