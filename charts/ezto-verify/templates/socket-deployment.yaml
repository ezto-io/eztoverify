{{- $pgPort := "5432" -}}
{{- if not .Values.postgres.enabled -}}
{{- $pgPort = .Values.postgres.external.port -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ezto-verify.fullname" . }}-socket
  labels:
    {{- include "ezto-verify.labels" (dict "root" . "component" "socket") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ezto-verify.selectorLabels" (dict "root" . "component" "socket") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ezto-verify.labels" (dict "root" . "component" "socket") | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z -w2 {{ include "ezto-verify.pgHost" . }} {{ $pgPort }}; do echo "waiting for postgres"; sleep 2; done
      containers:
        - name: socket
          image: "{{ .Values.socket.image.repository }}:{{ .Values.socket.image.tag }}"
          imagePullPolicy: {{ include "ezto-verify.imagePullPolicy" (dict "root" . "policy" .Values.socket.image.pullPolicy) }}
          envFrom:
            - secretRef:
                name: {{ include "ezto-verify.fullname" . }}-socket
          env:
            - name: PORT
              value: "3001"
            - name: PGHOST
              value: {{ include "ezto-verify.pgHost" . | quote }}
            - name: PGPORT
              value: {{ $pgPort | quote }}
            - name: PGDATABASE
              value: {{ .Values.socket.db.database | quote }}
          ports:
            - name: http
              containerPort: 3001
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.socket.resources | nindent 12 }}
