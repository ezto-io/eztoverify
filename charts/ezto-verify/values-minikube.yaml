# Local-development overlay for an existing minikube cluster. It sets cluster
# behavior only and carries no image references: the chart ships no default
# registry, so supply your own images. Liveness stays off because its image is
# roughly 15 GB.
#
# Install with your own registry:
#   helm upgrade --install ezto-verify charts/ezto-verify \
#     -f charts/ezto-verify/values-minikube.yaml \
#     --set idp.image.repository=docker.io/myorg/ezto-idp \
#     --timeout 15m --wait   # repeat --set for background, socket, urlShortener
#
# scripts/install.sh asks for the registry once and writes those values for you.
# To build from source instead, run scripts/helm/build-and-load.sh and layer
# values-local-build.yaml over this file.

idp:
  masterSslRequired: none

liveness:
  enabled: false

elasticsearch:
  enabled: true

maildev:
  enabled: true
