# Verify OSS — full core stack over HTTPS, one shot:  docker compose up --build
#
# Brings up backing infra (postgres / minio / elasticsearch) plus the idp and
# 4 services, each BUILT FROM SOURCE on every run (no prebuilt images), fronted
# by an nginx TLS proxy serving the idp at https://$DOMAIN/auth.
#
# One-time setup (the stack refuses to start without it):
#   1. cp .env.example .env                       # set DOMAIN=verify.example.com
#   2. TLS certs in nginx/certs/ (fullchain.pem + privkey.pem) — real CA cert,
#      or for testing: DOMAIN=<your-domain> ./nginx/gen-self-signed.sh
#   3. Point DOMAIN at this host (DNS A record, or /etc/hosts -> 127.0.0.1)
#
#   docker compose up --build         # build + start everything
#   docker compose down               # stop
#   docker compose down -v            # stop + wipe volumes
#
# Plain-HTTP local development (app code in your IDE against containerised
# infra): use docker-compose.dev.yml instead — it is unaffected by this file.
#
# Replace every REPLACE_ME / change_me_* value before any non-local use.

services:
  postgres:
    image: postgres:14-alpine
    container_name: ezto-postgres
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: ezto-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: ezto-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb -p local/ezto-verify || true &&
      mc anonymous set download local/ezto-verify/public || true
      "
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
    container_name: ezto-elasticsearch
    restart: unless-stopped
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: ["esdata:/usr/share/elasticsearch/data"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  idp:
    build:
      context: ./idp
    image: ezto-idp
    container_name: ezto-idp
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      elasticsearch: { condition: service_healthy }
      background: { condition: service_healthy }
    # No published ports — nginx (80/443) is the only entry point. Internal
    # traffic (nginx -> idp, idp-init) uses 8080 on the compose network.
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin
      KC_DB_URL_DATABASE: eztoverify
      # Master-realm admin (created on first boot / fresh DB). Change before non-local use.
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Public-TLS edge mode: nginx terminates HTTPS and forwards plain HTTP
      # with X-Forwarded-* headers; KC_PROXY=edge makes Keycloak trust them.
      KC_HOSTNAME_URL: https://${DOMAIN}/auth
      KC_HOSTNAME: ${DOMAIN}
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      IDP_HOST: http://idp:8080
      ENV: dev
      # Runtime product discriminator. RealmManager.createRealm + .ftl templates call
      # EnvironmentReader.getValue("VARIANT").equalsIgnoreCase(...) with no null guard —
      # unset => NPE during master-realm bootstrap. "ezto verify" = the Verify offering.
      VARIANT: "ezto verify"
      DASHBOARD_URL: https://${DOMAIN}
      # Admin-console "Docs" link target. Set to your self-hosted documentation URL.
      # Leave empty to show the bundled "documentation not configured" page instead.
      DOCS_URL: ""
      # "Docs" link in emails / welcome page / account console. Set to your self-hosted docs URL;
      # leave empty to hide those links.
      DOCS_LINK: ""
      # Welcome page isLocal() does ROOT_ACCESS_IP.split(",") with no null guard —
      # unset => NPE => catch rethrows HTTP 500 on GET /auth/. Admin-route whitelist.
      # Behind nginx (KC_PROXY=edge) the gate compares the X-Real-IP header. For a
      # browser on THIS host that is the docker gateway nginx sees as its TCP peer:
      # 192.168.65.1 on Docker Desktop (Mac/Win), 172.20.0.1 on a plain Linux
      # bridge — both allowed below. A REMOTE browser arrives with its real
      # public IP: add it here before master-tenant onboarding. Exact IPs, no CIDR.
      ROOT_ACCESS_IP: 127.0.0.1,0.0.0.0,::1,172.20.0.1,192.168.65.1
      BACKGROUND_JOB_URL: http://background:8070
      SHORTENER_HTTPS_URL: http://url-shortener:3000
      SHORTENER_HTTP_URL: http://url-shortener:3000
      SHORTENER_KEY: change_me_key
      SOCKET_URL: http://socket:3001
      LIVELINESS_URL: http://liveness:5000
      MINIO_SERVER_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_PUBLIC_URL: http://localhost:9000/ezto-verify/public
      ES_HOST: elasticsearch
      ES_PORT: "9200"
      ES_SCHEME: http
      # SMTP is configured per-tenant in the onboarding wizard (real provider). For local
      # email testing run the maildev catcher from docker-compose.dev.yml and set
      # SMTP_HOST=localhost SMTP_PORT=1025.
      APP_PUSH_VERSION: 9.3.1
    healthcheck:
      # temurin jre has no curl; a bash TCP probe confirms the HTTP port is accepting.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # One-shot: pin the master realm's Require-SSL after the idp is up.
  # Keycloak seeds the master realm with sslRequired=EXTERNAL (ApplianceBootstrap);
  # serving real HTTPS we keep that secure default explicitly. There is NO Keycloak
  # env for per-realm sslRequired, so we set it via kcadm. Runs over the idp's own
  # loopback (network_mode: service:idp) so the call bypasses the SSL policy.
  # Override MASTER_SSL_REQUIRED=none only for throwaway plain-HTTP experiments.
  idp-init:
    image: ezto-idp
    container_name: ezto-idp-init
    depends_on:
      idp: { condition: service_healthy }
    network_mode: "service:idp"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      MASTER_SSL_REQUIRED: external
    entrypoint:
      - /bin/sh
      - -c
      - >
        KC=/opt/keycloak/bin/kcadm.sh; CFG=/tmp/kcadm.config;
        $$KC config credentials --config $$CFG --server http://localhost:8080/auth
        --realm master --user "$$KEYCLOAK_ADMIN" --password "$$KEYCLOAK_ADMIN_PASSWORD" &&
        $$KC update realms/master --config $$CFG -s sslRequired="$${MASTER_SSL_REQUIRED:-external}"
    restart: "no"

  # Fail fast with a readable message when TLS certs are missing, instead of
  # letting nginx crash-loop on an ssl_certificate load error.
  certs-check:
    image: alpine:3.20
    container_name: ezto-certs-check
    volumes:
      - ./nginx/certs:/certs:ro
    entrypoint:
      - /bin/sh
      - -c
      - >
        if [ ! -s /certs/fullchain.pem ] || [ ! -s /certs/privkey.pem ]; then
        echo 'ERROR: TLS certs missing/empty in nginx/certs/ (need fullchain.pem + privkey.pem).' >&2;
        echo '       Real deploy: drop your CA cert there (e.g. Let'\''s Encrypt).' >&2;
        echo '       Local test: DOMAIN=<your-domain> ./nginx/gen-self-signed.sh' >&2;
        exit 1;
        fi
    restart: "no"

  # TLS edge: terminates HTTPS for https://$DOMAIN/auth, 80->443 redirect,
  # proxies to idp:8080 with forwarded headers (see nginx/templates/).
  nginx:
    image: nginx:1.27-alpine
    container_name: ezto-nginx
    restart: unless-stopped
    depends_on:
      certs-check: { condition: service_completed_successfully }
      idp: { condition: service_started }
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (e.g. verify.example.com) — see .env.example}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro

  background:
    build:
      context: ./services/background
    container_name: ezto-background
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8070:8070"]
    environment:
      JOB_DB_TYPE: psql
      JOB_DB_URL: jdbc:postgresql://postgres:5432/jobrnr
      JOB_DB_USER: admin
      JOB_DB_PASSWORD: admin
    healthcheck:
      # idp queries background at startup (management-keys scheduler) — wait for it.
      # temurin jre has bash but no curl; use a bash TCP probe on the HTTP port.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8070' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  socket:
    build:
      context: ./services/socket
    container_name: ezto-socket
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["3001:3001"]
    environment:
      PORT: "3001"
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: admin
      PGPASSWORD: admin
      PGDATABASE: socket

  url-shortener:
    build:
      context: ./services/url-shortener
    container_name: ezto-url-shortener
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["3000:3000"]
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://admin:admin@postgres:5432/urlshortner?schema=public
      VALID_API_KEYS: change_me_key
      FALLBACK_URL: https://${DOMAIN}

  liveness:
    # Face-match / liveness inference (Python + deepface/whisper). Only needed for biometric
    # face-liveness verification flows; the IdP does NOT depend on it to boot. Heavy/slow build,
    # so it is opt-in via a compose profile. Start it with:  docker compose --profile face-biometrics up -d
    profiles: ["face-biometrics"]
    build:
      context: ./services/liveness
    container_name: ezto-liveness
    restart: unless-stopped
    depends_on:
      minio: { condition: service_healthy }
    ports: ["5000:5000"]
    environment:
      MINIO_HOST: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET: minioadmin123
      FACE_TOLERANCE: "0.68"

volumes:
  pgdata: { driver: local }
  miniodata: { driver: local }
  esdata: { driver: local }
