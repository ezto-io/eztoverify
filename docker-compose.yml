# Verify OSS — the deployment stack. Service images are PULLED from REGISTRY at
# TAG; nothing is built here, so a deployer needs no toolchain.
#
# Brings up backing infra (postgres / minio / elasticsearch) plus the idp and
# its services, fronted by an nginx TLS proxy serving the idp at
# https://$DOMAIN/auth.
#
# Deploying:
#   ./scripts/deploy-compose.sh --domain <domain> --registry <prefix> --tag <tag>
# It generates a mode-600 .env, checks host preconditions, and starts the stack.
#
# By hand:
#   1. cp .env.example .env                       # fill in DOMAIN, REGISTRY, TAG, credentials
#   2. TLS certs in nginx/certs/ (fullchain.pem + privkey.pem) — real CA cert,
#      or for testing: DOMAIN=<your-domain> ./nginx/gen-self-signed.sh
#   3. Point DOMAIN at this host (DNS A record, or /etc/hosts -> 127.0.0.1)
#   4. docker compose up -d
#
#   docker compose down               # stop
#   docker compose down -v            # stop + WIPE volumes (irreversible)
#
# Building from source (contributors) — restores every build context:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# Plain-HTTP local development (app code in your IDE against containerised
# infra): use docker-compose.dev.yml instead — it is unaffected by this file.
#
# Every credential is read from .env as ${VAR:?}: an unset value stops the
# stack with a named error rather than silently falling back to a default.
#
# Operations, upgrade, rollback, restore: docs/deployment-compose.md

services:
  # Backing stores and internal services publish NO ports: they reach each other
  # over the compose network. Publishing one binds 0.0.0.0, which on a host with
  # a public address exposes the database, object storage, and an Elasticsearch
  # running with security disabled. nginx is the only entry point.
  #
  # If you genuinely need one for debugging, bind it to loopback explicitly —
  # ports: ["127.0.0.1:5432:5432"] — and remove it again afterwards.
  postgres:
    image: postgres:14-alpine
    container_name: ezto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: ezto-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: ezto-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # Credentials arrive through the environment rather than being interpolated
    # into the command string, so they never appear in the tracked file.
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET in .env}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:?set MINIO_SERVER_URL in .env}
    entrypoint: >
      /bin/sh -c "
      mc alias set local \"$$MINIO_SERVER_URL\" \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb -p \"local/$$MINIO_BUCKET\" || true &&
      mc anonymous set download \"local/$$MINIO_BUCKET/public\" || true
      "
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
    container_name: ezto-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: ["esdata:/usr/share/elasticsearch/data"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  idp:
    image: ${REGISTRY:?set REGISTRY in .env}/ezto-idp:${TAG:?set TAG in .env}
    container_name: ezto-idp
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      elasticsearch: { condition: service_healthy }
      background: { condition: service_healthy }
    # No published ports — nginx (80/443) is the only entry point. Internal
    # traffic (nginx -> idp, idp-init) uses 8080 on the compose network.
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: ${POSTGRES_HOST:?set POSTGRES_HOST in .env}
      KC_DB_URL_PORT: ${POSTGRES_PORT:?set POSTGRES_PORT in .env}
      KC_DB_USERNAME: ${POSTGRES_USER:?}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      KC_DB_URL_DATABASE: eztoverify
      # Master-realm admin, created on first boot against a fresh database.
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Public-TLS edge mode: nginx terminates HTTPS and forwards plain HTTP
      # with X-Forwarded-* headers; KC_PROXY=edge makes Keycloak trust them.
      KC_HOSTNAME_URL: https://${DOMAIN:?set DOMAIN in .env}/auth
      KC_HOSTNAME: ${DOMAIN:?}
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      IDP_HOST: http://idp:8080
      ENV: prod
      # Runtime product discriminator. RealmManager.createRealm + .ftl templates call
      # EnvironmentReader.getValue("VARIANT").equalsIgnoreCase(...) with no null guard —
      # unset => NPE during master-realm bootstrap. "ezto verify" = the Verify offering.
      VARIANT: "ezto verify"
      DASHBOARD_URL: https://${DOMAIN:?}
      # Admin-console "Docs" link target. Set to your self-hosted documentation URL.
      # Leave empty to show the bundled "documentation not configured" page instead.
      DOCS_URL: ${DOCS_URL:-}
      # "Docs" link in emails / welcome page / account console. Set to your self-hosted docs URL;
      # leave empty to hide those links.
      DOCS_LINK: ${DOCS_LINK:-}
      # Welcome page isLocal() does ROOT_ACCESS_IP.split(",") with no null guard —
      # unset => NPE => catch rethrows HTTP 500 on GET /auth/. Admin-route whitelist.
      # Behind nginx (KC_PROXY=edge) the gate compares the X-Real-IP header, which is
      # the real address of the browser doing the onboarding — not this host's own
      # address. Exact IPs, no CIDR.
      ROOT_ACCESS_IP: ${ROOT_ACCESS_IP:?set ROOT_ACCESS_IP in .env}
      # Each URL must be empty when its service is not running, so the IdP does
      # not advertise something absent. See .env.example.
      BACKGROUND_JOB_URL: ${BACKGROUND_JOB_URL:-}
      SHORTENER_HTTPS_URL: ${SHORTENER_HTTPS_URL:-}
      SHORTENER_HTTP_URL: ${SHORTENER_HTTP_URL:-}
      SOCKET_URL: ${SOCKET_URL:-}
      LIVELINESS_URL: ${LIVELINESS_URL:-}
      SHORTENER_KEY: ${SHORTENER_KEY:?set SHORTENER_KEY in .env}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:?}
      # v1 deliberately gives the application MinIO ROOT credentials. A leaked
      # .env therefore yields full MinIO root access rather than scoped bucket
      # access; a dedicated application key pair is recorded follow-up work.
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?set MINIO_PUBLIC_URL in .env}
      ES_HOST: ${ES_HOST:?set ES_HOST in .env}
      ES_PORT: ${ES_PORT:?set ES_PORT in .env}
      ES_SCHEME: ${ES_SCHEME:?set ES_SCHEME in .env}
      # SMTP is configured per-tenant in the onboarding wizard (real provider). For local
      # email testing run the maildev catcher from docker-compose.dev.yml and set
      # SMTP_HOST=localhost SMTP_PORT=1025.
      APP_PUSH_VERSION: 9.3.1
    healthcheck:
      # temurin jre has no curl; a bash TCP probe confirms the HTTP port is accepting.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # One-shot: pin the master realm's Require-SSL after the idp is up.
  # Keycloak seeds the master realm with sslRequired=EXTERNAL (ApplianceBootstrap);
  # serving real HTTPS we keep that secure default explicitly. There is NO Keycloak
  # env for per-realm sslRequired, so we set it via kcadm. Runs over the idp's own
  # loopback (network_mode: service:idp) so the call bypasses the SSL policy.
  # Override MASTER_SSL_REQUIRED=none only for throwaway plain-HTTP experiments.
  idp-init:
    image: ${REGISTRY:?}/ezto-idp:${TAG:?}
    container_name: ezto-idp-init
    depends_on:
      idp: { condition: service_healthy }
    network_mode: "service:idp"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      MASTER_SSL_REQUIRED: external
    entrypoint:
      - /bin/sh
      - -c
      - >
        KC=/opt/keycloak/bin/kcadm.sh; CFG=/tmp/kcadm.config;
        $$KC config credentials --config $$CFG --server http://localhost:8080/auth
        --realm master --user "$$KEYCLOAK_ADMIN" --password "$$KEYCLOAK_ADMIN_PASSWORD" &&
        $$KC update realms/master --config $$CFG -s sslRequired="$${MASTER_SSL_REQUIRED:-external}"
    restart: "no"

  # Fail fast with a readable message when TLS certs are missing, instead of
  # letting nginx crash-loop on an ssl_certificate load error.
  certs-check:
    image: alpine:3.20
    container_name: ezto-certs-check
    volumes:
      - ./nginx/certs:/certs:ro
    entrypoint:
      - /bin/sh
      - -c
      - >
        if [ ! -s /certs/fullchain.pem ] || [ ! -s /certs/privkey.pem ]; then
        echo 'ERROR: TLS certs missing/empty in nginx/certs/ (need fullchain.pem + privkey.pem).' >&2;
        echo '       Real deploy: drop your CA cert there (e.g. Let'\''s Encrypt).' >&2;
        echo '       Local test: DOMAIN=<your-domain> ./nginx/gen-self-signed.sh' >&2;
        exit 1;
        fi
    restart: "no"

  # TLS edge: terminates HTTPS for https://$DOMAIN/auth, 80->443 redirect,
  # proxies to idp:8080 with forwarded headers (see nginx/templates/).
  nginx:
    image: nginx:1.27-alpine
    container_name: ezto-nginx
    restart: unless-stopped
    depends_on:
      certs-check: { condition: service_completed_successfully }
      idp: { condition: service_started }
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (e.g. verify.example.com) — see .env.example}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro

  background:
    image: ${REGISTRY:?}/ezto-background:${TAG:?}
    container_name: ezto-background
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      JOB_DB_TYPE: psql
      JOB_DB_URL: jdbc:postgresql://${POSTGRES_HOST:?}:${POSTGRES_PORT:?}/jobrnr
      JOB_DB_USER: ${POSTGRES_USER:?}
      JOB_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
    healthcheck:
      # idp queries background at startup (management-keys scheduler) — wait for it.
      # temurin jre has bash but no curl; use a bash TCP probe on the HTTP port.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8070' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  socket:
    image: ${REGISTRY:?}/ezto-socket:${TAG:?}
    container_name: ezto-socket
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PORT: "3001"
      PGHOST: ${POSTGRES_HOST:?}
      PGPORT: ${POSTGRES_PORT:?}
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: socket

  url-shortener:
    image: ${REGISTRY:?}/ezto-url-shortener:${TAG:?}
    container_name: ezto-url-shortener
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PORT: "3000"
      # The "urlshortner" spelling is intentional; it matches init-databases.sql.
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@${POSTGRES_HOST:?}:${POSTGRES_PORT:?}/urlshortner?schema=public
      VALID_API_KEYS: ${SHORTENER_KEY:?}
      FALLBACK_URL: https://${DOMAIN:?}

  liveness:
    # Face-match / liveness inference (Python + deepface/whisper). Only needed for biometric
    # face-liveness verification flows; the IdP does NOT depend on it to boot. Heavy/slow build,
    # so it is opt-in via a compose profile. Start it with:  docker compose --profile face-biometrics up -d
    profiles: ["face-biometrics"]
    image: ${REGISTRY:?}/ezto-liveness:${TAG:?}
    container_name: ezto-liveness
    restart: unless-stopped
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_HOST: ${MINIO_SERVER_URL:?}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      MINIO_SECRET: ${MINIO_ROOT_PASSWORD:?}
      FACE_TOLERANCE: "0.68"

volumes:
  pgdata: { driver: local }
  miniodata: { driver: local }
  esdata: { driver: local }
