<div class="form-group row">
  <label class="col-md-3 control-label">{{:: 'sandbox' | translate}}</label>
  <div class="col-md-9">
    <label for="sandbox">
        <div  class="os-toggler-w" ng-class="{on: identityProvider.config.sandbox}">
            <div class="os-toggler-i" id="sandbox-toggle">
                <div class="os-toggler-pill" ng-model="identityProvider.config.sandbox" name="sandbox" id="sandbox" onoffswitch >
                </div>
            </div>
        </div>
    </label>
  </div>
  <kc-tooltip>{{:: 'identity-provider.paypal-sandbox.tooltip' | translate}}</kc-tooltip>
</div>
