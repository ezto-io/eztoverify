<kc-menu></kc-menu>
<div class="content-w" ng-init="init()">
    <div class="content-i">
        <div class="content-box">
            <div class="row">
                <div class="col-sm-12">
                    <div class="element-wrapper pb-0">
                        <div class="element-actions d-flex align-items-center" data-ng-if="isConfigLoaded && configuredWorkflowsProviders.length > 0">
                            <button id="qv-addprovider__button" class="btn btn-primary"
                                data-title="{{:: 'intro-stream-connection-title' | translate}}" 
                                data-intro="{{:: 'intro-stream-connection' | translate}}"  ng-click="openStreams()">
                                <div data-ng-show="isOpening">
                                    <kc-action-button-loading></kc-action-button-loading>
                                </div>
                                <div data-ng-show="!isOpening">
                                    <i class="os-icon os-icon-external-link plus-icon mr-2"></i>
                                    {{:: 'open-workflows-config' | translate}}
                                </div>
                            </button>
                        </div>
                        <h1 class="element-header">{{:: 'workflows' | translate}}</h1>
                        <div data-ng-if="isConfigLoaded && !configuredWorkflowsProviders.length > 0">
                            <div class="element-box element-box-medium top-align">
                                <div class="no-entry-svg" data-intro="{{:: 'intro-no-policies-found' | translate}}">
                                    <img data-ng-src="{{resourceUrl}}/themes/img/streams.svg" alt="workflows-img"configuredWorkflowsProviders
                                        class="opacity-40 no-entry-display mb-2" />
                                    <p data-ng-show="!showReload" class="no-results-msg no-entry-display m-0">{{:: 'workflows-helptext' | translate}}</p>
                                    <p data-ng-show="!showReload" class="no-results-msg no-entry-display m-0 mb-4">{{:: 'workflows-helptext-second' |
                                        translate}}</p>
                                    <p data-ng-show="showReload" class="no-results-msg no-entry-display m-0 mb-4">{{:: 'workflows-reload-helptext' |
                                        translate}}</p>
                                    <button class="create-btn no-entry-display cursor-pointer" id="streamUrl"
                                        data-ng-click="openStreams()" ng-show="!showReload">
                                        <div ng-show="isOpening">
                                            <kc-action-button-loading></kc-action-button-loading>
                                        </div>
                                        <div ng-show="!isOpening" class="d-flex align-items-center">
                                            <svg style="height: 18px;width:18px;" class="mr-2" width="18" height="19" viewBox="0 0 18 19" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M9 1.5H5C2.79086 1.5 1 3.29086 1 5.5V13.5C1 15.7091 2.79086 17.5 5 17.5H13C15.2091 17.5 17 15.7091 17 13.5V9.5" stroke="currentColor" stroke-width="1.2"/>
                                                <path d="M17.0002 2.00078C17.0002 1.72464 16.7763 1.50078 16.5002 1.50078L12.0002 1.50078C11.7241 1.50078 11.5002 1.72464 11.5002 2.00078C11.5002 2.27692 11.7241 2.50078 12.0002 2.50078L16.0002 2.50078L16.0002 6.50078C16.0002 6.77692 16.2241 7.00078 16.5002 7.00078C16.7763 7.00078 17.0002 6.77692 17.0002 6.50078L17.0002 2.00078ZM11.4287 7.77933L16.8537 2.35433L16.1466 1.64723L10.7216 7.07223L11.4287 7.77933Z" fill="currentColor"/>
                                            </svg>
                                            <span>{{ :: 'create-config' | translate}}</span>
                                        </div>
                                    </button>
                                    <button data-ng-show="showReload" class="create-btn no-entry-display cursor-pointer" id="reload"
                                        data-ng-click="reload()">
                                        <i class="os-icon os-icon-rotate-cw client-secrete-icon ng-scope"></i>
                                        <span class="ml-2">  {{:: 'reload' | translate}} </span>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex flex-column streams pt-2 px-0" data-ng-if="isConfigLoaded && configuredWorkflowsProviders.length > 0">
                            <div class="d-flex justify-content-between w-100">
                                <p class="m-0 px-4 py-2">{{:: 'published-flows' | translate}}</p>
                                <button id="config-reload" class="btn border-0 text-primary bg-transparent font-weight-bold mr-3" data-ng-click="reload()">
                                    <i class="os-icon os-icon-rotate-cw client-secrete-icon ng-scope"></i>
                                </button>
                            </div>
                            <div class="p-3 stream-list" ng-repeat="app in connectedApps">
                                <div class="d-flex align-items-center w-100 gap-2" ng-click="setCurrentApp(app.connectedApp)">
                                    <img ng-if="app.iconUrl" class="steams-logo ml-3 mr-2"
                                        ng-src="{{app.iconUrl}}" />
                                    <svg ng-if="!app.iconUrl" class="steams-logo ml-3 mr-2" width="44" height="42" viewBox="0 0 44 42" fill="none" xmlns="http://www.w3.org/2000/svg">

                                    </svg>
                                    <h4 class="streams-title m-0">{{ :: app.connectedApp | translate}}</h4>
                                    <button class="ml-auto btn bg-transparent stream-show-btn" ng-class="{'stream-show-btn-active': currentApp === app.connectedApp}">
                                        <span class="mr-2">{{:: flow | translate}}</span>
                                        <svg width="10" height="16" viewBox="0 0 10 16" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <path
                                                d="M0.719944 12.28C0.587536 12.1377 0.515432 11.9497 0.518789 11.7554C0.522146 11.561 0.600701 11.3756 0.737944 11.238C0.875548 11.1007 1.061 11.0222 1.25531 11.0188C1.44963 11.0155 1.63768 11.0876 1.77994 11.22L3.99994 13.44L3.99994 2.55999L1.77994 4.77999C1.63768 4.9124 1.44963 4.9845 1.25531 4.98114C1.061 4.97779 0.875548 4.89923 0.737944 4.76199C0.600701 4.62438 0.522146 4.43894 0.518789 4.24462C0.515432 4.0503 0.587536 3.86225 0.719944 3.71999L4.21994 0.219989C4.36057 0.0795383 4.55119 0.000648499 4.74994 0.000648499C4.94869 0.000648499 5.13932 0.0795383 5.27994 0.219989L8.77994 3.71999C8.87867 3.81166 8.95084 3.92826 8.98885 4.05751C9.02687 4.18676 9.02932 4.32387 8.99594 4.45439C8.96257 4.58492 8.89461 4.70402 8.79922 4.79916C8.70384 4.8943 8.58455 4.96195 8.45394 4.99499C8.32357 5.02841 8.1866 5.02607 8.05743 4.98824C7.92827 4.95041 7.81169 4.87847 7.71994 4.77999L5.49994 2.55999L5.49994 13.44L7.71994 11.22C7.81162 11.1213 7.92822 11.0491 8.05747 11.0111C8.18672 10.9731 8.32382 10.9706 8.45435 11.004C8.58487 11.0374 8.70398 11.1053 8.79912 11.2007C8.89426 11.2961 8.96191 11.4154 8.99494 11.546C9.02836 11.6764 9.02603 11.8133 8.9882 11.9425C8.95036 12.0717 8.87842 12.1882 8.77994 12.28L5.27994 15.78C5.13932 15.9204 4.94869 15.9993 4.74994 15.9993C4.55119 15.9993 4.36057 15.9204 4.21994 15.78L0.719944 12.28Z"
                                                fill="currentColor" />
                                        </svg>
                                    </button>
                                </div>
                                <ul ng-show="currentApp===app.connectedApp" class="streams-subflows d-flex flex-column ml-4">
                                    <li class="p-3 d-flex justify-content-between align-items-center" ng-repeat="provider in configuredWorkflowsProviders" ng-if="provider.connectedApp === app.connectedApp">
                                        <p class="font-weight-normal text-dark mb-0" ng-class="{'text-disabled' : provider.enabled!='true'}">{{provider.flowName}}</p>
                                        <button ng-if="provider.enabled!='true'" class="streams-unsubscribe-btn py-1 px-2" ng-click="updateStreams(provider.flowId, true)">
                                            <div data-ng-show="updatingFlowId === provider.flowId">
                                                <kc-action-button-loading></kc-action-button-loading>
                                            </div>
                                            <div data-ng-show="updatingFlowId !== provider.flowId">
                                                {{:: 'workflow-subscribe' | translate}}
                                            </div>
                                        </button>
                                        <button ng-if="provider.enabled=='true'" class="streams-subscribe-btn py-1 px-2" ng-click="updateStreams(provider.flowId, false)">
                                            <div data-ng-show="updatingFlowId === provider.flowId">
                                                <kc-action-button-loading></kc-action-button-loading>
                                            </div>
                                            <div data-ng-show="updatingFlowId !== provider.flowId">
                                                {{:: 'workflow-subscribed' | translate}}
                                            </div>
                                        </button>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12" ng-if="!(searchLoaded)">
                <kc-loader loadertype="loaderTypeName"></kc-loader>
            </div>
        </div>
    </div>
</div>
