<kc-menu></kc-menu>
<div class="content-w" ng-init="init()">
    <div class="content-i">
        <div class="content-box">
            <div class="row">
                <div class="col-sm-12">
                    <div class="element-wrapper pb-0">
                        <div class="element-actions d-flex align-items-center">
                            <button data-ng-click="create()" id="create-branding-btn"  class="create-btn">
                                    <i class="os-icon os-icon-plus plus-icon"></i>
                                    {{:: 'create-branding' | translate}}
                            </button>
                        </div>
                        <h1 class="element-header">{{:: 'brandings' | translate}}</h1>
                        <div class="controls-above-table" ng-show="(searchLoaded &&  total > 0)">
                            <div class="form-inline justify-content-between">
                                <div class="form-group">
                                    <div class="element-search">
                                        <input class="form-control bg-color-transparent searchTerm" type="text" id="brandingSearch-input"
                                            placeholder="{{:: 'search-branding-placeholder' | translate}}"
                                            data-ng-model="search"
                                            class="form-control form-control-sm rounded bright search"
                                            onkeydown="if (event.keyCode == 13) document.getElementById('brandingSearch').click()">
                                        <i class="os-icon os-icon-search2 search-icon" id="brandingSearch"
                                            data-ng-click="handleSearch()"></i>
                                    </div>
                                </div>
                                <div>
                                    <select data-ng-model="max" ng-change="handleMaxChange()" id="brandingPageCount"
                                        data-ng-options="itemCount for itemCount in [5,10,50,100]"
                                        data-ng-show="total > 5"
                                        class="form-control form-control-sm rounded bright events-admin-search client-list-count-select">
                                        <option data-ng-repeat="itemCount in [5,10,50,100]"
                                            data-ng-selected="max === itemCount" data-ng-value="itemCount">
                                            {{ itemCount }}
                                        </option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="table-responsive-md clients-list" ng-if="searchLoaded &&  total > 0">
                            <table class="table table-light-bordered table-padded w-100 table-layout-fixed">
                                <thead> </thead>
                                <tbody class="p-3">
                                    <tr class="position-relative fadeUp" id="branding-card-{{$index}}" ng-repeat="branding in result"> 
                                        <td class="cursor-pointer w-40" id="{{branding.name.toLowerCase().replaceAll(' ','-')}}" kc-open="/realms/{{realm.realm}}/brandings/{{branding.id}}">
                                            <div class="conn-with-logo">
                                                <div class="overflow-ellipsis" >
                                                    <a class="aTagKcOpen header-text-primary" kc-open="/realms/{{realm.realm}}/brandings/{{branding.id}}">
                                                        <span class="ml-1">{{branding.name}}</span>
                                                    </a>
                                                </div>
                                            </div> 
                                        </td>
                                        
                                        <td class="nowrap w-40">
                                            <div class="lighter overflow-ellipsis">{{:: 'created-at' | translate}}: 
                                                <span class="helper-text ml-1">
                                                    {{branding.createdTimeStamp|timeago}}
                                                </span>
                                                
                                            </div>
                                        </td> 
                                        <td class="row-actions w-20">
                                            <a ng-class="{ 'mr-0': branding.name === 'default'}" id="{{branding.name.toLowerCase().replaceAll(' ','-')}}-edit" kc-open="/realms/{{realm.realm}}/brandings/{{branding.id}}">
                                                <i class="os-icon os-icon-ui-49" tooltip="{{:: 'edit' | translate}}" tooltip-placement="top"
                                                tooltip-trigger="mouseover mouseout"></i>
                                            </a>
                                            <a class="danger" data-ng-click="delete(branding)" ng-hide="branding.name === 'default'" id="{{branding.name.toLowerCase().replaceAll(' ','-')}}-delete">
                                                <i class="os-icon os-icon-ui-15" tooltip="{{:: 'tooltip-delete-label' | translate}}" tooltip-placement="top"
                                                tooltip-trigger="mouseover mouseout"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr>
                                        <div class="d-flex w-100 fadeUp-delayed"  data-ng-show="(searchLoaded && brandings && total > 5)">
                                            <td class="pl-0 fadeUp-delayed" colspan="3" >
                                                <p class="mt-1 mr-auto" data-ng-show="(searchLoaded && brandings && total > 5 ) || (searchLoaded && entries > 5)">{{:: 'showing' | translate}} {{first}} - {{last}} {{:: 'of' | translate}} {{total}} {{:: 'brandings' | translate}}</p>
                                            </td>
                                            <td class="pr-0 fadeUp-delayed" colspan="9">
                                                <div class="table-nav" data-ng-show="searchLoaded && brandings && total > 5">
                                                    <div class="pagination justify-content-end">
                                                        <button data-ng-click="firstPage()" id="go-to-first-page" class="btn btn-sm btn-outline-primary table-pagination" ng-disabled="first === 1" data-ng-class="first === 1 && 'text-muted'" > 
                                                            <i class="{{isRTL() ? 'ti-angle-double-right' : 'ti-angle-double-left' }} pagination-icon"></i> <i>{{:: 'first-page' | translate}}</i> 
                                                        </button>
                                                        <button class="btn btn-sm btn-outline-primary table-pagination" id="go-to-previous-page" data-ng-click="previousPage()" class="prev" ng-disabled="first === 1">
                                                            <i class="{{isRTL() ? 'ti-angle-right' : 'ti-angle-left' }} pagination-icon" data-ng-class="first == 1 && 'text-muted'"></i>
                                                            <i data-ng-class="first == 1 && 'text-muted'"> {{:: 'previous' | translate}} </i>
                                                        </button>
                                                        <button class="btn btn-sm btn-outline-primary table-pagination pr-0" id="go-to-next-page" data-ng-click="nextPage()" class="next" ng-disabled="last === total">
                                                            <i data-ng-class="last === total && 'text-muted'"> {{:: 'next' | translate}} </i>
                                                            <i class="{{isRTL() ? 'ti-angle-left' : 'ti-angle-right' }} pagination-icon mr-0" data-ng-class="last === total && 'text-muted'"></i>
                                                        </button>
                                                    </div>
                                                </div>
                                            </td>
                                        </div>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                        <div class="element-box top-align" ng-if="searchLoaded && result.length === 0">
                            <div class="no-policy-img">
                                <img data-ng-src="{{resourceUrl}}/themes/img/{{realm.mode === 'wiam' ? 'no-branding.svg' : realm.mode === 'ciam' ? 'no-branding-ciam.svg' : 'no-branding-bo.svg' }}" alt="no-branding-img" class="opacity-40 no-entry-display" />
                                <p class="no-results-msg no-entry-display mt-2">{{:: 'no-branding-found' | translate}}</p>
                                <button class="create-btn no-entry-display cursor-pointer" id="clearSearchBtn" data-ng-click="clearSearch()">
                                    <i class="os-icon os-icon-close mr-2"></i>
                                    {{ ::  'clear-search' | translate}}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div ng-if="!searchLoaded">
                <kc-loader loadertype="loaderTypeName" ></kc-loader>
            </div>
        </div>
    </div>
</div>
