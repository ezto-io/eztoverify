<kc-menu></kc-menu>
<div class="content-w min-h-100" ng-init="init()">
    <div class="content-i">
        <div class="content-box">
            <ul class="breadcrumb pd-left-0 pd-bottom-20">
                <li> 
                    <a href="#/realms/{{realm.realm}}/users/directory-sync/create" id="backToUserSync">
                        <i class="os-icon {{isRTL() ? 'os-icon-arrow-right7' : 'os-icon-arrow-left6' }} breadcrumb-back-icon"></i>{{:: 'back-user-directories' | translate}}
                    </a>
                </li>
            </ul>
            <div class="row">
                <div class="col-sm-12">
                    <div class="element-wrapper">
                        <div class="element-actions d-flex align-items-center">
                            <div data-ng-if="configuredProviders.length > 0">
                                <button class="create-btn no-entry-display" id="{{currentProvider.name.toLowerCase().replaceAll(' ','-')}}-createConnectionBtn" data-ng-click="save()">
                                    <i class="os-icon os-icon-plus plus-icon"></i>
                                    {{:: 'create-social-conn-btn' | translate}}
                                </button>
                            </div>
                            </div>
                            <h1 class="element-header text-capitalize">{{currentProvider.name}} {{:: 'adsync-connections' | translate}}</h1>
                            <!-- <div class="controls-above-table mb-0">
                                <div class="form-inline justify-content-between">
                                    <div class="form-group mb-auto mr-2" data-ng-show="configuredProviders.length > 0">
                                        <form class="form-inline">
                                            <div class="element-search">
                                                <input class="form-control bg-color-transparent searchTerm ng-pristine ng-valid ng-empty ng-touched action-search-container" type="text" placeholder="{{:: 'search-connections-placeholder' | translate}}"  ng-model="search" onkeydown="if (event.keyCode === 13) document.getElementById('socialConnectionsSearch').click()">
                                                <i class="os-icon os-icon-search2 search-icon" id="socialConnectionsSearch" data-ng-click="changeSearchKey(search)"></i>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div> -->
                            <div class="mt-4" data-ng-if="configuredProviders.length > 0 && !searchKey">
                                <div class="element-box-tp">
                                    <div class="table-responsive-md clients-list">
                                        <table class="table table-padded">
                                            <thead> </thead>
                                            <tbody class="p-3">
                                                <tr ng-repeat="connection in configuredProviders" class="fadeUp"> 
                                                    <td class="cursor-pointer w-40" kc-open="/realms/{{realm.realm}}/users/directory-sync/connections/{{currentProvider.id}}/{{connection.id}}">
                                                        <div class="conn-with-logo">
                                                            <div class="social-conn-logo-container">
                                                                <img alt="{{connection.provider.name}}" data-ng-src="{{resourceUrl}}/themes/img/social-icons/{{currentProvider.id}}-logo.png">
                                                            </div>
                                                            <div>
                                                                <a class="text-decoration-none cursor-pointer" id="{{connection.name.toLowerCase().replaceAll(' ','-')}}" href="#/realms/{{realm.realm}}/users/directory-sync/connections/{{currentProvider.id}}/{{connection.id}}">
                                                                    <span class="ml-1 text-capitalize font-size-normal">{{connection.name}}</span>
                                                                </a>
                                                            </div>
                                                        </div> 
                                                    </td>
                                                    <td class="nowrap">
                                                        <div class="user-id-container justify-content-center">
                                                            {{:: 'adsync-connectionID' | translate}} <code class="user-id-code overflow-ellipsis"> {{connection.id}} </code>
                                                        </div>
                                                    </td>
                                                    <td class="clip row-actions">
                                                        <a class="danger" data-ng-click="deleteConnection(connection)" id="{{connection.name.toLowerCase().replaceAll(' ','-')}}-deleteIcon"><i class="os-icon os-icon-ui-15"
                                                                tooltip="{{:: 'tooltip-delete-label' | translate}}" tooltip-placement="top"
                                                                tooltip-trigger="mouseover mouseout"></i></a>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>

                            <!-- <div class="element-box element-box-medium top-align" ng-show="searchKey && !findConfigured(searchKey)">
                                <div class="no-entry-svg">
                                    <i class="os-icon os-icon-cv-2 opacity-75 no-entry-display mb-3 icon-custom-50"></i>
                                  <p class="text-center no-entry-display mt-2 col-md-5">{{:: 'no-social-conn-found' | translate}}</p>
                                    <button data-ng-click="clearSearch()" class="create-btn no-entry-display">
                                        <i class="os-icon {{isRTL() ? 'os-icon-arrow-right7' : 'os-icon-arrow-left6' }} breadcrumb-back-icon"></i>
                                        {{:: 'back-to-social-conn' | translate}}
                                    </button>
                                </div>
                            </div> -->

                            <div class="element-box mt-4" data-ng-if="!configuredProviders.length">
                                <div class="no-policy-img">
                                    <i class="os-icon os-icon-cv-2 opacity-75 no-entry-display mb-3 icon-custom-50"></i>
                                    <p class="text-center no-entry-display">{{:: 'no-social-conn-configured' | translate}}</p>
                                        <button class="create-btn no-entry-display" data-ng-click="save()" id="{{currentProvider.name.toLowerCase().replaceAll(' ','-')}}-createConnectionBtn" >
                                            <i class="os-icon os-icon-plus plus-icon"></i>
                                            {{:: 'create-social-conn-btn' | translate}}
                                        </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
