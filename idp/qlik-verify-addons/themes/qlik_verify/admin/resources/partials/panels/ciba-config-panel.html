<div id="panel-close" data-ng-click="dismissPanel()" class="mt-3 pr-3">
    <i class="os-icon os-icon-close"></i>
</div>
<div class="auth-config-container pb-3">
    <div class="exec-logo-container">
        <i class="os-icon os-icon-code font-weight-600 auth-panel-icon"> </i>
    </div>
    <div class="exec-title"> 
        <p>{{:: provider.displayName | translate }}</p>
    </div>
</div>
<div id="divisionthing"></div>
<p id="header1" class="mt-4 mb-0">{{:: 'auth-settings' | translate}}</p>
<form class="form-horizontal mb-4 pl-2 mt-3" name="realmForm" novalidate >
    <div class="proplist">
        <!-- Config Settings -->
        <div>
            <div class="form-group panel-responsive">
                <!-- <div class="form-group row clearfix">
                    <label class="col-md-3 control-label" for="name">{{:: 'enable' | translate}}<span class="required"> *</span></label>
                    <div class="col-md-9 ">
                        <label>
                            <div class="os-toggler-w"
                                ng-class="{on: execCheck.isEnabled}">
                                <div class="os-toggler-i">
                                    <div class="os-toggler-pill"
                                        ng-model="execCheck.isEnabled" id="execEnabled"
                                        onoffswitch>
                                    </div>
                                </div>
                            </div>
                        </label>
                    </div>
                </div> -->
                <div data-ng-if="provider.hasConfig">
                    <kc-provider-config realm="realm" config="config.config" properties="configType"></kc-provider-config>
                </div>
            </div>

            <div class="form-buttons-w border-top-0 mb-5 pb-2">
                <div class="col-md-12 px-0 d-flex justify-content-md-end flex-wrap gap-1" ng-class="{'justify-content-lg-between':config.config['queue-way'] == 'kafka'}">
                    <button id="testBtn" data-ng-if="config.config['queue-way'] == 'kafka'" data-ng-disabled="!changed" class="btn btn-secondary" data-ng-click="test()">
                        <span data-ng-if=" teststage === 1 " >{{:: 'test-configuration' | translate}}</span>
                        <div data-ng-if=" teststage === 2 ">
                            <kc-action-button-loading></kc-action-button-loading>
                        </div>
                    </button>
                    <div class="d-flex">
                        <button id="cancelBtn" kc-reset data-ng-disabled="!changed">{{:: 'cancel' | translate}}</button>
                        <button class="ml-3" kc-save data-ng-disabled="!changed || (config.config['queue-way'] == 'kafka' ? !istestConfigured : false) " id="saveBtn">
                            <span ng-show="stage === 1" >{{:: 'save' | translate}}</span>
                            <div ng-show="stage === 2">
                                <kc-action-button-loading></kc-action-button-loading>
                            </div>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
