<div id="panel-close" data-ng-click="dismissPanel()" class="mt-3 pr-3">
    <i class="os-icon os-icon-close"></i>
</div>
<div class="auth-config-container pb-3">
    <div class="exec-logo-container">
        <i class="os-icon os-icon-code font-weight-600 auth-panel-icon"> </i>
    </div>
    <div class="exec-title"> 
        <p>{{ notification }}</p>
    </div>
</div>
<div id="divisionthing"></div>
<p id="header1" class="mt-4 mb-0">{{:: 'auth-settings' | translate}}</p>
<form class="form-horizontal mb-4 pl-2 mt-3" name="realmForm" novalidate >
    <div class="proplist">
        <kc-provider-config realm="realm" config="config" properties="properties"></kc-provider-config>
    </div>
    <div class="form-buttons-w border-top-0">
        <div class="col-md-12 d-flex flex-row-reverse pr-0">
            <button class="ml-3" kc-save data-ng-disabled="!changed">
                <span ng-show="stage === 1" >{{:: 'save' | translate}}</span>
                <div ng-show="stage === 2">
                    <kc-action-button-loading></kc-action-button-loading>
                </div>
            </button>
            <button id="cancelBtn" kc-reset data-ng-disabled="!changed">{{:: 'cancel' | translate}}</button>
        </div>
    </div>
</form>
