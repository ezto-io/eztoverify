<div class="content-w">
    <div class="content-i">
        <div class="server-info-content-box">
            <div class="row">
                <div class="col-sm-12">
                    <div class="element-wrapper">
                        <h1 class="element-header">
                            {{:: 'server-info' | translate}}
                            <i id="serverInfoReload" class="pficon  pficon-restart clickable" data-ng-click="serverInfoReload()"></i>
                        </h1>
                        <div class="os-tabs-w">
                            <div class="os-tabs-controls">
                                <ul class="nav nav-tabs upper">
                                    <li class="nav-item">
                                        <a aria-expanded="false" class="nav-link" href="#/server-info"> 
                                            {{:: 'info' | translate}}
                                        </a>
                                    </li>
                                    <li class="nav-item">
                                        <a aria-expanded="false" class="nav-link active" href="#/server-info/providers">
                                            {{:: 'providers' | translate}}
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </div>


                        <table class="table table-striped table-bordered">
                            <thead>
                            <tr>
                                <th class="kc-table-actions" colspan="5">
                                    <div class="form-inline">
                                        <div class="form-group">
                                            <div class="input-group">
                                                <input type="text" placeholder="{{:: 'search.placeholder' | translate}}" data-ng-model="search" class="form-control search" onkeyup="if(event.keyCode == 13){$(this).next('I').click();}">
                                            </div>
                                        </div>
                                    </div>
                                </th>
                            </tr>
                            <tr>
                                <th width="20%" class="font-weight-bold font-size-14 letter-spacing-sm">{{:: 'spi' | translate}}</th>
                                <th class="font-weight-bold font-size-14 letter-spacing-sm">{{:: 'providers' | translate}}</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr data-ng-repeat="spi in (providers | filter:search)">
                                <td>{{spi.name}}</td>
                                <td>
                                    <div data-ng-repeat="(providerName, provider) in spi.providers">
                                        {{providerName}}
                                        <span ng-show="provider.operationalInfo">
                                            <button type="button" class="btn btn-secondary btn-xs ml-2 px-2 py-0" ng-click="collapseRep = !collapseRep">
                                                <span class="os-icon os-icon-arrow-down2" data-ng-show="!collapseRep"></span>
                                                <span class="os-icon os-icon-arrow-up ml-0" data-ng-show="collapseRep"></span>
                                            </button>
                                            <table ng-show="collapseRep" class="table table-striped table-bordered mt-3" >
                                                <tr ng-repeat="(key, value) in provider.operationalInfo">
                                                    <td width="20%">{{key}}</td>
                                                    <td>{{value}}</td>
                                                </tr>
                                            </table>
                                        </span>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
