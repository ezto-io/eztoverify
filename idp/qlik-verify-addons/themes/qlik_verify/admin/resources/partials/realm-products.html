<kc-menu></kc-menu>
<div class="position-relative"> 
  <div class="position-absolute">
    <kc-settings-menu class="position-fixed bo-setting-sidemenu" id="setting-sidebar"></kc-settings-menu>
    <div class="bg-white p-2 bo-setting-sidemenu-icon" id="setting-sidebar-icon" data-ng-click="toggleSideBarShow()" >
      <div id="setting-icon h1">
        <i class="ti-angle-right cursor-pointer"></i>
      </div>
    </div>
  </div>
</div>
<div class="content-w bo-setting-menu-main-content">
    <div class="content-i">
        <div class="content-box">
            <div class="row" data-ng-show="!loading">
                <div class="col-sm-12">
                    <div class="element-wrapper"> 
                        <kc-tabs-management></kc-tabs-management>
                        <div class="admin-user-list-heading-container controls-above-table py-0 mb-4" data-ng-hide="products.length == 0 && searchValue.trim().length == 0" >
                            <!-- Search Bar -->
                            <div class="element-search">
                                <input class="form-control bg-color-transparent searchTerm" id="productSearchInput" type="text" placeholder="{{:: 'search-products' | translate}}" data-ng-model="searchValue" class="form-control form-control-sm rounded bright search" onkeydown="if (event.keyCode == 13) document.getElementById('productSearch').click()">
                                <i class="os-icon os-icon-search2 search-icon" id="productSearch" data-ng-click="pageCountChanged()"></i>
                            </div>
                            <div>
                                <!-- Add Product -->
<!--                                <button class="create-btn" id="createProduct" data-ng-click="createNewProduct()" data-ng-if="isRootAccount">-->
<!--                                    <i class="os-icon os-icon-plus plus-icon"></i>-->
<!--                                    {{:: 'add-product' | translate}}-->
<!--                                </button>-->
                            </div>
                        </div>
                        <div>
                            <!-- No Products Available -->
                            <div class="element-box element-box-medium" data-ng-if="products.length == 0 && searchValue.trim().length == 0">
                                <div class="no-entry-svg">
                                    <img data-ng-src="{{resourceUrl}}/themes/img/no-pricing.svg" alt="no-users-svg" class="no-entry-display my-4" />
                                    <p class="no-results-msg no-entry-display no-entry-display">{{:: 'products-not-found' | translate}}</p>
                                    <button class="create-btn no-entry-display" id="createProductBtn" data-ng-click="createNewProduct()">
                                        <i class="os-icon os-icon-plus plus-icon"></i>
                                        {{:: 'add-product' | translate}}
                                    </button>
                                </div>
                            </div>
                            <!-- No Products with search result -->
                            <div class="element-box element-box-medium" data-ng-if="products.length == 0 && searchValue.trim().length > 0">
                                <div class="no-entry-svg">
                                    <img data-ng-src="{{resourceUrl}}/themes/img/no-pricing.svg" alt="no-users-svg" class="no-entry-display my-4" />                                   
                                    <p class="no-results-msg no-entry-display">{{ :: 'products-not-found' | translate}}</p>
                                    <button class="create-btn no-entry-display cursor-pointer" id="clearSearchBtn" data-ng-click="clearSearch()">
                                        <i class="os-icon os-icon-close mr-2"></i>
                                        {{ ::  'clear-search' | translate}}
                                    </button>
                                </div>
                            </div>
                            <!-- Products List -->
                            <div class="table-responsive-md clients-list" data-ng-if="products.length > 0">
                                <table class="table table-light-bordered table-padded table-layout-fixed w-100" id="user-table">
                                    <tbody>
                                        <tr class="user-row position-relative fadeUp" data-ng-repeat="product in products | filter: {name: searchValue} | orderBy: 'name'">
                                            <td class="cursor-pointer {{isRootAccount ? 'w-40' : 'w-50'}}" kc-open="/realms/{{realm.realm}}/products/{{subRealm.realm}}/{{product.productId}}" id="product-{{product.name.toLowerCase().replaceAll(' ','-')}}">
                                                <div class="d-flex">
                                                    <div class="img-container mr-3">
                                                        <img class="irs" data-ng-src="{{getImage(product.image)}}" alt="product-pic" />
                                                    </div>
                                                    <div class="name-container align-items-center" >
                                                        <p class="overflow-ellipsis mb-0 text-primary" >{{product.name}}</p>
                                                    </div>
                                                </div>
                                            </td>
                                            <td class="nowrap w-50">
                                                <div class="user-id-container">
                                                    <span>{{ ::'id' | translate}} - </span>
                                                    <code class="user-id-code overflow-ellipsis"> {{product.productId}} </code>
                                                    <i class="os-icon os-icon-copy copy-paste-icon cursor-pointer"
                                                        data-ng-click="copytoClipboard(product.productId)"
                                                        tooltip="{{tooltipTxt}}" tooltip-placement="top"
                                                        tooltip-trigger="mouseover mouseout" id="{{product.name.toLowerCase().replaceAll(' ','-')}}-copyIcon">
                                                    </i>
                                                </div>
                                            </td>
                                            <td class="clip row-actions w-10" data-ng-if="isRootAccount">
                                                <div class="dropdown clearfix">
                                                    <div class="dropdown">
                                                        <button id="dLabel-{{product.name.toLowerCase().replaceAll(' ','-')}}" class="dropdown-btn" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" data-ng-click="toggleShow($index)">
                                                            <i class="os-icon os-icon-more-horizontal"></i>
                                                        </button>
                                                        <ul class="dropdown-menu dropdown-menu-right" aria-labelledby="dLabel">
                                                            <li><a class="dropdown-item" kc-open="/realms/{{realm.realm}}/products/{{subRealm.realm}}/{{product.productId}}" id="edit-{{product.name.toLowerCase().replaceAll(' ','-')}}">{{ ::'edit' | translate}}</a></li>
                                                        </ul>
                                                    </div> 
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Loader -->
            <div ng-if="loading">
                <kc-loader loadertype="loaderTypeName" ></kc-loader>
            </div>
        </div>
    </div>
  </div>
</div>
