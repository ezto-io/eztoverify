<kc-menu></kc-menu>
<div class="content-w">
  <div class="content-i">
    <div class="content-box">
      <div class="row">
        <ol class="breadcrumb pl-2">
          <li>
            <a
              href="#/realms/{{realm.realm}}/clients/type/{{ client.appType.replaceAll('_', '-') }}{{realm.mode==='bo' ? client.sandboxMode ? '/sandbox' : '/live' : ''}}"
              id="backToApplicationsList"
            >
              <i class="os-icon  {{isRTL() ? 'os-icon-arrow-right7' : 'os-icon-arrow-left6' }} breadcrumb-back-icon"></i>{{
              :: 'back-to-applications' | translate}}
            </a>
          </li>
        </ol>
        <div class="col-sm-12">
          <div class="element-wrapper">
            <kc-tabs-app></kc-tabs-app>
            <kc-tabs-client></kc-tabs-client>

            <form
              class="form-horizontal"
              name="clientForm"
              novalidate
              kc-read-only="!client.access.configure"
            >
              <div class="element-box">
                <fieldset class="margin-top-16">
                  <div class="form-group row">
                    <label for="actions" class="col-md-3 control-label"
                      >{{:: 'gatepass-rule' | translate}}</label
                    >
                    <div class="col-md-9">
                      <div data-ng-if="cibaPolicies.length > 0">
                        <select
                          id="gatepass_rule"
                          ng-model="clientEdit.attributes['gatepass_rule']"
                          class="form-control"
                        >
                          <option value="">
                            {{:: 'ciba-connection-default-option' | translate }}
                          </option>
                          <option
                            ng-selected="clientEdit.attributes['gatepass_rule'] == p.id"
                            ng-repeat="p in cibaPolicies"
                            ng-value="p.id"
                          >
                            {{p.policyName}}
                          </option>
                        </select>
                        <kc-tooltip
                          >{{:: 'gatepass.tooltip' | translate}}</kc-tooltip
                        >
                        <small
                          data-ng-if="clientEdit.attributes['gatepass_rule']"
                          ><a
                            href="#/realms/{{realm.realm}}/policies/ciba/{{clientEdit.attributes['gatepass_rule']}}"
                            >{{:: 'click' | translate}}</a
                          >
                          {{:: 'view-rule-suffix' | translate}}</small
                        >
                      </div>
                      <div data-ng-if="cibaPolicies.length === 0">
                        <p class="mb-1">
                          {{:: 'client-connection-action-bo' | translate}}
                        </p>
                        <p>
                          <a
                            href="#/realms/{{realm.realm}}/policies"
                            id="template-click-here"
                            >{{:: 'click-here' | translate}}</a
                          >
                          {{:: 'create-one' | translate}}
                        </p>
                      </div>
                    </div>
                  </div>
                </fieldset>
                <br />
                <div class="form-group row">
                  <div
                    class="col-md-12 d-flex flex-row-reverse"
                    data-ng-show="client.access.configure"
                  >
                    <button
                      class="ml-3"
                      kc-save
                      data-ng-disabled="!changed"
                      id="saveBtn"
                    >
                      <span ng-show=" stage === 1 "
                        >{{:: 'save' | translate}}</span
                      >
                      <div ng-show=" stage === 2 ">
                        <kc-action-button-loading></kc-action-button-loading>
                      </div>
                    </button>
                    <button id="cancelBtn" kc-reset data-ng-disabled="!changed">
                      {{:: 'cancel' | translate}}
                    </button>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
