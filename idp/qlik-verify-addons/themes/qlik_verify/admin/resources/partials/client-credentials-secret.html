<div class="form-group row" kc-read-only="!client.access.configure" data-ng-controller="ClientSecretCtrl" >
    <label class="col-md-3 control-label" for="secret">{{:: 'client-secret' | translate}}</label>
    <div class="col-md-9">
        <div class="input-group secret-input" id="show_hide_password">
            <input readonly class="form-control br-top-4 br-bottom-4" type="password" id="secret" name="secret" data-ng-model="secret">
            <div class="input-group-prepend hide_show">
                <a href="" data-ng-click="hideShowPassword()" id="app-secret-view"><span class="input-group-text tio visible_outlined hide_show_icon mr-5" tooltip="{{tooltipTxtReveal}}" tooltip-placement="top" tooltip-trigger="mouseover mouseout"></span></a>
            </div>
            <i class="os-icon os-icon-rotate-cw client-secrete-icon" id="app-secret-reset" data-ng-click="changePassword()" tooltip="{{::'rotate-secret-title' | translate}}" tooltip-placement="bottom" tooltip-trigger="hover mouseover mouseout"></i>
            <i class="os-icon os-icon-copy copy-icon client-secrete-icon" id="app-secret-copy" data-ng-click="copyToClipboard('#secret')"  tooltip="{{tooltipTxt}}" tooltip-placement="top" tooltip-trigger="hover mouseover mouseout"></i>
        </div>
    </div>
</div>
