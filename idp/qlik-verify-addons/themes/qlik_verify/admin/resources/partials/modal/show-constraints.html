<div class="modal-header">
    <h5 class="modal-title">{{:: 'constraint-modal-title'| translate}}</h5>
    <button type="button" class="close" ng-click="cancel()">
        <span class="os-icon os-icon-close"></span>
    </button>
</div>
<div class="modal-body">
    <ul class="blue-zone-list" data-ng-repeat="constraint in constraints">
        <li>
            <div class="blue-zone-container">
                <div>
                    <h4 class="blue-zone-title ng-binding">{{ :: 'constraint-modal-ul-title' | translate}} {{$index + 1}}</h4>
                    <p class="mb-0 ng-binding">{{constraint.message}}</p>
                </div>
                <div class="pull-right">
                    <a href="{{constraint.redirectUrl}}" data-ng-click="cancel()" class="mr-2 mt-2 btn btn-primary">{{ :: 'take-me-txt' | translate}}</a>
                </div>
            </div>
        </li>
    </ul>
</div>
