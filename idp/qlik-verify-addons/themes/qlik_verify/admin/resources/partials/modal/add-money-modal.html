<form>
  <div class="modal-header">
    <h5 class="mb-1">{{title}}</h5>
    <button type="button" class="close" ng-click="cancel()">
      <span class="os-icon os-icon-close"></span>
    </button>
  </div>
  <div class="modal-body pb-4">
    <label>{{:: 'enter-the-amount' | translate}}</label>
    <div>
      <input class="form-control" type="number" id="subscription-amount"  data-ng-model="subscriptionAmount"/>
      <kc-tooltip>{{:: 'add-money-min-value-helptxt' | translate}}</kc-tooltip>
    </div>
    <div class="d-flex justify-content-end mt-4">
      <button class="btn btn-primary" id="addMoneyBtn" data-ng-click="addMoney()" ng-disabled="subscriptionAmount < 500">{{:: 'add' | translate}}</button>
    </div>
  </div>
</form>
