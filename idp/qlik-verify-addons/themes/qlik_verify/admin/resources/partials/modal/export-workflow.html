<div class="modal-header">
    <h5 class="modal-title" ng-if="!isSubWorkflow">{{:: 'export-workflow' | translate}}</h5>
    <h5 class="modal-title" ng-if="isSubWorkflow">{{:: 'export-subworkflow' | translate}}</h5>
    <button type="button" class="close" ng-click="cancel()">
        <span class="os-icon os-icon-close"></span>
    </button>
</div>
<div class="modal-body">
    <form>
        <div>
            <label class="control-label" for="selector">{{:: 'name' | translate}} <span class="required" >*</span></label>
                <input id="name" maxlength="48" class="form-control margin-bottom-10" type="text" data-ng-model="exportFileName">
            </input>
        </div>
    </form>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" ng-click="cancel()">{{:: 'cancel' | translate}}</button>
    <button type="button" class="btn btn-primary" ng-click="ok()" data-ng-disabled="exportFileName.length == 0">{{:: 'create' | translate}}</button>
</div>
