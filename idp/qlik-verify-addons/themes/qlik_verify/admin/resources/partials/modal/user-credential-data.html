<div class="modal-header">
    <h5 class="modal-title">{{:: 'Device Detail' | translate}}</h5>
    <button type="button" class="close" ng-click="cancel()">
        <span class="os-icon os-icon-close"></span>
    </button>
</div>
<div class="modal-body mb-3">
    <table class="table table-light-bordered table-padded table-layout-fixed w-100">
        <tr  class="user-row position-relative fadeUp" ng-repeat="key in keys(credentialData) | orderBy">
            <td class="font-weight-bold d-flex justify-content-between"><span>{{key}}</span><span>:</span></td>
            <td class="value">{{credentialData[key]}}</td>
        </tr>
    </table>
</div>
