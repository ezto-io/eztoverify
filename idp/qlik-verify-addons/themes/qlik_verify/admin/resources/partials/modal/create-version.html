<div class="modal-header">
    <h5 class="modal-title">{{:: 'version-number' | translate}}</h5>
    <button type="button" class="close" ng-click="cancel()">
        <span class="os-icon os-icon-close"></span>
    </button>
</div>
<div class="modal-body">
    <form>
        <div>
            <label class="control-label" for="selector">{{:: 'enter-version-number' | translate}} <span class="required" >*</span></label>
            <input type="text"  maxlength="48" ng-model="version" class="form-control" ng-change="handleVersion(version)">
        </div>
    </form>
</div>
<div class="modal-footer pt-4">
    <button type="button" class="btn btn-primary" id="saveBtn" ng-click="save(version)" data-ng-disabled="!changed">{{::'save' | translate}}</button>
</div>
