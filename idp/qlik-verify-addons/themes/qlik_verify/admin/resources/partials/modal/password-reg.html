<div class="modal-header">
    <h5 class="modal-title">{{title}}</h5>
    <button type="button" class="close" ng-click="cancel()">
        <span class="os-icon os-icon-close"></span>
    </button>
</div>
<div class="modal-body">
    <form class="form-group">
        <div>
            <label class="control-label" for="newPassword">{{:: 'new-password' | translate}} <span class="required" >*</span></label>
            <div class="input-group" id="show_hide_new_password">
                <input class="form-control br-top-4 br-bottom-4" type="password" id="newPassword" data-ng-model="newPasswd.value" />
                <div class="input-group-prepend hide_show">
                    <a href="" data-ng-click="hideShowNewPassword()"><span class="input-group-text tio hidden_outlined bottom-auto r-0"></span></a>
                </div>
            </div>
        </div>
        <div class="mt-3">
            <label class="control-label" for="confirmNewPassword">{{:: 'confirm-new-password' | translate}} <span class="required" >*</span></label>
            <div class="input-group" id="show_hide_confirm_password">
                <input class="form-control br-top-4 br-bottom-4" type="password" id="confirmNewPassword" data-ng-model="confirmNewPasswd.value" />
                <div class="input-group-prepend hide_show">
                    <a href="" data-ng-click="hideShowConfirmPassword()"><span class="input-group-text tio hidden_outlined bottom-auto r-0"></span></a>
                </div>
            </div>
        </div>
        <p  id="error_msg" data-ng-if="error">{{error}}</p>
    </form>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" ng-click="cancel()">{{:: 'cancel' | translate}}</button>
    <button type="button" id="submitBtn" class="btn btn-primary"  data-ng-disabled="!(pwdChanged && cnfPwdChanged)" ng-click="ok()">{{:: 'save' | translate}}</button>
</div>
<script type="text/javascript">
    $("#newPassword").on("click",function() {
        $("#error_msg").text("");
    });
    $("#confirmNewPassword").on("click",function() {
        $("#error_msg").text("");
    });
    function isBlank(str) {
        return (!str || /^\s*$/.test(str));
    }
    $("#submitBtn").on("click",function() {
        var empty = false;
        if (isBlank($("#newPassword").val()) || isBlank($("#confirmNewPassword").val())) {
            empty = true;
        }
        let Value = $("#newPassword").val();
        let conf = $("#confirmNewPassword").val();
        if (empty || Value !== conf) {
            $("#error_msg").text("New Password and Confirm Password doesn't matches or not allowed to be empty.");
        } 
    });
</script>
