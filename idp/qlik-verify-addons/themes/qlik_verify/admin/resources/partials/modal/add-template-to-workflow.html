<div class="modal-header">
    <h5 class="modal-title">{{:: "add-template-to-workflow" | translate}}</h5>
    <button type="button" class="close" ng-click="close()">
        <span class="os-icon os-icon-close"></span>
    </button>
</div>
<div class="modal-body">
    <div class="d-flex align-items-center justify-content-start blacklist-search-input">
        <i class="os-icon os-icon-search2 blacklist-search-icon" id="search"></i>
        <input class="col-10 blaclist-search mx-2" id="searchInputField" type="text" placeholder="{{:: 'search' | translate}}" ng-model="search" ng-change="handleSearch(search);"  data-ng-init="init()">
        <i ng-show="search!=''" class="os-icon os-icon-close blacklist-clear-icon" id="closesearch" ng-click="search=''"></i>
    </div>
    <div class="blacklist-values mt-3">
        <ul>
            <li id="{{template.name}}" class="p-2 py-3 justify-content-start template-hover" ng-show="search === '' && !(template.isValidator && template.isValidator == 'true') " ng-repeat="template in templates" ng-click="success(node, template);close();">
                <i class="os-icon os-icon-code margin-right-5px"></i>
                <span>
                    {{:: template.name | translate}}
                </span>
                <span class="margin-left-auto">{{:: template.cost | translate}}</span>
            </li>
            <li id="{{template.name}}" class="p-2 py-3 justify-content-start template-hover" ng-show="search !== '' && !(template.isValidator && template.isValidator == 'true')" ng-repeat="template in searchResults" ng-click="success(node, template);close();">
                <i class="os-icon os-icon-code margin-right-5px"></i>
                <span>
                    {{:: template.name | translate}}
                </span>
                <span class="margin-left-auto">{{:: template.cost | translate}}</span>
            </li>
            <li class="border-bottom-0" ng-show="search !== '' && searchResults.length === 0 ">No result found</li>
        </ul>
    </div>
</div>
