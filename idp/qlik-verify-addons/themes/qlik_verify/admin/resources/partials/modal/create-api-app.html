<div class="modal-header">
    <h5 class="modal-title">{{:: 'add-api-app' | translate}}</h5>
    <button type="button" class="close" ng-click="cancel()">
        <span class="os-icon os-icon-close"></span>
    </button>
</div>
<div class="modal-body">
    <form>
        <div class="mb-3">
            <label class="control-label" for="selector">{{:: 'name' | translate}} <span class="required" >*</span></label>
            <input id="name" maxlength="48" class="form-control margin-bottom-10" type="text" data-ng-model="client.name">
            </input>
        </div>
</div>
<div class="modal-footer">
    <button type="button" id="cancelWorkflow" class="btn btn-secondary" ng-click="cancel()">{{:: 'cancel' | translate}}</button>
    <button type="button" id="createWorkflow" class="btn btn-primary" ng-click="ok()" data-ng-disabled="!client.name">{{:: 'create' | translate}}</button>
</div>
