<div class="modal-header">
    <h5 class="modal-title">{{title}}</h5>
    <button type="button" class="close" ng-click="cancel()">
        <span class="os-icon os-icon-close"></span>
    </button>
</div>
<div class="modal-body">
    <form class="form-group">
        <p>{{message}}</p>
    </form>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-ng-disabled="mainScope.stage === 2 ? true : false" ng-click="cancel()">{{:: 'no' | translate}}</button>
    <button type="button" id="submitBtn" class="btn btn-primary" ng-click="ok()">
        <span ng-show="mainScope.stage === 1" >
            {{:: 'yes' | translate}}
        </span>
        <div ng-show="mainScope.stage === 2">
            <kc-action-button-loading></kc-action-button-loading>
        </div>
    </button>
</div>
