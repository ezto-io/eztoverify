<div class="modal-header">
    <h5 class="modal-title">{{:: 'add-workflows' | translate}}</h5>
    <button type="button" class="close" ng-click="cancel()">
        <span class="os-icon os-icon-close"></span>
    </button>
</div>
<div class="modal-body">
    <form>
        <div class="mb-3">
            <label class="control-label" for="selector">{{:: 'name' | translate}} <span class="required" >*</span></label>
            <input id="name" maxlength="48" class="form-control margin-bottom-10" type="text" data-ng-model="action.alias">
            </input>
        </div>
        <div class="d-flex align-items-center mb-3">
            <label class="control-label mr-3" for="selector">{{:: 'import-workflow' | translate}} </label>
            <label for="importWorkflowToggle">
                <div  class="os-toggler-w" ng-class="{on: importWorkflowEnabled}">
                    <div class="os-toggler-i" id="enabledToggle">
                        <div class="os-toggler-pill" ng-model="importWorkflowEnabled" name="enabled" id="importWorkflowToggle" onoffswitch >
                        </div>
                    </div>
                </div>
            </label>
        </div>
        <div data-ng-show="importWorkflowEnabled" class="text-center">
            <div>
                <div data-ng-show="!isJsonFileSelected" class="rounded py-3 cursor-pointer" data-ng-click="uploadWorkflowJsonFile()" style="background-color: #6565652E;" >
                    <img ng-src='{{resourceUrl}}/themes/img/upload.svg' class="m-1" height="21" >
                    <span>{{ 'upload-file' | translate }}</span>
                </div>
                <input type="file" id="JsonFileInput" style="display: none;" accept=".json">
                <div data-ng-show="isJsonFileSelected" class="d-flex justify-content-between rounded px-2 py-3 cursor-pointer" style="border: #D3D9E6 1px solid;">  
                    <div>
                        <img ng-src='{{resourceUrl}}/themes/img/json-file.svg' class="m-1" height="21" >      
                        <span>{{selectedJsonFile.name}}</span>
                    </div>
                    <span class="text-primary" data-ng-click="uploadWorkflowJsonFile()">{{ 'replace' | translate }}</span>
                </div>
            </div>
            <div class="my-2">{{'or' | translate }}</div>
            <div>
                <div data-ng-show="!isWorkflowJsonInputFilled" class="rounded py-3 cursor-pointer" data-ng-click="pasteWorkflowJson()" style="border: #D3D9E6 1px solid;">
                    <img ng-src='{{resourceUrl}}/themes/img/paste.svg' class="m-1" height="21" >
                    <span>{{ 'json-upload' | translate }}</span>
                </div>
                <div data-ng-show="isWorkflowJsonInputFilled">
                    <textarea class="form-control" id="jsonRawData" rows="7" data-ng-model="JsonRawData"></textarea>
                </div>
            </div>
        </div>
    </form>
</div>
<div class="modal-footer">
    <button type="button" id="cancelWorkflow" class="btn btn-secondary" ng-click="cancel()">{{:: 'cancel' | translate}}</button>
    <button type="button" id="createWorkflow" class="btn btn-primary" ng-click="ok()" data-ng-disabled="!changed">{{:: 'create' | translate}}</button>
</div>

<script type="module" defer>
    $(document).ready(function () {
        function isValidJSON(str) {
            try {
                JSON.parse(str);
                return true;
            } catch (e) {
                return false;
            }
        }
  
      $("#jsonRawData").on('blur', function () {
        if (isValidJSON($("#jsonRawData").val())) {
          try {
            let input = $("#jsonRawData").val().trim();
            if (input.replace(/\s+/g, '') === '' || input.replace(/\s+/g, '') === '{}') {
              return;
            }
  
            // Check if any value in the JSON is an empty object
            const parsedData = JSON.parse(input);
            const hasEmptyObject = Object.values(parsedData).some(value =>
              typeof value === 'object' && value !== null && Object.keys(value).length === 0
            );
  
            if (!hasEmptyObject) {
              const prettifiedJson = JSON.stringify(parsedData, null, 2);
              $("#jsonRawData").val(prettifiedJson);
              $('#jsonRawData').change();
            }
          } catch (error) {
          }
        }
      });
    });
  
    (async ({ chrome, netscape }) => {
      if (!chrome && !netscape) await import('https://unpkg.com/@ungap/custom-elements'); const { default: HighlightedCode } = await import('https://unpkg.com/highlighted-code'); HighlightedCode.useTheme('github');
    })(self);
  
  
  </script>
