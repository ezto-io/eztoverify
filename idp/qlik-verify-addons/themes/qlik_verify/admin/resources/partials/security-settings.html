<kc-menu></kc-menu>
<div class="position-relative">
    <div class="position-absolute">
        <kc-settings-menu class="position-fixed bo-setting-sidemenu" id="setting-sidebar"></kc-settings-menu>
        <div class="bg-white p-2 bo-setting-sidemenu-icon" id="setting-sidebar-icon"
            data-ng-click="toggleSideBarShow()">
            <div id="setting-icon h1">
                <i class="ti-angle-right cursor-pointer"></i>
            </div>
        </div>
    </div>
</div>
<div class="content-w bo-setting-menu-main-content">
    <div class="content-i">
        <div class="content-box">
            <div class="row">
                <div class="col-sm-12">
                    <div class="element-wrapper">
                        <!-- <kc-tabs-realm data-ng-if="realm.mode !== 'bo'"></kc-tabs-realm> -->
                        <div class="element-box py-5">
                            <form>
                                <div class="form-group row">
                                    <label class="col-md-3 control-label">{{:: 'disable-mfa' |
                                        translate}}</label>
                                    <div class="col-md-9">
                                        <label for="enabled">
                                            <div class="os-toggler-w" ng-class="{on: disableMfa}">
                                                <div class="os-toggler-i" id="mfaToggle">
                                                    <div class="os-toggler-pill"
                                                        name="enabled" id="enabled" onoffswitch ng-model="disableMfa">
                                                    </div>
                                                </div>
                                            </div>
                                        </label>
                                    </div>
                                    <kc-tooltip>{{:: 'disableMfaTooltip' | translate}}</kc-tooltip>
                                </div>
                                <div class="col-md-12 d-flex flex-row-reverse pr-0">
                                    <button data-ng-click="update()"
                                        data-ng-disabled="!isChanged || isLoading" id="disableMfa-saveBtn"
                                        class="ml-3 btn btn-primary">
                                        <span ng-show="!isLoading">{{:: 'save' | translate}}</span>
                                        <div ng-show="isLoading">
                                            <kc-action-button-loading></kc-action-button-loading>
                                        </div>
                                    </button>
                                    <button id="cancelBtn" kc-reset data-ng-click="reset()" data-ng-disabled="!isChanged">{{:: 'cancel' |
                                        translate}}</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
