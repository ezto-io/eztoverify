<kc-menu></kc-menu>
<div class="content-w">
    <div class="content-i">
        <div class="content-box">
            <ul class="breadcrumb pd-left-0 pd-bottom-20">
                <li>
                    <a href="#/realms/{{realm.realm}}/connections/social/create" class="ng-binding">
                        <i class="os-icon {{isRTL() ? 'os-icon-arrow-right7' : 'os-icon-arrow-left6' }} breadcrumb-back-icon"></i>{{ :: 'back-to-choose-social-conn' | translate}}
                    </a>
                </li>
            </ul>
            <div class="row">
                <div class="col-sm-12">
                    <div class="element-wrapper">
                        <h1 class="general-heading">{{:: 'new-custom-social-conn-title' | translate}} </h1>
                        <br>
                        <!-- User Defined Social  Conn List -->
                        <div class="card-striped row cards-list market-card-list mr-0 ml-0" data-ng-if="customProviders.length > 0">
                            <div class="project-box ng-scope social-card-container info-card mt-0" id="ud-social-conn-{{connection.id}}" ng-repeat="connection in customProviders">
                              <div class="social-card-info" kc-open="/realms/{{realm.realm}}/connections/social/create-conn/{{connection.id}}">
                                <div>
                                    <div class="social-card-header">
                                    <div class="social-card-logo" >
                                        <img class="social-card-img" data-ng-src="{{resourceUrl}}/themes/img/social-icons/{{connection.id}}-logo.png" alt="{{connection.id}}-logo">
                                    </div>
                                    <div class="market-title-container" >
                                        <div class="market-title" >
                                        <h6 class="mb-0">{{connection.name}} </h6>
                                        </div>
                                    </div>
                                    </div>
                                    <div class="market-desc-container" >
                                        <p class="market-desc" ng-class=" template.keywords.length === 0 && 'no-tag' "> {{ :: connection.id +'-social-conn-desc' | translate }}</p>
                                    </div>
                                </div>
                              </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
