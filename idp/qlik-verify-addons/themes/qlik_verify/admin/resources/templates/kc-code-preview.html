<div class="modal-header">
    <h5 class="modal-title">{{title}}</h5>
    <button type="button" class="close" id="closeBtn" ng-click="cancel()">
        <span class="os-icon os-icon-close"></span>
    </button>
</div>
<div class="modal-body mb-4">
    <div class="rounded border bg-color-curl position-relative">
        <i id="json-copy" class="mt-2 mr-2 p-2 bg-primary os-icon os-icon-copy copy-paste-icon cursor-pointer rounded tutorial-copy float-right" data-ng-click="copyToClipboard(code)" tooltip="{{tooltipTxt}}" tooltip-placement="top" tooltip-trigger="mouseover mouseout"></i>
        <pre style="white-space: pre-wrap;overflow:auto;">
            <code class="language-json" id="command">{{code}}</code>
        </pre>
   </div>
</div>
<script type="text/javascript">
    $(document).ready(function(){
        hljs.highlightAll();
    });
</script>
