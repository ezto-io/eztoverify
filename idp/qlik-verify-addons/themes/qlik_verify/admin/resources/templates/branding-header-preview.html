<div>
<header class="c-header nav-bar-prop z-index-2 position-relative" ng-if="branding.attributes.showHeader.toString() === 'true' " >
    <div class="container">
      <nav class="c-navbar">
          <a class="c-navbar-brand" href="{{branding.attributes.headerLogoLink}}" target="_blank">
                <img ng-if="!realm.realmLogo" id="realmLogo" class="navbar-logo" data-ng-src="{{resourceUrl}}/themes/img/logo.svg?version={{serverVersion}}"  alt="default-logo-img"> 
                <img ng-if="realm.realmLogo" class="navbar-logo" data-ng-src="{{getImage(realm.realmLogo)}} " />
                <div class="qlik-logo-label">{{realm.realm}}</div>
          </a>
            <div class="c-nav-account tab-desktop-view">
                <div ng-repeat="menu in menuList" ng-if="menu != ''">
                  <div class="mr-4">
                    <a class="home-link" href="{{menu[0]}}" target="_blank"> {{menu[1]}} </a>
                  </div>
                </div>
            </div>
            <div class="mobile-view" id="nav-bar">
              <div id="toggle-drop-down" data-ng-click="toggleOpenCloseIcon()" >
                <i class="os-icon fa-bars os-icon-hamburger-menu-1"></i>
                <i class="os-icon fa-times os-icon-close"></i>
              </div>
            </div>
            <div class="mobile-view c-navbar-collapse scrollbar-none" style="display: none" id="toggle-parent">
              <ul class="c-navbar-nav mx-auto list-style-none">
                <li class="c-nav-item" ng-repeat="mobileMenu in menuList" ng-if="mobileMenu">
                  <a class="tagmanager-top-nav-pricing c-nav-link ml-2" href="{{mobileMenu[0]}}" target="_blank"> {{mobileMenu[1]}}
                  </a>
                </li>
              </ul>
            <div>
      </nav>
    </div>
</header>
</div>
