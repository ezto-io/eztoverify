<div data-ng-controller="KcUserGroupMembershipCtrl" class="mt-2">
    <div class="d-flex roles-groups mb-3">
        <div class="tabs">
            <button class="tabs-btn" ng-class="{'tabs-btn-active' : view === 'treeView'}"
                ng-click="changeView('treeView')">{{ :: 'tree-view' | translate}}</button>
            <button class="tabs-btn" ng-class="{'tabs-btn-active' : view === 'listView'}"
                ng-click="changeView('listView')">
                {{ :: 'list-view' | translate}}
                <svg width="5" class="ml-2" ng-class="{'rotate-180' : isRTL()}"  height="10" viewBox="0 0 5 10" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M0 10L5 5L0 0L0 10Z"
                        fill="currentColor" />
                </svg>
            </button>
        </div>
        <div class="sub-tabs" ng-if="view === 'listView'">
            <button ng-click="changeSubTab('roles')" ng-class="{'active' : subTab === 'roles'}">{{
                :: 'roles' | translate}}</button>
            <button ng-click="changeSubTab('groups')" ng-class="{'active' : subTab === 'groups'}">{{
                :: 'groups' | translate}}</button>
        </div>
        <div ng-if="view === 'listView'" class="ml-auto">
            <select data-ng-model="query.max" id="pageRolesCount" ng-change="selectQuery()"
                data-ng-options="itemCount for itemCount in [5,10,50,100]"
                data-ng-show="(groupMemberships && groupMemberships.length > 5 && pageCount===entries) || (entries > 5)"
                class="form-control form-control-sm rounded bright events-admin-search w-auto pt-1 pb-1 mt-3 mr-3">
                <option data-ng-repeat="itemCount in [5,10,50,100]" data-ng-selected="query.max === itemCount"
                    data-ng-value="itemCount">
                    {{ itemCount }}
                </option>
            </select>
            <button class="create-btn" id="addGroupBtn"
                ng-if="searchLoaded &&  groupMemberships.length > 0"
                ng-click="addGroupsToUser()">
                <i class="os-icon os-icon-plus plus-icon"></i>
                {{:: 'add-groups' | translate}}
            </button>
        </div>
    </div>
    <div class="element-box element-box-medium"
        data-ng-show="searchLoaded && (groupMemberships == null || groupMemberships.length == 0)">
        <div class="no-entry-svg">
            <i class="os-icon os-icon-users opacity-75 no-entry-display mb-3 icon-custom-70"></i>
            <p class="no-results-msg no-entry-display">{{:: 'noGroupsAvailable' | translate}}</p>
            <button class="create-btn no-entry-display" ng-click="addGroupsToUser()" id="addGroupBtn" addRealmRole>
                <i class="os-icon os-icon-plus plus-icon"></i>
                {{:: 'add-groups' | translate}}
            </button>
        </div>
    </div>
    <div ng-if="!(searchLoaded)">
        <kc-loader loadertype="loaderTypeName"></kc-loader>
    </div>
    <div ng-hide="groupMemberships.length === 0 || !searchLoaded">
        <div class="table-responsive-md clients-list">
            <table class="table table-light-bordered table-padded table-layout-fixed w-100">
                <caption data-ng-show="groupMemberships" class="hidden">{{:: 'table-of-role-members'
                    |
                    translate}}</caption>
                <thead>
                    <tr data-ng-show="groupMemberships.length > 0">
                        <th class="w-90" colspan="9">{{:: 'group-name' | translate}}</th>
                        <th class="text-center w-10" colspan="1">{{:: 'actions' | translate}}</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="user-row position-relative fadeUp" ng-repeat="group in groupMemberships">
                        <td class="overflow-ellipsis mb-0" colspan="9">
                            <div class="name-container align-items-center">
                                <p class="overflow-ellipsis mb-0">{{group.name}}</p>
                            </div>
                        </td>
                        <td class="kc-action-cell text-center row-actions " colspan="1">
                            <a class="danger" data-ng-click="deleteUserGroup(group)"><i class="os-icon os-icon-ui-15"
                                    tooltip="{{:: 'tooltip-remove-label' | translate}}"
                                    id="{{group.name.toLowerCase().replaceAll(' ','-')}}-deleteIcon"
                                    tooltip-placement="top" tooltip-trigger="mouseover mouseout"></i></a>
                        </td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr
                        data-ng-hide="(!searchLoaded && groupMemberships && groupMemberships.length < 5) || (groupMemberships && groupMemberships.length ===0)">
                        <td class="pl-0 pb-0" 
                            data-ng-show="(groupMemberships && groupMemberships.length > 5 && pageCount===entries) || (entries > 5)"
                            colspan="6">
                            <p class="mt-1 mb-0">{{:: 'showing' | translate}} {{startCount}} - {{pageCount}} {{:: 'of' |
                                translate}} {{entries}} {{:: 'groups' | translate}}</p>
                        </td>
                        <td class="pr-0 pb-0"
                            data-ng-show="(groupMemberships && groupMemberships.length > 5 && pageCount === entries) || (entries > 5)"
                            colspan="4">
                            <div class="table-nav pull-right" data-ng-hide="(entries <= query.max)">
                                <button class="btn btn-sm btn-outline-primary table-pagination" id="firstPageBtn"
                                    data-ng-click="firstPage()" class="first" ng-disabled="query.first === 0"
                                    data-ng-class="query.first === 0 && 'text-muted'">
                                    <i class="{{isRTL() ? 'ti-angle-double-right' : 'ti-angle-double-left'}} pagination-icon"></i>
                                    <i>{{:: 'first-page' | translate}} </i>
                                </button>
                                <button class="btn btn-sm btn-outline-primary table-pagination" id="previousPageBtn"
                                    data-ng-click="previousPage()" class="prev" ng-disabled="query.first === 0"
                                    data-ng-class="query.first === 0 && 'text-muted'"><i
                                        class="{{isRTL() ? 'ti-angle-right' : 'ti-angle-left'}} pagination-icon"></i>
                                    <i> {{:: 'previous' | translate}} </i>
                                </button>
                                <button class="btn btn-sm btn-outline-primary table-pagination pr-0" id="nextPageBtn"
                                    data-ng-click="nextPage()" class="next" ng-disabled="pageCount === entries"
                                    data-ng-class="pageCount === entries && 'text-muted'">
                                    <i> {{:: 'next' | translate}} </i>
                                    <i class="{{isRTL() ? 'ti-angle-left' : 'ti-angle-right'}} pagination-icon"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>
