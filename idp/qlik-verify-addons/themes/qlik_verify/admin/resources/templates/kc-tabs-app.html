<div data-ng-controller="ClientViewCtrl">
    <div class="app-detail-tab-container mr-0" data-ng-hide="create">
        <div class="app-detail-tab-content">
            <div class="app-detail-tab-img-container">
                <div class="app-detail-tab-img" ng-if="!client.attributes.logoUrl && !client.attributes['sso.logourl'] && realm.mode !== 'bo' && !isWorkflow(client)">
                    <img id="client-logo" alt="clientlogo" data-ng-src="{{resourceUrl}}/themes/img/{{realm.mode === 'wiam' ? client.appType : client.appType + '-ciam'}}.svg"> 
                </div>
                <div class="app-detail-tab-img" ng-if="client.attributes.logoUrl && !client.attributes['sso.logourl'] && client.appType !== 'iws'">
                    <img id="client-logo" alt="clientlogo" data-ng-src="{{client.attributes.logoUrl}}"> 
                </div>
                <!-- <div class="app-detail-tab-img" ng-if="client.attributes['sso.logourl']">
                    <img id="client-logo" alt="clientlogo" data-ng-src="{{client.attributes['sso.logourl']}}"> 
                </div> -->
                <div class="app-detail-tab-img"
                    ng-if="client.appType === 'saml' && isWorkflow(client)">
                    <img id="client-logo" alt="clientlogo" data-ng-src="{{resourceUrl}}/themes/img/streams.svg">
                </div>
                <!-- <div class="app-detail-tab-img" ng-if="client.attributes['sso.logourl'] && client.attributes['iws.installed'] == 'true' && client.appType == 'iws'">
                    <img id="client-logo" alt="clientlogo" data-ng-src="{{client.attributes['sso.logourl']}}"> 
                </div> -->
                <div class="app-detail-tab-img position-relative" ng-if="client.attributes['sso.logourl']" id="ssoImage">
                    <label class="m-0" >
                        <div class="sso-logo-overlay d-flex align-items-center justify-content-center" data-ng-click="uploadImg()">
                            <h5 class="m-0"><i class="os-icon os-icon-camera text-white"></i></h5>
                        </div>
                        <div id="client-logo" class="d-flex align-items-center justify-content-center">
                            <img ng-show="!isUploading" class="client-logo"  data-ng-src="{{client.attributes['sso.logourl']}}"
                                alt="sso-logo" />
                            <div ng-if="isUploading" class="spinner-border text-primary" role="status" >
                                <span class="sr-only">Loading...</span>
                            </div>
                        </div>
                    </label>
                    <input id="imageUpload" class="hidden" type="file" name="profile_photo" accept="image/*" placeholder="Photo" required="" capture />
                </div>
                <div>
                    <h1  class="user-detail-username word-break-all text-capitalize" ng-if="isInBuilt">{{:: client.name | translate}} <strong ng-if="isInBuilt" class="badge badge-danger">{{:: 'inbuilt' | translate}}</strong></h1>
                    <h1  class="user-detail-username word-break-all text-capitalize my-1" ng-if="!isInBuilt">{{client.name}} <strong ng-if="isInBuilt" class="badge badge-danger">{{:: 'inbuilt' | translate}}</strong></h1>

                    <div class="user-id-container" ng-if="client.appType !== 'ciba'">
                    {{ ::'client-id' | translate}} <code id="clientid" name="clientid" class="user-id-code"> {{ client.clientId}}</code>
                    <i class="os-icon os-icon-copy copy-paste-icon cursor-pointer" id="applicationId-copyIcon" data-ng-click="copyToClipboard('#clientid')" tooltip="{{tooltipTxt}}" tooltip-placement="top" tooltip-trigger="mouseover mouseout" ng-init="initCopyIcon()"></i>
                    </div>
                </div>   
            </div>  
        </div>
        <div class="d-flex" data-ng-if="client.protocol === 'openid-connect'">
            <div class="user-detail-tab-actions mr-0">
                <button id="tryIt" class="btn btn-primary" data-ng-show="!create && (client.appType !== 'ciba')" data-ng-click="tryItOut($event, 'button')"
                 data-title="{{:: 'intro-application-try-title' | translate}}" data-intro="{{:: 'intro-application-try' | translate}}">
                    <div class="button-spinner d-none">
                        <span>{{:: 'fetching-oidc-url' | translate}}</span>
                        <div class="spinner-border spinner-border-sm" role="status">
                        </div>
                    </div>
                    <span class="button-content-spinner">
                        <i class="os-icon os-icon-play plus-icon"></i>{{:: 'try' | translate}}
                    </span>
                </button>
            </div>
            <div class="user-detail-tab-actions mr-0">
                <button id="openIt" class="btn btn-primary" data-ng-show="!create && ( client.appType === 'high_secure' || client.appType === 'browser_based' )" data-ng-click="openTab($event, 'button')"
                 data-title="{{:: 'intro-application-open-title' | translate}}" data-intro="{{:: 'intro-application-open' | translate}}">
                    <div class="button-spinner d-none">
                        <span>{{:: 'redirecting-oidc-url' | translate}}</span>
                        <div class="spinner-border spinner-border-sm" role="status">
                        </div>
                    </div>
                    <span class="button-content-spinner">
                        <i class="os-icon os-icon-external-link plus-icon"></i>{{ ::'open' | translate}}
                    </span>
                </button>
            </div>
            <div class="user-detail-tab-actions mr-0" ng-if="realm.mode === 'bo'">
                <button id="duplicate" class="btn btn-primary px-3" data-ng-show="client.appType === 'ciba'" data-ng-click="duplicateClient(client)">
                    <span class="button-content-spinner">
                        <img ng-src="{{resourceUrl}}/img/duplicate-icon.svg" class="pr-2">
                        {{:: 'duplicate' | translate}}
                    </span>
                </button>
            </div>
        </div>
    </div>
</div>
