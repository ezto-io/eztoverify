<div class="modal-header">
    <h5 class="modal-title">{{::'exit-confirm-title' | translate}}</h5>
</div>
<div class="modal-body">
    <p>{{::'exit-confirm-description' | translate}}</p>
</div>
<div class="modal-footer ng-scope">
    <button type="button" class="btn btn-secondary ng-binding" id="exit-confirm-no-btn" ng-click="cancel()">{{::'exit-confirm-no' | translate}}</button>
    <button type="button" class="btn btn-primary" id="exit-confirm-yes-btn" ng-click="ok()">{{::'exit-confirm-yes' | translate}}</button>
</div>
