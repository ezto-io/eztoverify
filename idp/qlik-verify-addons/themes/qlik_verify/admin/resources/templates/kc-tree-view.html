<div class="content-w" data-ng-controller="KcRolesGroupsTree">
    <div class="element-wrapper pb-0">
        <div class="element-box element-box-medium top-align p-4">
            <div class="holder scrollbar-none" id="holder">
                <div class="roles-container roles-container-left"
                    data-ng-class="{'remove-roles-border' : leftWholeArray.length === 0}">
                    <ul data-ng-class="{'remove-roles-top-left left-1' : leftWholeArray.length === 0}">
                        <li data-ng-class="{'remove-roles-border' : leftWholeArray.length === 0}">
                            <button class="add-group" ng-click="leftAddFunction()">{{:: leftAddLabel | translate}} +</button>
                        </li>
                        <li data-ng-repeat="value in leftArray">
                            <button class="roles-groups-delete-btn" ng-click="leftDelete(value)">-</button>
                            <span>{{value.name}}</span>
                        </li>
                        <li ng-if="leftArray.length !== leftWholeArray.length">
                            <button class="add-group roles-show-more" ng-click="showMoreLeft()">
                                <img data-ng-src="{{resourceUrl}}/themes/img/down-arrow.svg" />
                                <span>{{:: 'show-more' | translate}}</span>
                            </button>
                        </li>
                    </ul>
                </div>
                <button class="roles roles-btn roles-container-left-btn">
                    <span>{{ :: leftLabel | translate }}</span>
                    <div class="role-btn-line"></div>
                </button>
                <div class="user-holder">
                    <div class="roles-user-avatar">
                        <div ng-if="user.profPic">
                            <img id="profileImage" class="user-detail-profilepic" data-ng-src="{{ user.profPic }}"
                                alt="profile-pic" />
                        </div>
                        <div ng-if="!user.profPic">
                            <img class="user-detail-profilepic-no-img"
                                data-ng-src="data:image/png;base64,{{generatedProfilePic}}" alt="profile-pic" />
                        </div>
                    </div>
                    <div class="user-holder-desc">
                        <p><span>{{leftWholeArray.length}}</span><span> {{ :: leftLabel | translate }}</span></p>
                        <p><span>{{rightWholeArray.length}}</span><span> {{ :: rightLabel | translate }}</span></p>
                    </div>
                </div>
                <button class="roles roles-btn">
                    <span>{{ :: rightLabel | translate }}</span>
                    <div class="role-btn-line"></div>
                </button>
                <div class="roles-container groups"
                    data-ng-class="{'remove-roles-border' : rightWholeArray.length === 0}">
                    <ul data-ng-class="{'remove-roles-top-left' : rightWholeArray.length === 0}">
                        <li data-ng-class="{'remove-roles-border' : rightWholeArray.length === 0}">
                            <button class="add-group" ng-click="rightAddFunction()">+ Add Group</button>
                        </li>
                        <li data-ng-repeat="value in rightArray"><button class="roles-groups-delete-btn"
                                ng-click="rightDelete(value)">-</button><span
                                class="roles-groups-name">{{value.name}}</span>
                            <div ng-if="value.rolesCount > 0" class="roles" ng-click="setCurrent(value)"
                                data-ng-class="{'roles-label' : currentGroup.id === group.id}">
                                <span>{{group.rolesCount}} roles</span>
                            </div>
                            <div ng-if="group.rolesCount > 0 && currentGroup.id === group.id" id="group-roles"
                                ng-init="scrollToView()" class="roles-container absolute"
                                data-ng-class="{'remove-roles-border' : getGroupRoles(group).length === 1}">
                                <ul data-ng-class="{'remove-roles-top-left top-1' : getGroupRoles(group).length === 1}">
                                    <li data-ng-repeat="groupRole in getGroupRoles(group)"
                                        data-ng-class="{'remove-roles-border' : getGroupRoles(group).length === 1}">
                                        <span>{{groupRole.name}}</span>
                                    </li>
                                </ul>
                            </div>
                        </li>
                        <li ng-if="groups.length !== rightWholeArray.length"> <button class="add-group roles-show-more"
                                ng-click="showMoreGroups()"><img
                                    data-ng-src="{{resourceUrl}}/themes/img/down-arrow.svg" /><span>Show
                                    More</span></button></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
