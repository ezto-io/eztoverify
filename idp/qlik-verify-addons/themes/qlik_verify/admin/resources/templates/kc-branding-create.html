<div class="modal-header">
    <h5 class="modal-title">{{title}}</h5>
    <button type="button" class="close" id="closeModal" ng-click="cancel()">
        <span class="os-icon os-icon-close"></span>
    </button>
</div>
<div class="modal-body">
    <form>
        <div>
            <label class="control-label" for="name">{{:: 'name' | translate}} <span class="required" >*</span></label>
            <input class="form-control" type="text" id="name" data-ng-model="brandName.value" maxlength="255">
        </div>
    </form>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" ng-click="cancel()" id="cancelbtn">{{:: 'cancel' | translate}}</button>
    <button type="button" class="btn btn-primary" ng-click="ok()" data-ng-disabled="!changed" id="createBtn">{{:: 'create' | translate}}</button>
</div>
