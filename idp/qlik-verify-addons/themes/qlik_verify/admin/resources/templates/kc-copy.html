<div class="modal-header">
    <h5 class="modal-title">{{title}}</h5>
    <button type="button" class="close" ng-click="cancel()">
        <span class="os-icon os-icon-close" id="closeBtn"></span>
    </button>
</div>
<div class="modal-body">
    <form>
        <kc-provider-config realm="realm" config="configType" properties="config.props"></kc-provider-config>
        <!-- <div>
            <label class="control-label" for="name">{{:: 'name' | translate}} <span class="required">*</span></label>
            <input class="form-control" type="text" id="name" data-ng-model="name.value">
        </div> -->
    </form>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" id="cancelBtn" ng-click="cancel()">{{:: 'cancel' | translate}}</button>
    <button type="button" class="btn btn-primary" id="installBtn" ng-click="ok()" data-ng-disabled="!changed">{{:: 'install' | translate}}</button>
</div>
<script>
    $(document).ready(function() {
      setTimeout(function() {
          $("#name").focus();
      }, 100);
    });
</script>
