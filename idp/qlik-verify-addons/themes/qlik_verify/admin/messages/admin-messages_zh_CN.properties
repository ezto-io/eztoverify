client-offline-session-max.tooltip=客户端脱机会话过期前的最长时间。当客户端脱机会话过期时，脱机令牌将失效。如果未设置，则使用“脱机会话最大值”。
access-token-lifespan=访问令牌生命周期
access-token-lifespan.tooltip=访问令牌过期前的最长时间。建议此值相对于 SSO 超时较短。
access-token-lifespan-for-implicit-flow=隐式流的访问令牌生命周期
access-token-lifespan-for-implicit-flow.tooltip=在 OpenID Connect 隐式流期间颁发的访问令牌过期之前的最长时间。建议此值短于 SSO 超时。在隐式流期间不可能刷新令牌，这就是为什么有一个与“访问令牌生命周期”不同的单独超时。
