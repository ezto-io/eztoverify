client-id.tooltip=指定 URI 和令牌中引用的 ID。例如“我的客户”。对于 SAML，这也是来自 authn 请求的预期颁发者值
client.name.tooltip=指定客户端的显示名称。例如“我的客户”。还支持本地化值的键。例如\： ${my_client}
client.enabled.tooltip=禁用的客户端无法启动登录或获取访问令牌。
client.confidential.tooltip =启用机密以获取客户端密码，并在与代码交换时获取访问令牌。
alwaysDisplayInConsole=始终显示在控制台中
alwaysDisplayInConsole.tooltip=始终在账户控制台中列出此客户端，即使用户没有活动会话也是如此。
consent-required=需要同意
consent-required.tooltip=如果启用，用户必须同意客户端访问。
client.display-on-consent-screen=在同意屏幕上显示同意文本
client.display-on-consent-screen.tooltip=仅在“需要同意”处于打开状态时才适用。如果此开关处于关闭状态，则同意屏幕将仅包含与已配置的客户端作用域对应的同意。如果启用，同意屏幕上还将有一个关于此客户端本身的项目
client.consent-screen-text=客户端同意屏幕文本
client.consent-screen-text.tooltip=仅当此客户端的“在同意屏幕上显示客户端”处于打开状态时，才适用。包含文本，该文本将在同意屏幕上显示有关仅针对此客户端的特定权限
client-protocol=客户端协议
client-protocol.tooltip=“OpenID connect”允许客户端根据授权服务器执行的身份验证来验证最终用户的身份。“SAML”支持基于 Web 的身份验证和授权方案，包括跨域单点登录 （SSO），并使用包含断言的安全令牌来传递信息。
access-type=访问类型
access-type.tooltip=“机密”客户端需要密钥才能启动登录协议。“公共”客户端不需要机密。“仅持有者”客户端是永远不会启动登录的 Web 服务。
standard-flow-enabled=启用标准流量
standard-flow-enabled.tooltip=这将启用使用授权代码进行基于重定向的标准 OpenID Connect 身份验证。根据 OpenID Connect 或 OAuth2 规范，这支持此客户端的“授权代码流”。
implicit-flow-enabled=已启用隐式流
implicit-flow-enabled.tooltip=这将支持基于 OpenID Connect 重定向的身份验证，而无需授权代码。就OpenID Connect或OAuth2规范而言，这为该客户端提供了“隐式流”支持。
direct-access-grants-enabled=已启用直接访问授权
direct-access-grants-enabled.tooltip=这启用了对直接访问授权的支持，这意味着客户端可以访问用户的用户名/密码，并直接与Keycloak服务器交换访问令牌。根据 OAuth2 规范，这将支持此客户端的“资源所有者密码凭据授予”。
service-accounts-enabled=已启用服务帐户
service-accounts-enabled.tooltip=允许您向 Keycloak 验证此客户端并检索专用于此客户端的访问令牌。根据 OAuth2 规范，这将支持此客户端的“客户端凭据授予”。
include-authnstatement=包括奥特恩声明
include-authnstatement.tooltip=是否应在登录响应中包含指定方法和时间戳的语句？
include-onetimeuse-condition=包括一次性使用条件
include-onetimeuse-condition.tooltip=登录响应中是否应包含一次性使用条件？
sign-documents=签署文档
sign-documents.tooltip=SAML 文档是否应该由领域签名？
sign-documents-redirect-enable-key-info-ext=优化重定向签名密钥查找
sign-documents-redirect-enable-key-info-ext.tooltip=在由 Keycloak 适配器保护的 SP 的重定向绑定中对 SAML 文档进行签名时，签名密钥的 ID 是否应包含在元素的 SAML 协议消息中<Extensions>？这优化了签名的验证，因为验证方使用单个密钥，而不是尝试每个已知密钥进行验证。
sign-assertions=对断言进行签名
sign-assertions.tooltip=是否应签署 SAML 文档中的断言？如果文档已在签名，则不需要此设置。
signature-algorithm=签名算法
signature-algorithm.tooltip=用于对文档进行签名的签名算法。
canonicalization-method=规范化方法
canonicalization-method.tooltip=XML 签名的规范化方法。
encrypt-assertions=加密断言
encrypt-assertions.tooltip=是否应使用 AES 使用客户端的公钥对 SAML 断言进行加密？
client-signature-required=需要客户端签名
client-signature-required.tooltip=客户端是否会签署其 SAML 请求和响应？它们应该被验证吗？
force-post-binding=强制开机自检绑定
force-post-binding.tooltip=始终对响应使用 POST 绑定。
front-channel-logout=前通道注销
front-channel-logout.tooltip=如果为 true，则注销需要浏览器重定向到客户端。如果为 false，则服务器执行后台调用以注销。
force-name-id-format=强制名称 ID 格式
force-name-id-format.tooltip=忽略请求的 NameID 主题格式，并使用管理控制台配置的 NameID 主题格式。
name-id-format=名称 ID 格式
name-id-format.tooltip=要用于主题的名称 ID 格式。
root-url=根网址
root-url.tooltip=附加到相对网址的根网址
redirect-url.tooltip=重定向网址附加到相对网址
valid-redirect-uris=有效的重定向 URI
valid-redirect-uri=有效的重定向 URI
redirect-url.tooltip=重定向网址附加到相对网址
valid-redirect-uris.tooltip=浏览器在成功登录或注销后可以重定向到的有效 URI 模式。允许使用简单的通配符，例如“http://example.com/*”。也可以指定相对路径，例如 /my/relative/path/*。相对路径相对于客户端根 URL，如果未指定任何路径，则使用身份验证服务器根 URL。对于 SAML，如果您依赖于登录请求中嵌入的使用者服务 URL，则必须设置有效的 URI 模式。
base-url.tooltip=当身份验证服务器需要重定向或链接回客户端时使用的默认 URL。
admin-url=管理员网址
admin-url.tooltip=客户端管理界面的 URL。如果客户端支持适配器 REST API，请设置此项。此 REST API 允许身份验证服务器推送吊销策略和其他管理任务。通常，这设置为客户端的基本 URL。
master-saml-processing-url=主 SAML 处理网址
master-saml-processing-url.tooltip=如果已配置，此 URL 将用于与 SP 的断言使用者和单一注销服务的每个绑定。这可以针对细粒度 SAML 终结点配置中的每个绑定和服务单独覆盖。
idp-sso-url-ref=IDP 发起的单点登录网址名称
idp-sso-url-ref.tooltip=当您要执行 IDP 发起的 SSO 时引用客户端的 URL 片段名称。将其留空将禁用 IDP 发起的 SSO。您将从浏览器中引用的URL将是：{server-root}/realms/{realm}/protocol/saml/clients/{client-url-name}
idp-sso-url-ref.urlhint=目标 IDP 发起的单点登录网址：
idp-sso-relay-state=IDP 启动的 SSO 中继状态
idp-sso-relay-state.tooltip=当您要执行 IDP 启动的 SSO 时，您希望与 SAML 请求一起发送的中继状态。
web-origins=网络起源
web-origins.tooltip=允许的 CORS 源。若要允许有效重定向 URI 的所有来源，请添加“+”。但这不包括“*”通配符。要允许所有源，请明确添加“*”。
backchannel-logout-url=反向通道注销网址
backchannel-logout-url.tooltip=当注销请求发送到此领域（通过 end_session_endpoint）时，将导致客户端自行注销的 URL。如果省略，则在这种情况下不会向客户端发送注销请求。
backchannel-logout-session-required=需要反向通道注销会话
backchannel-logout-session-required.tooltip=指定在使用反向通道注销 URL 时注销令牌中是否包含 sid（会话 ID）声明。
backchannel-logout-revoke-offline-sessions=反向通道注销撤销脱机会话
backchannel-logout-revoke-offline-sessions.tooltip=指定在使用反向通道注销 URL 时注销令牌中是否包含“revoke_offline_access”事件。Keycloak 将在收到包含此事件的注销令牌时撤销脱机会话。
fine-oidc-endpoint-conf=细粒度 OpenID 连接配置
fine-oidc-endpoint-conf.tooltip=展开此部分以配置此客户端与 OpenID 连接协议相关的高级设置
access-token-signed-response-alg=访问令牌签名算法
access-token-signed-response-alg.tooltip=用于对访问令牌进行签名的 JWA 算法。
id-token-signed-response-alg=ID令牌签名算法
id-token-signed-response-alg.tooltip=用于对 ID 令牌进行签名的 JWA 算法。
id-token-encrypted-response-alg=ID 令牌加密密钥管理算法
id-token-encrypted-response-alg.tooltip=JWA 算法用于加密 ID 令牌中的密钥管理。如果需要加密的 ID 令牌，则需要此选项。如果留空，则 ID 令牌只是签名，但未加密。
id-token-encrypted-response-enc=ID令牌加密内容加密算法
id-token-encrypted-response-enc.tooltip=JWA 算法，用于加密 ID 令牌中的内容加密。仅当您需要加密的 ID 令牌时，才需要此选项。如果留空，则 ID 令牌只是签名，但未加密。
user-info-signed-response-alg=用户信息签名响应算法
user-info-signed-response-alg.tooltip=用于签名用户信息端点响应的 JWA 算法。如果设置为“未签名”，则不会对用户信息响应进行签名，并将以应用程序/json 格式返回。
request-object-signature-alg=请求对象签名算法
request-object-signature-alg.tooltip=JWA 算法，客户端在发送由“request”或“request_uri”参数指定的 OIDC 请求对象时需要使用的算法。如果设置为“any”，则请求对象可以由任何算法签名（包括“none”）。
request-object-required=请求对象必填
request-object-required.tooltip=指定客户端是否需要向请求对象提供其授权请求，以及客户端可以使用哪种方法。如果设置为“不需要”，则提供请求对象是可选的。在所有其他情况下，必须提供请求对象。如果设置为“请求”，则必须按值提供请求对象。如果设置为“request_uri”，则必须通过引用提供请求对象。如果设置为“请求或request_uri”，则可以使用任一方法。
request-uris=有效的请求 URI
request-uris.tooltip=有效 URI 的列表，可在 OpenID Connect 身份验证请求期间用作“request_uri”参数的值。支持与有效重定向 URI 相同的功能。例如通配符或相对路径。
fine-saml-endpoint-conf=细粒度 SAML 端点配置
fine-saml-endpoint-conf.tooltip=展开此部分以配置断言使用者和单点注销服务的确切 URL。
assertion-consumer-post-binding-url=断言使用者服务 POST 绑定 URL
assertion-consumer-post-binding-url.tooltip=SAML POST 客户端断言使用者服务（登录响应）的绑定 URL。如果没有此绑定的 URL，则可以将其留空。
assertion-consumer-redirect-binding-url=断言使用者服务重定向绑定 URL
assertion-consumer-redirect-binding-url.tooltip=客户端断言使用者服务（登录响应）的 SAML 重定向绑定 URL。如果没有此绑定的 URL，则可以将其留空。
logout-service-post-binding-url=注销服务 POST 绑定网址
logout-service-post-binding-url.tooltip=SAML POST 客户端的单点注销服务的绑定 URL。如果使用其他绑定，则可以将其留空
logout-service-redir-binding-url=注销服务重定向绑定 URL
logout-service-redir-binding-url.tooltip=客户端的单注销服务的 SAML 重定向绑定 URL。如果使用其他绑定，则可以将其留空。
saml-signature-keyName-transformer=SAML 签名密钥名称
saml-signature-keyName-transformer.tooltip=已签名的 SAML 文档包含 KeyName 元素中签名密钥的标识。对于Keycloak / RH-SSO交易对手，请使用KEY_ID，对于MS AD FS，请使用CERT_SUBJECT，对于其他人，如果没有其他选项有效，请检查并使用NONE。
oidc-compatibility-modes=OpenID 连接兼容模式
oidc-compatibility-modes.tooltip=展开此部分以配置设置以向后兼容较旧的 OpenID Connect / OAuth2 适配器。如果您的客户端使用旧版本的Keycloak / RH-SSO适配器，则此功能尤其有用。
exclude-session-state-from-auth-response=从身份验证响应中排除会话状态
exclude-session-state-from-auth-response.tooltip=如果启用此选项，则参数“session_state”将不会包含在 OpenID Connect 身份验证响应中。如果您的客户端使用不支持“session_state”参数的旧版 OIDC / OAuth2 适配器，这将非常有用。
