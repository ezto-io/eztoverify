client-session-idle=客户端会话空闲
client-session-idle.tooltip=允许客户端会话在过期之前处于空闲状态的时间。当客户端会话过期时，令牌将失效。如果未设置，则使用标准 SSO 会话空闲值。
client-session-max=客户端会话最大值
client-session-max.tooltip=客户端会话过期前的最长时间。当客户端会话过期时，令牌将失效。如果未设置，则使用标准 SSO 会话最大值。
client-offline-session-idle=客户端脱机会话空闲
client-offline-session-idle.tooltip=允许客户端脱机会话在过期之前处于空闲状态的时间。当客户端脱机会话过期时，脱机令牌将失效。如果未设置，则使用“脱机会话空闲”值。
