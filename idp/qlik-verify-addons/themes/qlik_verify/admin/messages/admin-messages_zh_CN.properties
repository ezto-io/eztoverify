multivalued.tooltip=指示属性是否支持多个值。如果为 true，则此属性的所有值的列表将设置为声明。如果为 false，则仅将第一个值设置为声明
aggregate.attrs.label=聚合属性值
aggregate.attrs.tooltip=指示是否应将属性值与组属性聚合。如果使用 OpenID Connect 映射器，则还需要启用多值选项才能获取所有值。使用此选项将丢弃重复的值，并且不能保证值的顺序。
selectRole.label=选择角色
selectRole.tooltip=在左侧的文本框中输入角色，或单击此按钮浏览并选择所需的角色。
tokenClaimName.label=令牌声明名称
tokenClaimName.tooltip=要插入到令牌中的声明的名称。这可以是一个完全限定的名称，如“address.street”。在这种情况下，将创建一个嵌套的 json 对象。若要防止嵌套并按字面意思使用点，请使用反斜杠 （\\.） 转义点。
jsonType.label=声明 JSON 类型
jsonType.tooltip=应用于在令牌中填充 json 声明的 JSON 类型。long、int、boolean、String 和 JSON 是有效值。
includeInIdToken.label=添加到 ID 令牌
includeInIdToken.tooltip=是否应将声明添加到 ID 令牌？
includeInAccessToken.label=添加到访问令牌
includeInAccessToken.tooltip=是否应将声明添加到访问令牌？
includeInUserInfo.label=添加到用户信息
includeInUserInfo.tooltip=是否应将声明添加到用户信息中？
usermodel.clientRoleMapping.clientId.label=客户端标识
usermodel.clientRoleMapping.clientId.tooltip=角色映射的客户端 ID。只有此客户端的客户端角色才会添加到令牌中。如果未设置，则将所有客户端的客户端角色添加到令牌中。
usermodel.clientRoleMapping.rolePrefix.label=客户端角色前缀
usermodel.clientRoleMapping.rolePrefix.tooltip=每个客户端角色的前缀（可选）。
usermodel.clientRoleMapping.tokenClaimName.tooltip=要插入到令牌中的声明的名称。这可以是一个完全限定的名称，如“address.street”。在这种情况下，将创建一个嵌套的 json 对象。若要防止嵌套并按字面意思使用点，请使用反斜杠 （\\.） 转义点。可以使用特殊令牌 ${client_id}，这将替换为实际的客户端 ID。 示例用法是“resource_access.${client_id}.roles”。当您从所有客户端添加角色（因此未设置“客户端 ID”开关）并且您希望单独存储每个客户端的客户端角色时，这尤其有用。
usermodel.realmRoleMapping.rolePrefix.label=领域角色前缀
usermodel.realmRoleMapping.rolePrefix.tooltip=每个领域角色的前缀（可选）。
sectorIdentifierUri.label=扇区标识符 URI
sectorIdentifierUri.tooltip=使用成对子值并支持动态客户端注册的提供程序应使用 sector_identifier_uri 参数。它为一组受公共管理控制的网站提供了一种方法，使其具有独立于各个域名的一致的成对子值。它还为客户端提供了一种更改redirect_uri域的方法，而无需重新注册其所有用户。
pairwiseSubAlgorithmSalt.label=盐
pairwiseSubAlgorithmSalt.tooltip=计算成对主题标识符时使用的盐。如果留空，将生成盐。
addressClaim.street.label=街道的用户属性名称
addressClaim.street.tooltip=用户属性的名称，将用于映射到“地址”令牌声明中的“street_address”子声明。默认为“街道”。
addressClaim.locality.label=位置的用户属性名称
addressClaim.locality.tooltip=用户属性的名称，将用于映射到“地址”令牌声明中的“位置”子声明。默认为“位置性”。
addressClaim.region.label=区域的用户属性名称
addressClaim.region.tooltip=用户属性的名称，将用于映射到“地址”令牌声明中的“区域”子声明。默认为“区域”。
addressClaim.postal_code.label=邮政编码的用户属性名称
addressClaim.postal_code.tooltip=用户属性的名称，将用于映射到“地址”令牌声明中的“postal_code”子声明。默认为“postal_code”。
addressClaim.country.label=国家/地区的用户属性名称
addressClaim.country.tooltip=用户属性的名称，将用于映射到“地址”令牌声明中的“国家/地区”子声明。默认为“国家/地区”。
addressClaim.formatted.label=格式化地址的用户属性名称
addressClaim.formatted.tooltip=用户属性的名称，将用于映射到“地址”令牌声明中的“格式化”子声明。默认为“格式化”。
included.client.audience.label=包含的客户受众
included.client.audience.tooltip=指定受众客户端的客户端 ID 将包含在令牌的受众 （aud） 字段中。如果令牌中存在现有受众，则只需将指定的值添加到其中。它不会覆盖现有受众群体。
included.custom.audience.label=包含的自定义受众
included.custom.audience.tooltip=仅当未填充“包含的客户受众”时才使用此选项。指定的值将包含在令牌的受众 （aud） 字段中。如果令牌中存在现有受众，则只需将指定的值添加到其中。它不会覆盖现有受众群体。

