authz-policy-logic.tooltip=إن المنطق هو الذي يملي كيفية اتخاذ القرار السياسي. إذا كانت الحالة "إيجابية"، فسيتم استخدام التأثير الناتج (السماح أو الرفض) الذي تم الحصول عليه أثناء تقييم هذه السياسة لتنفيذ القرار. إذا كانت الحالة "سلبية"، فسيتم إلغاء التأثير الناتج، بمعنى آخر، يصبح التصريح رفضًا والعكس صحيح.
