authentication-desc = المصادقة هي عملية التحقق من صحة الشخص والشركة كما يدعيان. في سياق التطبيقات عبر الإنترنت، يتم إجراء المصادقة عمومًا عن طريق إدخال اسم المستخدم أو المعرف، بالإضافة إلى جزء أو أكثر من المعلومات السرية التي يجب أن يعرفها مستخدم معين فقط.
passwordless-desc = يمكن للمستخدمين تسجيل الدخول دون الحاجة إلى تذكر كلمة المرور باستخدام المصادقة بدون كلمة مرور. وبدلاً من ذلك، يقوم المستخدمون بإدخال رقم هاتفهم أو عنوان بريدهم الإلكتروني ويتم إرسال رمز أو رابط لمرة واحدة يمكنهم استخدامه لتسجيل الدخول.
mfa-desc = MFA عبارة عن طبقة إضافية من الأمان تتطلب من المستخدم توفير عاملين أو أكثر من عوامل التحقق من أجل الوصول إلى المورد. يحتاج MFA إلى واحد أو أكثر من معايير التحقق الإضافية بالإضافة إلى تسجيل الدخول وكلمة المرور، مما يقلل من فرص نجاح الهجوم الإلكتروني.
