bo-biometric-desc=يؤكد التحقق البيومتري الهوية من خلال السمات الفسيولوجية أو السلوكية الفريدة، مثل بصمات الأصابع أو ملامح الوجه. فهو يضمن مستوى عالٍ من الأمان من خلال الاستفادة من السمات التي يصعب تكرارها، وتبسيط عملية التحقق للمستخدمين.
bo-verify-business-desc=يستلزم التحقق من الأعمال باستخدام CIN (رقم تعريف الشركة) التأكد من صحة الشركة وتفاصيلها المسجلة لدى وزارة شؤون الشركات في الهند.
bo-device-register-desc=تسجيل الجهاز يسهل عملية تسجيل جهاز معين لمستخدم معين. وهو يتضمن التقاط معرفات وسمات فريدة للجهاز. وهذا يسمح للنظام بالتعرف على الجهاز أثناء عمليات التحقق اللاحقة.
bo-device-verify-desc=يتضمن التحقق من الجهاز التحقق من سمات جهاز معين، ويشمل التقاط معرفات وخصائص فريدة للجهاز. ومن خلال الرجوع إلى هذه المعلومات مع الجهاز المسجل، سيتم التحقق من الجهاز أثناء عمليات التحقق الإضافية.
fido-register-desc=يمكّن تسجيل FIDO المستخدمين من تسجيل أنماط بصمات الأصابع الفريدة ومفتاح المرور السري بشكل آمن لأغراض التحقق. ومن خلال التقاط هذه البيانات وتخزينها، يعمل تسجيل FIDO على تبسيط عمليات التحقق اللاحقة، مما يضمن تفاعلات مستخدم سلسة وآمنة.
fido-authenticator-passwordless-desc=يسهل التحقق من FIDO التأكيد الآمن لهوية المستخدم من خلال أنماط بصمات الأصابع المسجلة مسبقًا ومفتاح المرور السري. ومن خلال الإسناد الترافقي لنقاط البيانات المخزنة هذه، سيتم إجراء التحقق من FIDO.
bo-iec-verification-desc=يتضمن التحقق من IEC برقم IEC (رمز الاستيراد والتصدير) الحصول على تفاصيل حول كيان تجاري مسجل ضمن المديرية العامة للتجارة الخارجية (DGFT) في الهند. من خلال التحقق من رقم IEC مقابل السجلات الرسمية، سيتم جلب معلومات حول الشركة، مثل اسمها القانوني وعنوانها ونوع السلع أو الخدمات المرخص لها باستيرادها أو تصديرها.
bo-iproov-register-desc=يستخدم سير عمل Face Register تقنية التعرف على الوجه المتقدمة لتسجيل المستخدم الآمن. ومن خلال التقاط وتخزين البيانات البيومترية للوجه، فإنه يتيح التحقق الدقيق والموثوق. تعمل هذه العملية المبسطة على تعزيز الإجراءات الأمنية وتضمن تسجيل المستخدم بسلاسة.
bo-iproov-verify-desc=يستخدم التحقق من الوجه تقنية التعرف على الوجه المتقدمة للتحقق من هوية المستخدم بشكل آمن. ومن خلال مقارنة البيانات البيومترية للوجه التي تم التقاطها مع النماذج المخزنة، فإنه يضمن التحقق الدقيق والموثوق. تعمل هذه العملية المبسطة على تعزيز الإجراءات الأمنية وتسهيل التحقق السلس من المستخدم.
bo-verify-itr-desc=يهدف التحقق من ITR إلى التحقق من تفاصيل إقرار ضريبة الدخل للمستخدم باستخدام اسم المستخدم وكلمة المرور الخاصة بـ ITR. وتضمن هذه العملية دقة وسلامة المعلومات الضريبية المقدمة، مما يعزز الامتثال للوائح الضريبية.
bo-json-based-form-desc=باستخدام النموذج الديناميكي، لديك المرونة اللازمة لتخصيص النموذج أو القالب وفقًا لمتطلباتك المحددة باستخدام بنية JSON مخصصة.
bo-liveliness-verification-desc=يقوم التحقق من الحياة بمقارنة الصورة وحضور المستخدم في الوقت الفعلي. تضمن هذه العملية التواجد الفعلي للمستخدم أثناء عملية التحقق، مما يخفف من مخاطر الانتحال أو محاولات الاحتيال.
bo-verify-ocr-aadhar-desc=يستلزم التحقق من بطاقة Aadhaar OCR التقاط تفاصيل بطاقة Aadhaar من خلال تقنية التعرف الضوئي على الأحرف (OCR) أثناء عملية التحقق. تتضمن هذه الطريقة استخراج المعلومات النصية مثل رقم Aadhaar والاسم والعنوان والتفاصيل الأخرى ذات الصلة من صورة البطاقة. ومن خلال أتمتة هذه العملية، يسهل التعرف الضوئي على الحروف (OCR) التحقق الدقيق والفعال، مما يعزز سرعة وموثوقية إجراءات التحقق من الهوية.
bo-verify-ocr-aadhaar-desc=يستلزم التحقق من بطاقة Aadhaar OCR التقاط تفاصيل بطاقة Aadhaar من خلال تقنية التعرف الضوئي على الأحرف (OCR) أثناء عملية التحقق. تتضمن هذه الطريقة استخراج المعلومات النصية مثل رقم Aadhaar والاسم والعنوان والتفاصيل الأخرى ذات الصلة من صورة البطاقة. ومن خلال أتمتة هذه العملية، يسهل التعرف الضوئي على الحروف (OCR) التحقق الدقيق والفعال، مما يعزز سرعة وموثوقية إجراءات التحقق من الهوية.
bo-ocr-driving-license-desc=يتضمن التحقق من رخصة القيادة بالتعرف الضوئي على الحروف (OCR) التقاط تفاصيل رخصة القيادة من خلال تقنية التعرف الضوئي على الحروف (OCR) أثناء عملية التحقق. تقوم هذه الطريقة باستخراج المعلومات النصية مثل رقم الترخيص واسم المالك وتاريخ الميلاد والتفاصيل الأخرى ذات الصلة من صورة الترخيص. وتؤدي أتمتة هذه العملية إلى تعزيز دقة وكفاءة التحقق، مما يضمن تأكيدًا موثوقًا لهوية صاحب الترخيص.
bo-verify-pan-ocr-desc=يستلزم التحقق من بطاقة PAN باستخدام OCR التقاط تفاصيل بطاقة PAN من خلال تقنية التعرف الضوئي على الأحرف (OCR) أثناء عملية التحقق. تستخرج هذه الطريقة المعلومات النصية مثل رقم PAN واسم حامل البطاقة وتاريخ الميلاد والتفاصيل الأخرى ذات الصلة من صورة البطاقة. تعمل أتمتة هذه العملية على تعزيز دقة وكفاءة التحقق، مما يضمن تأكيدًا موثوقًا لهوية حامل بطاقة PAN.
bo-verify-ocr-voterID-desc=يتضمن التحقق من هوية الناخب عبر التعرف الضوئي على الحروف (OCR) التقاط تفاصيل هوية الناخب من خلال تقنية التعرف الضوئي على الحروف (OCR) أثناء عملية التحقق. تقوم هذه الطريقة باستخراج المعلومات النصية مثل رقم هوية الناخب واسم الناخب وعنوانه والتفاصيل الأخرى ذات الصلة من صورة الهوية. وتؤدي أتمتة هذه العملية إلى تعزيز دقة وكفاءة التحقق، مما يضمن تأكيدًا موثوقًا لهوية الناخب.
bo-proximity-verify-desc=تم تصميم التحقق من القرب لتفاعلات الويب مع الجهاز. أثناء عملية التحقق، تطالب واجهة الويب المستخدمين بتوفير مواقعهم وتخزين خطوط الطول والعرض. وبعد ذلك، عندما تنتقل العملية إلى الهاتف المحمول، فإنها تلتقط خطوط الطول والعرض للجهاز المحمول، وتقارنها ببيانات الويب. إذا كانت المسافة بين النقطتين تقع ضمن الحد المحدد مسبقًا في التكوين، فستنجح عملية التحقق.
bo-secure-messaging-desc=تضمن المراسلة الآمنة حماية محتوى الاتصال الذي سيتم إرساله إلى أجهزة المستخدم المسجلة، كما تقوم أيضًا بتخزين عنوان IP الخاص بالجهاز وموقعه وأشياء من هذا القبيل.
bo-selfie-registration-desc=يمكّن سير عمل تسجيل الصور الشخصية المستخدمين من تخزين قالب الوجه الخاص بهم بشكل آمن لاستخدامه في المستقبل أثناء عمليات التحقق من الحياة، مما يضمن عملية تحقق سلسة وآمنة.
bo-selfie-verification-desc=تتيح عملية التحقق من الصور الشخصية للمستخدمين مقارنة قالب الوجه المخزن الخاص بهم بشكل آمن من عملية تسجيل الصور الشخصية السابقة، مما يضمن تجربة تحقق سلسة وآمنة.
terms-and-conditions-desc=تتضمن الشروط والأحكام مراجعة الشروط المرتبطة بخدمة أو منتج أو اتفاقية وفهمها والموافقة عليها. بالإضافة إلى ذلك، فإن الحفاظ على إصدارات الشروط والأحكام يضمن الشفافية والامتثال للمتطلبات القانونية مع مرور الوقت. تحمي هذه العملية مصالح الطرفين وتعزز الوضوح في الاتفاقيات التعاقدية.
bo-validate-email-desc=يؤكد التحقق من صحة البريد الإلكتروني على دقة وشرعية عنوان البريد الإلكتروني. يتضمن التحقق من التنسيق ووجود المجال واتصال SMTP لضمان إمكانية التسليم. تعمل هذه العملية على تحسين جودة البيانات وتقليل مخاطر رسائل البريد الإلكتروني المرتدة أو التي لم يتم تسليمها.
validate-phone-no-desc=يؤكد التحقق من صحة رقم الهاتف صحة وصحة رقم هاتف معين. ويتضمن التحقق من التنسيق ورمز البلد وطول الرقم لضمان الدقة.
bo-verify-aadhar-desc=يؤكد التحقق من بطاقة Aadhaar صحة تفاصيل Aadhaar الخاصة بالفرد. ويتضمن التحقق من صحة رقم Aadhaar والمعلومات الديموغرافية مقابل السجلات الرسمية. تعمل هذه العملية على تحسين دقة التحقق من الهوية وتضمن الامتثال للمتطلبات التنظيمية.
bo-verify-otp-aadhar-desc=Aadhaar مع التحقق من OTP يؤكد هوية الأفراد باستخدام رقم Aadhaar الخاص بهم وكلمة المرور لمرة واحدة (OTP). وهو يتضمن إرسال كلمة مرور لمرة واحدة (OTP) إلى رقم الهاتف المحمول المسجل المرتبط بـ Aadhaar، والذي يدخله المستخدم للتحقق منه.
bo-verify-aadhaar-desc=يؤكد التحقق من بطاقة Aadhaar صحة تفاصيل Aadhaar الخاصة بالفرد. ويتضمن التحقق من صحة رقم Aadhaar والمعلومات الديموغرافية مقابل السجلات الرسمية. تعمل هذه العملية على تحسين دقة التحقق من الهوية وتضمن الامتثال للمتطلبات التنظيمية.
bo-verify-otp-aadhaar-desc=Aadhaar مع التحقق من OTP يؤكد هوية الأفراد باستخدام رقم Aadhaar الخاص بهم وكلمة المرور لمرة واحدة (OTP). وهو يتضمن إرسال كلمة مرور لمرة واحدة (OTP) إلى رقم الهاتف المحمول المسجل المرتبط بـ Aadhaar، والذي يدخله المستخدم للتحقق منه.
bo-verify-bank-desc=يؤكد التحقق البنكي برقم الحساب ورمز IFSC دقة التفاصيل المصرفية. ويتضمن التحقق من صحة تنسيق رقم الحساب والتحقق من رمز IFSC مقابل السجلات الرسمية لفرع البنك.
bo-verify-driving-license-desc=يستلزم التحقق من رخصة القيادة التحقق من رقم الرخصة وهوية حاملها وتاريخ انتهاء صلاحيتها مقابل السجلات الرسمية.
bo-verify-email-desc=يؤكد التحقق من البريد الإلكتروني باستخدام OTP ملكية عنوان البريد الإلكتروني وصلاحيته. ويتضمن إرسال كلمة مرور لمرة واحدة (OTP) إلى البريد الإلكتروني المقدم، والتي يقوم المستخدم بإدخالها للتحقق منها.
bo-verify-form-26as-desc=يضمن التحقق من النموذج 26AS دقة التفاصيل المالية لدافعي الضرائب. وهو يتضمن التحقق من المعلومات المعروضة في النموذج 26AS مع سجلات ومعاملات دافعي الضرائب.
bo-verify-fssai-desc=يتحقق التحقق من FSSAI من صحة تراخيص مشغلي الأعمال الغذائية. يتضمن التحقق من رقم ترخيص FSSAI وتفاصيله مقابل السجلات الرسمية.
bo-verify-gstin-desc=يؤكد التحقق من رقم GSTIN دقة تفاصيل تسجيل ضريبة السلع والخدمات لدافعي الضرائب. يتضمن التحقق من صحة رقم تعريف ضريبة السلع والخدمات (GSTIN).
bo-verify-gstwithotp-desc=التحقق من ضريبة السلع والخدمات مع OTP يتحقق من شرعية تسجيل ضريبة السلع والخدمات لدافعي الضرائب. ويتضمن إرسال كلمة مرور لمرة واحدة (OTP) إلى رقم الهاتف المحمول المسجل المرتبط بـ GSTIN، والتي يقوم المستخدم بإدخالها للتحقق منها.
bo-verify-pan-desc=يتحقق التحقق من بطاقة PAN من صحة تفاصيل بطاقة PAN الخاصة بالفرد. يتضمن التحقق من رقم بطاقة PAN ومعلومات حاملها.
bo-verify-phone-desc=تستلزم عملية التحقق من الهاتف عادةً تأكيد رقم هاتف المستخدم باستخدام كل من طرق OTP و OTP-less. يتضمن ذلك إرسال كلمة مرور لمرة واحدة (OTP) إلى الجهاز المحمول الخاص بالمستخدم.
bo-verify-tan-desc=يضمن التحقق من TAN (رقم حساب الخصم والتحصيل الضريبي) دقة وصحة تفاصيل TAN المقدمة. يساعد التحقق من TAN في تحديد أي اختلافات أو تناقضات في أنشطة خصم الضرائب وتحصيلها، وتعزيز الشفافية المالية والامتثال التنظيمي.
bo-name-similarity-check-desc=تقوم وحدة سير العمل هذه بمقارنة أسماء مستندي هوية وإرجاع درجة المطابقة، مما يشير إلى درجة التشابه بين الأسماء.
bo-sub-workflow-desc=تسمح لك وحدة سير العمل الفرعي بالإشارة إلى تدفق محدد مسبقًا يحتوي على مسارات عمل متعددة، مما يلغي الحاجة إلى تكرار نفس مجموعة مسارات العمل عبر مسارات مختلفة. من خلال الارتباط بتكوين تدفق واحد، يمكنك تبسيط إدارة سير العمل والحفاظ على الاتساق.
bo-verify-epfo-desc=تعد منظمة صندوق الادخار للموظفين (EPFO) مسؤولة عن إدارة عملية التحقق من رقم الحساب العالمي (UAN) المرتبط بحسابات صندوق الادخار (PF). تضمن هذه العملية صحة ودقة UAN، وهو معرف فريد لحساب PF الخاص بالموظف.
bo-verify-tds206-compliance-desc=يتضمن التحقق من TDS-206 عادةً التأكد من دقة واكتمال المعلومات المتعلقة بنموذج خصم الضرائب من المصدر (TDS) 206.
bo-verify-thaiId-desc=يتضمن التحقق من الهوية التايلاندية التأكد من صحة وصلاحية بطاقة الهوية الوطنية التايلاندية (ThaiID) للفرد.
bo-verify-udyam-desc=يتضمن التحقق من Udyam/Udyog تأكيد تفاصيل التسجيل وأهلية الكيان التجاري ضمن بوابة تسجيل Udyam.
bo-verify-voterID-desc=يتضمن التحقق من هوية الناخب التأكد من صحة وصحة تفاصيل تسجيل الناخب للفرد. تتضمن هذه العملية عادةً التحقق من اسم الناخب وعنوانه ورقم هوية الناخب والمعلومات الأخرى ذات الصلة.
bo-verify-whatsapp-desc=يتضمن التحقق من WhatsApp التأكد من صحة وملكية رقم هاتف المستخدم أثناء عملية تسجيل الحساب. يتضمن هذا عادةً التحقق من رقم هاتف المستخدم من خلال رمز التحقق لمرة واحدة الذي يتم إرساله عبر رسالة نصية قصيرة أو مكالمة هاتفية.
bo-web-to-device-desc=إنها العملية التي يتم فيها إجراء التحقق الأول على الويب، يليه الجزء الثاني من التحقق على جهاز محمول باستخدام رمز الاستجابة السريعة وتكامل Firebase.
bo-geo-tagging-desc=تقوم وحدة سير عمل وضع العلامات الجغرافية بالتقاط وإرجاع تفاصيل خطوط الطول والعرض والدقة عند تنفيذها. فهو يساعد على التحقق من المواقع وتعزيز سير العمل القائم على الموقع.
phone-num-template-text-helptext-bo=أضف قالب رسالة الهاتف. قم بتضمين السمة {code} في النص الخاص بك لإدراج كلمة مرور لمرة واحدة (OTP) التي تم إنشاؤها. استخدم '\\n' لسطر جديد. مثال: "رمز المرور لمرة واحدة (OTP) الخاص بك هو {code}\n استخدم هذا الرمز للتحقق بشكل آمن.
