iws-iconscout-desc=يوفر سوق موارد التصميم IconScout أصولًا إبداعية للأفراد والشركات بسهولة باستخدام أدواتنا المبتكرة مثل المكونات الإضافية والتطبيقات
iws-loom-desc=Loom هي أداة مراسلة فيديو تساعدك على إيصال رسالتك من خلال مقاطع فيديو قابلة للمشاركة على الفور
iws-hubspot-desc=HubSpot هي منصة رائدة لإدارة علاقات العملاء (CRM) تقدم مجموعة من أدوات التسويق والمبيعات وخدمة العملاء للشركات من جميع الأحجام.
iws-pluralsight-desc=Pluralsight, LLC هي شركة أمريكية خاصة للتعليم عبر الإنترنت تقدم مجموعة متنوعة من دورات الفيديو التدريبية لمطوري البرامج ومسؤولي تكنولوجيا المعلومات والمهنيين المبدعين من خلال موقعها الإلكتروني
iws-piktochart-desc=Piktochart هي أداة قائمة على الويب تتيح للمستخدمين إنشاء رسوم بيانية وعروض تقديمية وتقارير جذابة بصريًا باستخدام واجهة سحب وإفلات بسيطة.
iws-automox-desc=Automox عبارة عن منصة سحابية لإدارة نقاط النهاية والأمان تساعد المؤسسات على أتمتة وتبسيط التصحيح والتكوين ونشر أنظمة التشغيل وبرامج الطرف الثالث عبر أجهزة Windows وmacOS وLinux.
