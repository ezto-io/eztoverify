client-session-idle=جلسة العميل خاملة
client-session-idle.tooltip=الوقت الذي يُسمح فيه لجلسة العميل بأن تكون خاملة قبل انتهاء صلاحيتها. يتم إبطال الرموز المميزة عند انتهاء صلاحية جلسة العميل. إذا لم يتم تعيينه، فإنه يستخدم القيمة القياسية لجلسة SSO الخاملة.
client-session-max=الحد الأقصى لجلسة العميل
client-session-max.tooltip=الحد الأقصى للوقت قبل انتهاء صلاحية جلسة العميل. يتم إبطال الرموز المميزة عند انتهاء صلاحية جلسة العميل. إذا لم يتم تعيينها، فإنها تستخدم القيمة القياسية لجلسة SSO القصوى.
client-offline-session-idle=جلسة عمل العميل دون اتصال خاملة
client-offline-session-idle.tooltip=الوقت المسموح به لجلسة العميل غير المتصلة بالإنترنت أن تكون خاملة قبل انتهاء صلاحيتها. يتم إبطال الرموز المميزة دون اتصال عند انتهاء صلاحية جلسة العميل دون اتصال. إذا لم يتم تعيينه فإنه يستخدم قيمة "الجلسة غير المتصلة بالإنترنت".
client-offline-session-max=الحد الأقصى لجلسة العميل دون اتصال
client-offline-session-max.tooltip=الحد الأقصى للوقت قبل انتهاء صلاحية جلسة العميل غير المتصلة بالإنترنت. يتم إبطال الرموز المميزة دون اتصال عند انتهاء صلاحية جلسة العميل دون اتصال. إذا لم يتم تعيينها، فإنها تستخدم القيمة القصوى للجلسة دون اتصال.
access-token-lifespan=عمر رمز الوصول
access-token-lifespan.tooltip=الحد الأقصى للوقت قبل انتهاء صلاحية رمز الوصول. من المستحسن أن تكون هذه القيمة قصيرة بالنسبة إلى مهلة تسجيل الدخول الموحّد (SSO).
access-token-lifespan-for-implicit-flow=عمر رمز الوصول للتدفق الضمني
access-token-lifespan-for-implicit-flow.tooltip=الحد الأقصى للوقت قبل انتهاء صلاحية رمز الوصول الذي تم إصداره أثناء OpenID Connect Implicit Flow. يوصى بأن تكون هذه القيمة أقصر من مهلة تسجيل الدخول الموحّد (SSO). لا توجد إمكانية لتحديث الرمز المميز أثناء التدفق الضمني، ولهذا السبب توجد مهلة منفصلة مختلفة عن "عمر رمز الوصول".
action-token-generated-by-admin-lifespan=عمر الإجراء الافتراضي الذي يبدأه المسؤول
action-token-generated-by-admin-lifespan.tooltip=الحد الأقصى للوقت قبل انتهاء صلاحية تصريح الإجراء الذي أرسله المسؤول إلى المستخدم. يوصى بأن تكون هذه القيمة طويلة للسماح للمسؤولين بإرسال رسائل بريد إلكتروني للمستخدمين غير المتصلين حاليًا. يمكن تجاوز المهلة الافتراضية مباشرة قبل إصدار الرمز المميز.
action-token-generated-by-user-lifespan=عمر الإجراء الذي يبدأه المستخدم
