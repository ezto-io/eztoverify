client.display-on-consent-screen.tooltip=ينطبق فقط إذا كانت الموافقة مطلوبة قيد التشغيل. إذا تم إيقاف تشغيل هذا المفتاح، فستحتوي شاشة الموافقة فقط على الموافقات المطابقة لنطاقات التطبيق التي تم تكوينها. في حالة تشغيله، سيكون هناك أيضًا عنصر واحد على شاشة الموافقة حول هذا التطبيق نفسه
client.consent-screen-text=نص شاشة الموافقة
client.consent-screen-text.tooltip=ينطبق فقط في حالة تشغيل "عرض نص الموافقة على شاشة الموافقة" لهذا التطبيق. يحتوي على النص الذي سيكون على شاشة الموافقة حول الأذونات المحددة لهذا التطبيق فقط
client-protocol=بروتوكول العميل
client-protocol.tooltip=يسمح "اتصال OpenID" للعملاء بالتحقق من هوية المستخدم النهائي بناءً على المصادقة التي يتم إجراؤها بواسطة خادم التفويض. ويتيح "SAML" سيناريوهات المصادقة والتفويض المستندة إلى الويب بما في ذلك تسجيل الدخول الموحد عبر النطاق (SSO) ويستخدم الأمان الرموز التي تحتوي على تأكيدات لتمرير المعلومات.
access-type=نوع الوصول
access-type.tooltip=يحتاج العملاء "السريون" إلى سر لبدء بروتوكول تسجيل الدخول. العملاء "العامة" لا يحتاجون إلى سر. عملاء "الحامل فقط" هم خدمات ويب لا تبدأ تسجيل الدخول مطلقًا.
standard-flow-enabled=تم تمكين التدفق القياسي
standard-flow-enabled.tooltip=يؤدي ذلك إلى تمكين المصادقة المستندة إلى إعادة توجيه OpenID Connect القياسية باستخدام رمز التفويض. فيما يتعلق بمواصفات OpenID Connect أو OAuth2، يتيح ذلك دعم "تدفق كود التفويض" لهذا العميل.
implicit-flow-enabled=تم تمكين التدفق الضمني
implicit-flow-enabled.tooltip=يتيح ذلك دعم المصادقة المستندة إلى إعادة توجيه OpenID Connect بدون رمز التفويض. فيما يتعلق بمواصفات OpenID Connect أو OAuth2، يتيح ذلك دعم "التدفق الضمني" لهذا العميل.
direct-access-grants-enabled=تم تمكين منح الوصول المباشر
direct-access-grants-enabled.tooltip=يتيح ذلك دعم منح الوصول المباشر، مما يعني أن العميل لديه حق الوصول إلى اسم المستخدم/كلمة المرور الخاصة بالمستخدم وتبادلها مباشرة مع خادم Keycloak للحصول على رمز الوصول. فيما يتعلق بمواصفات OAuth2، يتيح ذلك دعم "منح بيانات اعتماد كلمة مرور مالك المورد" لهذا العميل.
service-accounts-enabled=تم تمكين حسابات الخدمة
service-accounts-enabled.tooltip=يسمح لك بمصادقة هذا العميل على Keycloak واسترداد رمز الوصول المخصص لهذا العميل. فيما يتعلق بمواصفات OAuth2، يتيح ذلك دعم "منح بيانات اعتماد العميل" لهذا العميل.
include-authnstatement=تضمين AuthenStatement
include-authnstatement.tooltip=هل يجب تضمين بيان يحدد الطريقة والطابع الزمني في استجابات تسجيل الدخول؟
include-onetimeuse-condition=قم بتضمين شرط الاستخدام لمرة واحدة
include-onetimeuse-condition.tooltip=هل يجب تضمين شرط OneTimeUse في استجابات تسجيل الدخول؟
sign-documents=التوقيع على وثائق
sign-documents.tooltip=هل يجب توقيع مستندات SAML بواسطة مساحة العمل؟
sign-documents-redirect-enable-key-info-ext=تحسين البحث عن مفتاح التوقيع REDIRECT
sign-documents-redirect-enable-key-info-ext.tooltip=عند توقيع مستندات SAML في ربط REDIRECT لـ SP المؤمن بواسطة محول Keycloak، هل يجب تضمين معرف مفتاح التوقيع في رسالة بروتوكول SAML في عنصر <Extensions>؟ يؤدي ذلك إلى تحسين التحقق من صحة التوقيع حيث يستخدم طرف التحقق مفتاحًا واحدًا بدلاً من تجربة كل مفتاح معروف للتحقق من الصحة.
sign-assertions=تأكيدات التوقيع
sign-assertions.tooltip=هل يجب التوقيع على التأكيدات داخل مستندات SAML؟ ليس هناك حاجة لهذا الإعداد إذا كان المستند قيد التوقيع بالفعل.
signature-algorithm=خوارزمية التوقيع
signature-algorithm.tooltip=خوارزمية التوقيع المستخدمة لتوقيع المستندات.
canonicalization-method=طريقة الكنسي
canonicalization-method.tooltip=طريقة Canonicalization لتوقيعات XML.
encrypt-assertions=تشفير التأكيدات
encrypt-assertions.tooltip=هل يجب تشفير تأكيدات SAML باستخدام المفتاح العام للتطبيق باستخدام AES؟
client-signature-required=توقيع التطبيق مطلوب
client-signature-required.tooltip=هل سيقوم التطبيق بالتوقيع على طلبات وردود saml الخاصة بهم؟ وهل يجب التحقق من صحتها؟
force-post-binding=فرض ربط ما بعد
force-post-binding.tooltip=استخدم دائمًا ربط POST للردود.
front-channel-logout=تسجيل الخروج من القناة الأمامية
front-channel-logout.tooltip=عندما يكون هذا صحيحًا، يتطلب تسجيل الخروج إعادة توجيه المتصفح إلى التطبيق. عندما يكون خطأ، يقوم الخادم بإجراء استدعاء في الخلفية لتسجيل الخروج.
force-name-id-format=تنسيق معرف اسم القوة
force-name-id-format.tooltip=تجاهل تنسيق موضوع NameID المطلوب واستخدم تنسيق وحدة تحكم المشرف الذي تم تكوينه.
name-id-format=تنسيق معرف الاسم
name-id-format.tooltip=تنسيق معرف الاسم الذي سيتم استخدامه للموضوع.
root-url=عنوان URL الجذر
root-url.tooltip=تم إلحاق عنوان URL الجذر بعناوين URL النسبية
valid-redirect-uris=عناوين URI الصالحة لإعادة التوجيه
valid-redirect-uri=عنوان URI صالح لإعادة التوجيه
redirect-url.tooltip=إعادة توجيه URL المُلحق بعناوين URL النسبية
valid-redirect-uris.tooltip=نمط URI صالح يمكن للمتصفح إعادة التوجيه إليه بعد تسجيل الدخول أو الخروج بنجاح. يُسمح باستخدام أحرف البدل البسيطة مثل "http://example.com/*". يمكن تحديد المسار النسبي أيضًا مثل /my/relative/path/*. ترتبط المسارات النسبية بعنوان URL لجذر التطبيق، أو إذا لم يتم تحديد أي منها، فسيتم استخدام عنوان URL لجذر خادم المصادقة. بالنسبة إلى SAML، يجب عليك تعيين أنماط URI صالحة إذا كنت تعتمد على عنوان URL لخدمة المستهلك المضمن مع طلب تسجيل الدخول.
base-url.tooltip=عنوان URL الافتراضي الذي يتم استخدامه عندما يحتاج خادم المصادقة إلى إعادة التوجيه أو الارتباط مرة أخرى بالعميل.
admin-url=عنوان URL للمشرف
admin-url.tooltip=عنوان URL لواجهة الإدارة الخاصة بالعميل. قم بتعيين هذا إذا كان العميل يدعم استراحة API للمحول. تسمح استراحة API لخادم المصادقة بدفع سياسات الإلغاء والمهام الإدارية الأخرى. عادةً ما يتم تعيين هذا على عنوان URL الأساسي للعميل.
master-saml-processing-url=عنوان URL الرئيسي لمعالجة SAML
master-saml-processing-url.tooltip=إذا تم تكوينه، فسيتم استخدام عنوان URL هذا لكل ربط لكل من خدمات مستهلك التأكيد وخدمات تسجيل الخروج الفردي الخاصة بمقدم الخدمة. يمكن تجاوز ذلك بشكل فردي لكل ربط وخدمة في تكوين نقطة النهاية لـ Fine Grain SAML.
idp-sso-url-ref=اسم URL لتسجيل الدخول الموحد (SSO) الذي بدأه IDP
idp-sso-url-ref.tooltip=اسم جزء عنوان URL للإشارة إلى التطبيق عندما تريد إجراء تسجيل الدخول الموحّد (SSO) الذي بدأه IDP. سيؤدي ترك هذا الحقل فارغًا إلى تعطيل تسجيل الدخول الموحد (SSO) الذي بدأه IDP. سيكون عنوان URL الذي سترجع إليه من متصفحك هو: {server-root}/realms/{realm}/protocol/saml/clients/{client-url-name}
idp-sso-url-ref.urlhint=عنوان URL للدخول الموحد (SSO) المستهدف لموفر الهوية (IDP):
idp-sso-relay-state=حالة ترحيل SSO التي بدأها IDP
idp-sso-relay-state.tooltip=حالة الترحيل التي تريد إرسالها مع طلب SAML عندما تريد إجراء تسجيل الدخول الموحد (SSO) الذي بدأه IDP.
web-origins=أصول الويب
web-origins.tooltip=أصول CORS المسموح بها. للسماح بجميع أصول عناوين URI الصالحة لإعادة التوجيه، أضف "+". لكن هذا لا يتضمن حرف البدل '*'. للسماح بجميع الأصول، قم بإضافة "*" بشكل صريح.
backchannel-logout-url=عنوان URL لتسجيل الخروج من القناة الخلفية
backchannel-logout-url.tooltip=عنوان URL الذي سيؤدي إلى قيام العميل بتسجيل الخروج عند إرسال طلب تسجيل الخروج إلى مساحة العمل هذه (عبر end_session_endpoint). إذا تم حذفه، فلن يتم إرسال أي طلب تسجيل خروج إلى العميل في هذه الحالة.
backchannel-logout-session-required=مطلوب جلسة تسجيل الخروج من القناة الخلفية
backchannel-logout-session-required.tooltip=تحديد ما إذا كان يتم تضمين مطالبة sid (معرف الجلسة) في رمز تسجيل الخروج عند استخدام عنوان URL لتسجيل الخروج للقناة الخلفية.
backchannel-logout-revoke-offline-sessions=تسجيل الخروج من القناة الخلفية يلغي الجلسات غير المتصلة بالإنترنت
backchannel-logout-revoke-offline-sessions.tooltip=تحديد ما إذا كان سيتم تضمين حدث "revoc_offline_access" في رمز تسجيل الخروج عند استخدام عنوان URL لتسجيل الخروج للقناة الخلفية. سوف يقوم Keycloak بإلغاء الجلسات غير المتصلة بالإنترنت عند تلقي رمز الخروج مع هذا الحدث.
fine-oidc-endpoint-conf=تكوين اتصال OpenID للحبوب الدقيقة
fine-oidc-endpoint-conf.tooltip=قم بتوسيع هذا القسم لتكوين الإعدادات المتقدمة لهذا العميل المتعلقة ببروتوكول OpenID Connect
access-token-signed-response-alg=خوارزمية توقيع رمز الوصول
access-token-signed-response-alg.tooltip=خوارزمية JWA المستخدمة لتوقيع رموز الوصول.
id-token-signed-response-alg=خوارزمية توقيع رمز الهوية
id-token-signed-response-alg.tooltip=خوارزمية JWA المستخدمة لتوقيع رموز المعرف.
id-token-encrypted-response-alg=خوارزمية إدارة مفتاح تشفير رمز الهوية
id-token-encrypted-response-alg.tooltip=خوارزمية JWA المستخدمة لإدارة المفاتيح في تشفير رموز المعرف. هذا الخيار ضروري إذا كنت تريد رموز معرف مشفرة. إذا تركت فارغة، فسيتم توقيع رموز المعرف فقط، ولكنها غير مشفرة.
id-token-encrypted-response-enc=خوارزمية تشفير المحتوى لتشفير رمز الهوية
id-token-encrypted-response-enc.tooltip=خوارزمية JWA المستخدمة لتشفير المحتوى في تشفير رموز المعرف. هذا الخيار مطلوب فقط إذا كنت تريد رموز معرف مشفرة. إذا تركت فارغة، فسيتم توقيع رموز المعرف فقط، ولكنها غير مشفرة.
user-info-signed-response-alg=معلومات المستخدم خوارزمية الاستجابة الموقعة
user-info-signed-response-alg.tooltip=خوارزمية JWA المستخدمة لاستجابة نقطة نهاية معلومات المستخدم الموقعة. إذا تم التعيين على "غير موقع"، فلن يتم توقيع استجابة معلومات المستخدم وسيتم إرجاعها بتنسيق application/json.
request-object-signature-alg=طلب خوارزمية توقيع الكائن
request-object-signature-alg.tooltip=خوارزمية JWA، أي تطبيق يحتاج إلى استخدامه عند إرسال كائن طلب OIDC المحدد بواسطة معلمات "request" أو "request_uri". إذا تم تعيينه على "أي"، فيمكن توقيع كائن الطلب بواسطة أي خوارزمية (بما في ذلك "لا شيء").
request-object-required=مطلوب كائن الطلب
request-object-required.tooltip=يحدد ما إذا كان التطبيق يحتاج إلى توفير كائن طلب مع طلبات التفويض الخاصة به، وما هي الطريقة التي يمكنهم استخدامها لهذا الغرض. إذا تم التعيين على "غير مطلوب"، فإن توفير كائن الطلب يكون أمرًا اختياريًا. وفي جميع الحالات الأخرى، يكون توفير كائن الطلب أمرًا إلزاميًا. إذا تم تعيينه على "طلب"، فيجب توفير كائن الطلب حسب القيمة. إذا تم التعيين على "request_uri"، فيجب توفير كائن الطلب حسب المرجع. إذا تم التعيين على "request أو request_uri"، فيمكن استخدام أي من الطريقتين.
request-uris=عناوين URL صالحة للطلب
request-uris.tooltip=قائمة بمعرفات URI الصالحة، والتي يمكن استخدامها كقيم لمعلمة "request_uri" أثناء طلب مصادقة OpenID Connect. يوجد دعم لنفس الإمكانات مثل عناوين URI الصالحة لإعادة التوجيه. على سبيل المثال، أحرف البدل أو المسارات النسبية.
fine-saml-endpoint-conf=تكوين نقطة نهاية SAML للحبوب الدقيقة
fine-saml-endpoint-conf.tooltip=قم بتوسيع هذا القسم لتكوين عناوين URL الدقيقة لخدمة Assertion Consumer وSingle Logout Service.
assertion-consumer-post-binding-url=عنوان URL لربط خدمة المستهلك التأكيدي
assertion-consumer-post-binding-url.tooltip=عنوان URL لربط SAML POST لخدمة المستهلك لتأكيد التطبيق (استجابات تسجيل الدخول). يمكنك ترك هذا فارغًا إذا لم يكن لديك عنوان URL لهذا الربط.
assertion-consumer-redirect-binding-url=عنوان URL لربط إعادة توجيه خدمة المستهلك التأكيدية
assertion-consumer-redirect-binding-url.tooltip=عنوان URL لربط إعادة توجيه SAML لخدمة عميل تأكيد التطبيق (استجابات تسجيل الدخول). يمكنك ترك هذا فارغًا إذا لم يكن لديك عنوان URL لهذا الربط.
logout-service-post-binding-url=عنوان URL لربط خدمة تسجيل الخروج
logout-service-post-binding-url.tooltip=عنوان URL لربط SAML POST لخدمة تسجيل الخروج الفردي للتطبيق. يمكنك ترك هذا فارغًا إذا كنت تستخدم رابطًا مختلفًا
logout-service-redir-binding-url=عنوان URL الملزم لإعادة توجيه خدمة تسجيل الخروج
logout-service-redir-binding-url.tooltip=عنوان URL لربط إعادة توجيه SAML لخدمة تسجيل الخروج الفردي للتطبيق. يمكنك ترك هذا فارغًا إذا كنت تستخدم رابطًا مختلفًا.
saml-signature-keyName-transformer=اسم مفتاح توقيع SAML
saml-signature-keyName-transformer.tooltip=تحتوي مستندات SAML الموقعة على تعريف لمفتاح التوقيع في عنصر KeyName. بالنسبة للطرف المقابل Keycloak / RH-SSO، استخدم KEY_ID، بالنسبة لـ MS AD FS استخدم CERT_SUBJECT، بالنسبة للآخرين، حدد واستخدم NONE إذا لم يعمل أي خيار آخر.
oidc-compatibility-modes=أوضاع التوافق لـ OpenID Connect
oidc-compatibility-modes.tooltip=قم بتوسيع هذا القسم لتكوين إعدادات التوافق مع الإصدارات السابقة مع محولات OpenID Connect / OAuth2 الأقدم. إنه مفيد بشكل خاص إذا كان عميلك يستخدم إصدارًا أقدم من محول Keycloak / RH-SSO.
exclude-session-state-from-auth-response=استبعاد حالة الجلسة من استجابة المصادقة
exclude-session-state-from-auth-response.tooltip=إذا كان هذا قيد التشغيل، فلن يتم تضمين المعلمة "session_state" في استجابة مصادقة اتصال OpenID. يكون ذلك مفيدًا إذا كان تطبيقك يستخدم محول OIDC / OAuth2 الأقدم، والذي لا يدعم معلمة "session_state".
use-refresh-token-for-client-credentials-grant=استخدم رموز التحديث لمنح بيانات اعتماد العميل
use-refresh-token-for-client-credentials-grant.tooltip=إذا كان هذا قيد التشغيل، فسيتم إنشاء Refresh_token وإضافته إلى استجابة الرمز المميز إذا تم استخدام منح Client_credentials. ينص القسم 4.4.3 من OAuth 2.0 RFC6749 على أنه لا ينبغي إنشاء رمز تحديث عند استخدام منح بيانات اعتماد العميل. إذا كان هذا معطلاً، فلن يتم إنشاء رمز تحديث وستتم إزالة جلسة المستخدم المرتبطة.
