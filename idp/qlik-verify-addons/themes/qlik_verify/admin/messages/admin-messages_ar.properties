usermodel.clientRoleMapping.tokenClaimName.tooltip=اسم المطالبة المراد إدراجها في الرمز المميز. يمكن أن يكون هذا اسمًا مؤهلاً بالكامل مثل "address.street". في هذه الحالة، سيتم إنشاء كائن json متداخل. لمنع التداخل واستخدام النقطة حرفيًا، يمكنك الهروب من النقطة باستخدام شرطة مائلة عكسية (\\.). يمكن استخدام الرمز المميز ${client_id} وسيتم استبداله بمعرف التطبيق الفعلي. مثال الاستخدام هو "resource_access.${client_id}.roles". يعد هذا مفيدًا بشكل خاص عند إضافة أدوار من جميع التطبيقات (وبالتالي لم يتم تعيين مفتاح "معرف التطبيق") وتريد تخزين أدوار العميل لكل عميل بشكل منفصل.
