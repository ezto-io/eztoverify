mappers.tooltip=يقوم مصممو البروتوكول بإجراء التحويل على الرموز المميزة والمستندات. يمكنهم القيام بأشياء مثل تعيين بيانات المستخدم إلى مطالبات بروتوكول، أو مجرد تحويل أي طلبات تنتقل بين العميل وخادم المصادقة.
