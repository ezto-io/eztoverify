sso-session-max-remember-me=جلسة SSO ماكس تذكرني
sso-session-max-remember-me.tooltip=الحد الأقصى للوقت قبل انتهاء صلاحية الجلسة عندما يقوم المستخدم بتعيين خيار تذكرني. يتم إبطال الرموز المميزة وجلسات المتصفح عند انتهاء صلاحية الجلسة. إذا لم يتم تعيينها، فإنها تستخدم القيمة القياسية لجلسة SSO القصوى.
offline-session-idle=الجلسة غير متصلة بالإنترنت
offline-session-idle.tooltip=الوقت الذي يُسمح فيه للجلسة غير المتصلة بالإنترنت بأن تكون خاملة قبل انتهاء صلاحيتها. تحتاج إلى استخدام الرمز المميز دون اتصال بالإنترنت للتحديث مرة واحدة على الأقل خلال هذه الفترة؛ وإلا ستنتهي صلاحية الجلسة غير المتصلة بالإنترنت.
