authz-policy-decision-strategy.tooltip=تملي استراتيجية القرار كيفية تقييم السياسات المرتبطة بالإذن المعطى وكيفية الحصول على القرار النهائي. تعني كلمة "إيجابي" أنه يجب تقييم سياسة واحدة على الأقل للوصول إلى قرار إيجابي حتى يكون القرار النهائي إيجابيًا أيضًا. ويعني "الإجماع" أنه يجب تقييم جميع السياسات للوصول إلى قرار إيجابي حتى يكون القرار النهائي إيجابيًا أيضًا. "الإجماع" يعني أن عدد القرارات الإيجابية يجب أن يكون أكبر من عدد القرارات السلبية. إذا كان عدد الإيجابية والسلبية هو نفسه، فإن القرار النهائي سيكون سلبيا.
