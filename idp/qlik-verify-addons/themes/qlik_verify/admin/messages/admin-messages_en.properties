realm-detail.hostname.tooltip=Set the hostname for the workspace. Use in combination with the fixed hostname provider to override the server hostname for a specific workspace.
realm-detail.frontendUrl=Frontend URL
realm-detail.frontendUrl.tooltip=Set the frontend URL for the workspace. Use in combination with the default hostname provider to override the base URL for frontend requests for a specific workspace.
