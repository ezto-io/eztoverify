authentication-desc=Authentication is the act of validating that a person, and company is who they claim to be. In the context of online applications, authentication is generally accomplished by entering a username or ID, as well as one or more pieces of secret information that should only be known by a specific user.
passwordless-desc=Users can log in without having to remember a password using Passwordless authentications. Instead, users input their phone number or email address and are sent a one-time code or link that they could use to log in.
mfa-desc=MFA is an extra layer of security that requires a user to give two or more verification factors in order to obtain access to a resource. MFA needs one or more extra verification criteria in addition to a login and password, which reduces the chances of a successful cyber-attack.
sso-integrations-desc=SSO enables users to authenticate at {variant} with one set of credentials to access any number of other provider applications.After Successful login with {variant}, a user will not need to enter credentials again to access other provider applications.
