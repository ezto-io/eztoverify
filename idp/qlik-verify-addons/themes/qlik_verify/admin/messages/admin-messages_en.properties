bo-biometric-desc=Biometric verification confirms identity through unique physiological or behavioral traits, like fingerprints or facial features. It ensures high security by leveraging traits that are difficult to replicate, simplifying verification for users.
bo-verify-business-desc=Business verification using the CIN (Corporate Identification Number) entails confirming a company's authenticity and details registered under the Ministry of Corporate Affairs in India.
bo-device-register-desc=Device registration facilitates the process of enrolling a specific device for a particular user. It involves capturing unique identifiers and attributes of the device.This allows the system to recognize the device during subsequent verification processes.
bo-device-verify-desc=Device verification involves the verification of attributes of a specific device, it encompasses capturing unique identifiers and characteristics of the device. By cross-referencing this information with registered device, the device will be verified during further verification processes.
fido-register-desc=FIDO Registration enables users to securely enroll their unique fingerprint patterns and a confidential passkey for verification purposes.By capturing and storing these datas, FIDO Registration streamlines subsequent verification processes, ensuring seamless and secure user interactions.
fido-authenticator-passwordless-desc=FIDO Verification facilitates secure confirmation of user identity through previously enrolled fingerprint patterns and a confidential passkey. By cross-referencing these stored data points, FIDO Verification will take place.
bo-iec-verification-desc=IEC Verification with the IEC (Import Export Code) number involves getting details of a business entity registered under the Directorate General of Foreign Trade (DGFT) in India. By verifying the IEC number against official records, information about the business, such as its legal name, address, and the type of goods or services it is authorized to import or export will be fetched.
bo-iproov-register-desc=The Face Register workflow employs advanced face recognition technology for secure user registration. By capturing and storing facial biometric data, it enables accurate and reliable verification. This streamlined process enhances security measures and ensures seamless user registration.
bo-iproov-verify-desc=The Face Verification utilizes advanced face recognition technology to verify user identity securely. By comparing captured facial biometric data with stored templates, it ensures accurate and reliable verification. This streamlined process enhances security measures and facilitates seamless user verification.
bo-verify-itr-desc=ITR verification aims to verify a user's Income Tax Return details using their ITR Username and Password. This process ensures the accuracy and integrity of tax information submitted, fostering compliance with tax regulations.
bo-json-based-form-desc=With Dynamic Form, you have the flexibility to customize the form or template according to your specific requirements using a customized JSON structure.
bo-liveliness-verification-desc=Liveness Verification compares both the image and the real-time presence of the user. This process ensures the user's physical presence during verifciation, mitigating risks of spoofing or fraudulent attempts.
bo-verify-ocr-aadhar-desc=OCR Aadhaar card verification entails capturing Aadhaar card details through Optical Character Recognition (OCR) technology during the verification process. This method involves extracting textual information such as the Aadhaar number, name, address, and other relevant details from the card image. By automating this process, OCR facilitates accurate and efficient verification, enhancing the speed and reliability of identity verification procedures.
bo-verify-ocr-aadhaar-desc=OCR Aadhaar card verification entails capturing Aadhaar card details through Optical Character Recognition (OCR) technology during the verification process. This method involves extracting textual information such as the Aadhaar number, name, address, and other relevant details from the card image. By automating this process, OCR facilitates accurate and efficient verification, enhancing the speed and reliability of identity verification procedures.
bo-ocr-driving-license-desc=OCR Driving License verification involves capturing driving license details through Optical Character Recognition (OCR) technology during the verification process. This method extracts textual information such as the license number, holder's name, date of birth, and other relevant details from the license image. Automating this process enhances the accuracy and efficiency of verification, ensuring reliable confirmation of the license holder's identity.
bo-verify-pan-ocr-desc=OCR Pan Card verification entails capturing PAN card details through Optical Character Recognition (OCR) technology during the verification process. This method extracts textual information such as the PAN number, holder's name, date of birth, and other relevant details from the card image. Automating this process enhances the accuracy and efficiency of verification, ensuring reliable confirmation of the PAN card holder's identity.
bo-verify-ocr-voterID-desc=OCR Voter ID verification involves capturing Voter ID details through Optical Character Recognition (OCR) technology during the verification process. This method extracts textual information such as the Voter ID number, voter's name, address, and other relevant details from the ID image. Automating this process enhances the accuracy and efficiency of verification, ensuring reliable confirmation of the voter's identity.
bo-proximity-verify-desc=Proximity Verification is designed for Web to Device interactions. During the verification process, the web interface prompts users to provide their location, storing the latitude and longitude. Subsequently, when the process transitions to mobile, it captures the mobile device's latitude and longitude, comparing it with the web data. If the distance between the two points falls within the predefined threshold set in the configuration, verification succeeds.
bo-secure-messaging-desc=Secure messaging ensures the protection of communication content which will be sent to user's registered devices and also stores the device's IP, location and such things.
bo-selfie-registration-desc=The Selfie Registration workflow enables users to securely store their facial template for future use during Liveness checks, ensuring a smooth and secure verification process.
bo-selfie-verification-desc=The Selfie Verification process allows users to securely compare their stored facial template from the earlier Selfie Registration process, ensuring a smooth and secure verification experience.
terms-and-conditions-desc=Terms and Conditions involve reviewing, understanding, and agreeing to the terms associated with a service, product, or agreement. Additionally, maintaining versions of Terms and Conditions ensures transparency and compliance with legal requirements over time. This process safeguards both parties' interests and fosters clarity in contractual agreements.
bo-validate-email-desc=Email validation confirms the accuracy and legitimacy of an email address. It involves verifying the format, domain existence, and SMTP communication to ensure deliverability. This process enhances data quality and reduces the risk of bounced or undelivered emails.
validate-phone-no-desc=Phone number validation confirms the correctness and validity of a given phone number. It includes verifying the format, country code, and number length to ensure accuracy.
bo-verify-aadhar-desc=Aadhaar Card verification confirms the authenticity of an individual's Aadhaar details. It involves validating the Aadhaar number, and demographic information against official records. This process enhances identity verification accuracy and ensures compliance with regulatory requirements.
bo-verify-otp-aadhar-desc=Aadhaar with OTP verification confirms the identity of individuals using their Aadhaar number and a one-time password (OTP). It involves sending an OTP to the registered mobile number linked with Aadhaar, which the user enters to verify.
bo-verify-aadhaar-desc=Aadhaar Card verification confirms the authenticity of an individual's Aadhaar details. It involves validating the Aadhaar number, and demographic information against official records. This process enhances identity verification accuracy and ensures compliance with regulatory requirements.
bo-verify-otp-aadhaar-desc=Aadhaar with OTP verification confirms the identity of individuals using their Aadhaar number and a one-time password (OTP). It involves sending an OTP to the registered mobile number linked with Aadhaar, which the user enters to verify.
bo-verify-bank-desc=Bank verification with account number and IFSC code confirms the accuracy of bank details. It involves validating the account number's format and checking the IFSC code against the official records of the bank branch.
bo-verify-driving-license-desc=Driving License Verification entails verifying the license number, holder's identity, and expiration date against official records.
bo-verify-email-desc=Email verification with OTP confirms the ownership and validity of an email address. It includes sending a one-time password (OTP) to the provided email, which the user enters to verify.
bo-verify-form-26as-desc=Form 26AS verification ensures the accuracy of taxpayer's financial details. It involves cross-checking the information displayed in Form 26AS with the taxpayer's records and transactions.
bo-verify-fssai-desc=FSSAI verification verifies the authenticity of food business operators' licenses. It involves verifying the FSSAI license number and details against official records.
bo-verify-gstin-desc=GSTIN verification confirms the accuracy of a taxpayer's GST registration details. It involves validating the GST identification number (GSTIN).
bo-verify-gstwithotp-desc=GST verification with OTP verifies the legitimacy of a taxpayer's GST registration. It includes sending a one-time password (OTP) to the registered mobile number linked with GSTIN, which the user enters to verify.
bo-verify-pan-desc=PAN card verification verifies the authenticity of an individual's PAN card details. It involves verifying the PAN card number and holder's information.
bo-verify-phone-desc=The Verify Phone process typically entails confirming a user's phone number using both OTP and OTP-less methods. This involves sending a one-time password (OTP) to the user's mobile device.
bo-verify-tan-desc=Verifying TAN (Tax Deduction and Collection Account Number) ensures the accuracy and validity of the TAN details provided. TAN verification aids in identifying any discrepancies or inconsistencies in tax deduction and collection activities, promoting financial transparency and regulatory compliance.
bo-name-similarity-check-desc=This workflow module compares names of two ID documents and returns a match score, indicating the degree of similarity between the names.
bo-sub-workflow-desc=The Sub Workflow module allows you to reference a predefined flow containing multiple workflows, eliminating the need to repeat the same set of workflows across different paths. By linking to a single flow configuration, you simplify  workflow management and maintain consistency.
bo-verify-epfo-desc=The Employees' Provident Fund Organization (EPFO) Verification is responsible for managing the verification process of the Universal Account Number (UAN) associated with Provident Fund (PF) accounts. This process ensures the authenticity and accuracy of the UAN, which is a unique identifier for an employee's PF account.
bo-verify-tds206-compliance-desc=Verifying TDS-206 typically involves confirming the accuracy and completeness of information related to Tax Deducted at Source (TDS) Form 206.
bo-verify-thaiId-desc=ThaiID verification involves confirming the authenticity and validity of an individual's Thai national identification card (ThaiID).
bo-verify-udyam-desc=Udyam/Udyog verification involves confirming the registration details and eligibility of a business entity under the Udyam Registration portal.
bo-verify-voterID-desc=Verifying a Voter ID involves confirming the authenticity and validity of an individual's voter registration details. This process typically includes verifying the voter's name, address, voter ID number, and other relevant information.
bo-verify-whatsapp-desc=Verifying WhatsApp involves confirming the authenticity and ownership of a user's phone number during the account registration process. This typically includes verifying the user's phone number through a one-time verification code sent via SMS or phone call.
bo-web-to-device-desc=It is the process where the first verification takes place on the web, followed by the second part of the verification on a mobile device using the QR code and Firebase integration.
bo-geo-tagging-desc=The Geo Tagging workflow module captures and returns latitude, longitude, and accuracy details when executed. It helps verify locations and enhance location-based workflows.
