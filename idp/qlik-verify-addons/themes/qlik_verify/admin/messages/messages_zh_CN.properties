# encoding: utf-8

invalidPasswordMinLengthMessage=密码无效：最小长度{0}。
invalidPasswordMinLowerCaseCharsMessage=密码无效：必须至少包含 {0} 个小写字符。
invalidPasswordMinDigitsMessage=密码无效：必须至少包含{0}位数字。
invalidPasswordMinUpperCaseCharsMessage=密码无效：必须至少包含 {0} 个大写字符。
invalidPasswordMinSpecialCharsMessage=密码无效：必须至少包含{0}个特殊字符。
invalidPasswordNotUsernameMessage=密码无效：不得等于用户名。
invalidPasswordNotEmailMessage=密码无效：不得等于电子邮件。
invalidPasswordRegexPatternMessage=密码无效：无法匹配正则表达式模式。
invalidPasswordHistoryMessage=密码无效：不得等于最后{0}的任何密码。
invalidPasswordBlacklistedMessage=密码无效：密码被列入黑名单。
invalidPasswordGenericMessage=密码无效：新密码与密码策略不匹配。

ldapErrorInvalidCustomFilter=自定义配置的 LDAP 过滤器不以“（”开头，也不以“）”结尾。
ldapErrorConnectionTimeoutNotNumber=连接超时必须是数字
ldapErrorReadTimeoutNotNumber=读取超时必须是数字
ldapErrorMissingClientId=当不使用领域角色映射时，需要在配置中提供客户端 ID。
ldapErrorCantPreserveGroupInheritanceWithUIDMembershipType=无法保留组继承并同时使用 UID 成员身份类型。
ldapErrorCantWriteOnlyForReadOnlyLdap=无法仅在 LDAP 提供程序模式不可写时设置写入
ldapErrorCantWriteOnlyAndReadOnly=不能同时设置只写和只读
ldapErrorCantEnableStartTlsAndConnectionPooling=无法同时启用启动 TLS 和连接池。
ldapErrorCantEnableUnsyncedAndImportOff=无法在 LDAP 提供程序模式不同步时禁用导入用户
ldapErrorMissingGroupsPathGroup=组路径组不存在 - 请先在指定路径上创建组

clientRedirectURIsFragmentError=重定向 URI 不得包含 URI 片段
clientRootURLFragmentError=根网址不得包含网址片段
clientRootURLIllegalSchemeError=根网址使用非法方案
clientBaseURLIllegalSchemeError=基本网址使用非法方案
backchannelLogoutUrlIllegalSchemeError=反向通道注销 URL 使用非法方案
clientRedirectURIsIllegalSchemeError=重定向 URI 使用非法方案
clientBaseURLInvalid=基本网址不是有效的网址
clientRootURLInvalid=根网址不是有效的网址
clientRedirectURIsInvalid=重定向 URI 不是有效的 URI
backchannelLogoutUrlIsInvalid=反向通道注销 URL 不是有效的 URL


pairwiseMalformedClientRedirectURI=客户端包含无效的重定向 URI。
pairwiseClientRedirectURIsMissingHost=客户端重定向 URI 必须包含有效的主机组件。
pairwiseClientRedirectURIsMultipleHosts=如果没有配置的扇区标识符 URI，客户端重定向 URI 不得包含多个主机组件。
pairwiseMalformedSectorIdentifierURI=格式错误的扇区标识符 URI。
pairwiseFailedToGetRedirectURIs=无法从扇区标识符 URI 获取重定向 URI。
pairwiseRedirectURIsMismatch=客户端重定向 URI 与从扇区标识符 URI 获取的重定向 URI 不匹配。