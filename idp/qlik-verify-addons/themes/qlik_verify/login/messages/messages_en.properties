safariCrossSiteTracking=We rely on Third Party Cookies to provide seamless verification experience.<br/><br/>To Continue in Safari follow below steps, else try in different browser<br/>1. Disable <b>"Prevent cross-site tracking"</b> option from Safari ->Settings ->Privacy<br/>2. Close this popup and Retry the verification
