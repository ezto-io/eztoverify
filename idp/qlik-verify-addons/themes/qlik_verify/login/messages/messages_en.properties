chromeCrossSiteTracking=We rely on Third Party Cookies to provide seamless verification experience.<br/><br/>To Continue in this browser follow below steps, else try in different browser<br/>1. Turn off "Block third-party cookies"</b> option from Privacy and security ->Cookies and other site data<br/>2. Close this popup and Retry the verification
edgeCrossSiteTracking=We rely on Third Party Cookies to provide seamless verification experience.<br/><br/>To Continue in Edge follow below steps, else try in different browser<br/>1. Turn off "Block third-party cookies"</b> option from Settings ->Cookies and site permissions ->Manage and delete cookies and site data"<br/>2. Close this popup and Retry the verification
firefoxCrossSiteTracking=We rely on Third Party Cookies to provide seamless verification experience.<br/><br/>To Continue in Firefox follow below steps, else try in different browser<br/>1. Allow "third-party cookies"</b> option from Settings ->Under Privacy & Security ->Enhanced Tracking Protection ->Choose custom and uncheck Cookies.<br/>2. Close this popup and Retry the verification
braveCrossSiteTracking=We rely on Third Party Cookies to provide seamless verification experience.<br/><br/>To Continue in Brave follow below steps, else try in different browser<br/>1. Enable "Allow all cookies"</b> option from Settings ->Privacy & security ->Cookies and other site data.<br/>2. Close this popup and Retry the verification
