chromeLocationEnableSteps=1. انقر على القائمة الموجودة في الزاوية العلوية اليمنى.<br/> 2. انتقل إلى الإعدادات > الخصوصية والأمان > إعدادات الموقع.<br/> 3. انقر على "الموقع" وقم بتمكينه لهذا الموقع.
firefoxLocationEnableSteps=1. انقر على القائمة وانتقل إلى "الإعدادات".<br/> 2. انتقل إلى "الخصوصية والأمان".<br/> 3. مرر لأسفل إلى "الأذونات" وانقر على "الإعدادات" بجوار "الموقع".<br/> 4. اسمح بالوصول إلى الموقع لهذا الموقع وأعد المحاولة.
safariLocationEnableSteps=1. انقر على "Safari" في القائمة العلوية وحدد "الإعدادات".<br/> 2. انتقل إلى علامة التبويب "مواقع الويب".<br/> 3. انقر على "الموقع" واسمح بالوصول إلى هذا الموقع.
edgeLocationEnableSteps=1. انقر على القائمة الموجودة في الزاوية العلوية اليمنى.<br/> 2. انتقل إلى الإعدادات > ملفات تعريف الارتباط وأذونات الموقع > الموقع.<br/> 3. قم بتمكين "السؤال قبل الوصول".
