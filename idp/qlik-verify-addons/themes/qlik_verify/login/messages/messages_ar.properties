safariCrossSiteTracking=نحن نعتمد على ملفات تعريف الارتباط التابعة لجهات خارجية لتوفير تجربة تحقق سلسة.<br/><br/>للمتابعة في Safari، اتبع الخطوات التالية، أو حاول استخدام متصفح آخر<br/>1. قم بتعطيل خيار <b>"منع التتبع عبر المواقع"</b> من Safari ->الإعدادات ->الخصوصية<br/>2. أغلق هذه النافذة المنبثقة وأعد محاولة التحقق
operaCrossSiteTracking=نحن نعتمد على ملفات تعريف الارتباط التابعة لجهات خارجية لتوفير تجربة تحقق سلسة.<br/><br/>للمتابعة في Opera، اتبع الخطوات التالية، أو حاول استخدام متصفح آخر<br/>1. قم بتعطيل خيار <b>"حظر ملفات تعريف الارتباط للجهات الخارجية"</b> من الإعداد السهل ->انتقل إلى إعدادات المتصفح الكاملة ->الخصوصية والأمان ->ملفات تعريف الارتباط للجهات الخارجية ->السماح بملفات تعريف الارتباط للجهات الخارجية<br/>2. أغلق هذه النافذة المنبثقة وأعد محاولة التحقق
chromeCrossSiteTracking=نحن نعتمد على ملفات تعريف الارتباط التابعة لجهات خارجية لتوفير تجربة تحقق سلسة.<br/><br/>للمتابعة في هذا المتصفح، اتبع الخطوات التالية، أو حاول في متصفح آخر<br/>1. قم بإيقاف تشغيل خيار "حظر ملفات تعريف الارتباط للجهات الخارجية"</b> من الخصوصية والأمان ->ملفات تعريف الارتباط وبيانات الموقع الأخرى<br/>2. أغلق هذه النافذة المنبثقة وأعد محاولة التحقق
edgeCrossSiteTracking=نحن نعتمد على ملفات تعريف الارتباط التابعة لجهات خارجية لتوفير تجربة تحقق سلسة.<br/><br/>للمتابعة في Edge، اتبع الخطوات التالية، أو حاول استخدام متصفح آخر<br/>1. قم بإيقاف تشغيل خيار "حظر ملفات تعريف الارتباط للجهات الخارجية"</b> من الإعدادات ->ملفات تعريف الارتباط وأذونات الموقع ->إدارة وحذف ملفات تعريف الارتباط وبيانات الموقع"<br/>2. أغلق هذه النافذة المنبثقة وأعد محاولة التحقق
firefoxCrossSiteTracking=نحن نعتمد على ملفات تعريف الارتباط التابعة لجهات خارجية لتوفير تجربة تحقق سلسة.<br/><br/>للمتابعة في Firefox، اتبع الخطوات التالية، وإلا حاول في متصفح آخر<br/>1. السماح بخيار "ملفات تعريف الارتباط للجهات الخارجية"</b> من الإعدادات ->ضمن الخصوصية والأمان ->حماية التتبع المحسنة ->اختر مخصصًا وقم بإلغاء تحديد ملفات تعريف الارتباط.<br/>2. أغلق هذه النافذة المنبثقة وأعد محاولة التحقق
braveCrossSiteTracking=نحن نعتمد على ملفات تعريف الارتباط التابعة لجهات خارجية لتوفير تجربة تحقق سلسة.<br/><br/>للمتابعة في Brave، اتبع الخطوات التالية، أو حاول استخدام متصفح آخر<br/>1. قم بتمكين خيار "السماح لجميع ملفات تعريف الارتباط"</b> من الإعدادات ->الخصوصية والأمان ->ملفات تعريف الارتباط وبيانات الموقع الأخرى.<br/>2. أغلق هذه النافذة المنبثقة وأعد محاولة التحقق
defaultCrossSiteTracking=نحن نعتمد على ملفات تعريف الارتباط الخاصة بالطرف الثالث لتوفير تجربة تحقق سلسة.<br/><br/>للمتابعة في هذا المتصفح، قم بتمكين ملفات تعريف الارتباط الخاصة بالطرف الثالث في متصفحك.
