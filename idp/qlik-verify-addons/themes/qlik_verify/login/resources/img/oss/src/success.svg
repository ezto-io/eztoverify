  <style>
    .badge {
      transform-box: view-box;
      transform-origin: 96px 96px;
      animation: grow 1600ms linear infinite;
    }
    .tick {
      animation: draw 1600ms linear infinite;
    }
    /* Loop: full badge held (0-30%), quick shrink out (30-40%),
       circle grows with a small overshoot (40-62%), tick draws (62-88%), hold (88-100%).
       State at 100% equals state at 0%, so the loop is seamless. */
    @keyframes grow {
      0% { transform: scale(1); }
      30% { transform: scale(1); animation-timing-function: ease-in; }
      40% { transform: scale(0); animation-timing-function: ease-out; }
      55% { transform: scale(1.08); animation-timing-function: ease-in-out; }
      62% { transform: scale(1); }
      100% { transform: scale(1); }
    }
    @keyframes draw {
      0% { stroke-dashoffset: 0; }
      40% { stroke-dashoffset: 0; }
      40.01% { stroke-dashoffset: 102; }
      62% { stroke-dashoffset: 102; animation-timing-function: ease-in-out; }
      88% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
  </style>
