<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <!-- EztoVerify OSS theme backdrop. Authored for the OSS theme, AGPL-3.0 (project). -->
  <!-- Light geometric shapes on a transparent ground; main.css fades it with the tenant background opacity. -->
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="3" fill="#989da5"/>
    </pattern>
    <pattern id="stripe" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="5" height="16" fill="#989da5"/>
    </pattern>
  </defs>
  <g fill="none" stroke="#989da5" stroke-linecap="round">
    <!-- corner arcs -->
    <path d="M0 170 A170 170 0 0 0 170 0" stroke-width="10"/>
    <path d="M0 240 A240 240 0 0 0 240 0" stroke-width="10"/>
    <path d="M0 310 A310 310 0 0 0 310 0" stroke-width="10"/>
    <path d="M1440 740 A160 160 0 0 0 1280 900" stroke-width="12"/>
    <path d="M1440 670 A230 230 0 0 0 1210 900" stroke-width="12"/>
    <!-- rings -->
    <circle cx="1235" cy="470" r="58" stroke-width="20"/>
    <circle cx="395" cy="640" r="30" stroke-width="10"/>
    <circle cx="1060" cy="120" r="22" stroke-width="8"/>
    <!-- wave -->
    <path d="M380 874 q40 -36 80 0 t80 0 t80 0" stroke-width="8"/>
  </g>
  <g fill="#989da5">
    <!-- dot fields -->
    <rect x="1170" y="50" width="234" height="156" fill="url(#grid)"/>
    <rect x="60" y="430" width="130" height="208" fill="url(#grid)"/>
    <!-- striped band -->
    <rect x="250" y="300" width="170" height="80" rx="12" fill="url(#stripe)"/>
    <!-- discs -->
    <circle cx="1010" cy="700" r="34"/>
    <circle cx="140" cy="790" r="22"/>
    <circle cx="205" cy="840" r="12"/>
    <circle cx="1340" cy="300" r="14"/>
    <!-- plus marks -->
    <path d="M700 64 h10 v-16 h8 v16 h16 v8 h-16 v16 h-8 v-16 h-10 z"/>
    <path d="M300 748 h10 v-16 h8 v16 h16 v8 h-16 v16 h-8 v-16 h-10 z"/>
    <path d="M1120 560 h10 v-16 h8 v16 h16 v8 h-16 v16 h-8 v-16 h-10 z"/>
  </g>
</svg>
