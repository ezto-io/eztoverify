<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Loading Page</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
        <style>
            body {
                font-family: 'Inter', sans-serif;
                margin: 0px;
                padding: 0px;
            }

            .spinner {
                border: 4px solid #f3f3f3; /* Light grey */
                border-top: 3px solid #3498db; /* Blue */
                border-radius: 50%;
                width: 20px;
                height: 20px;
                animation: spin 2s linear infinite;
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }

            .loader-container {
                height: 100vh;
                width: 100vw;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
            }

            .loader-text {
                font-size: large;
                font-weight: 400;
                text-align: center;
                padding: 0px 16px;
                line-height: 1.8;
            }

            .redirection-text{
                font-size: large;
            }

            #proceed-button {
                visibility: hidden;
                padding: 10px 15px;
                background-color: #1c64eb;
                color: #fff;
                border: none;
                border-radius: 5px;
                font-size: 14px;
            }
            .d-none{
                display:none
            }
        </style>
    </head>

    <body>
        <div class="loader-container">
            <p class="loader-text" id="instruction-text">If the app is installed, please wait as it opens. <span id="redirect-windows" class="d-none" >Otherwise, you'll be redirected to the store.</span id="redirect-ios" class="d-none" ><span>If not, click the button below to be redirected to the appropriate App Store.</span></p>
            <div class="spinner" id="loader"></div>
            <p class="redirection-text d-none" id="redirection-text"> If not redirected. <a id="link">Click here</a></p>
            <p class="loader-text  d-none" id="close-text">You can close the page safely.</p>
            <button id="proceed-button"  >Open Appstore</button>
        </div>

        <script type="text/javascript">

            const parsedUrl = new URL(window.location);

            // Extract parameters
            const deep_link_url = parsedUrl.searchParams.get("deep_link_url");
            const base_url = parsedUrl.searchParams.get("base_url");
            const token = parsedUrl.searchParams.get("action_token");
            const app_url = parsedUrl.searchParams.get("app_url")
            const realm_id = parsedUrl.searchParams.get("realm_id")
            const windows_url = parsedUrl.searchParams.get("windows_url");

            const linkUrl = deep_link_url + "&base_url=" + base_url + "&action_token=" + token + "&realm_id=" + realm_id;


            window.onload = async () => {
                let os = getBrowserOs();
                switch (os) {
                    case "android":
                        //Means app is not installed
                        document.getElementById("link").setAttribute("href", `${windows_url}`);
                        window.location.href = windows_url;
                        document.getElementById("loader").style.display = 'none';
                        document.getElementById("redirect-windows").style.display = 'block';
                        document.getElementById("redirection-text").style.display = 'block';
                        const encodedUrl = encodeURIComponent(window.location.href);
                        await copyUrlToClipboard(windows_url + "&referrer=utm_source%3D" + encodedUrl);
                        break;
                    case "ios":
                        document.getElementById("proceed-button").addEventListener("click", async function () {
                            await copyEncodedUrlToIosClipboard(window.location.href);
                            window.location.href = app_url;
                        });
                        document.getElementById("link").setAttribute("href", app_url);
                        document.getElementById("loader").style.display = 'none';
                        document.getElementById("proceed-button").style.visibility = "visible";
                        document.getElementById("redirect-ios").style.display = 'block';
                        break;
                    case "macosx":
                        document.getElementById("link").setAttribute("href", `${app_url}`);
                        var appInstalled = await isCustomSchemeRegistered(linkUrl);
                        if (!appInstalled) {
                            // document.getElementById("info").innerText = "Transaction loaded in app. This page can be safely closed. If you don't have the app installed, please install from the Apple Store.";
                            document.getElementById("proceed-button").addEventListener("click", async function () {
                            await copyEncodedUrlToIosClipboard(linkUrl);
                                window.location.href = app_url;
                            });
                            document.getElementById("link").setAttribute("href", app_url);
                            document.getElementById("loader").style.display = 'none';
                            document.getElementById("proceed-button").style.visibility = "visible";
                            document.getElementById("redirect-ios").style.display = 'block';
                        } else{
                            document.getElementById("loader").style.display = 'none';
                            document.getElementById("instruction-text").style.display = 'none';
                            document.getElementById("close-text").style.display = 'block';
                        }
                        break;
                    case "windows":
                        document.getElementById("link").setAttribute("href", `${windows_url}`);
                        var appInstalled = await isCustomSchemeRegistered(linkUrl);
                        if (!appInstalled) {
                            // document.getElementById("info").innerText = "Transaction loaded in app. This page can be safely closed. If you don't have the app installed, please install from the Windows Store.";
                            document.getElementById("loader").style.display = 'none';
                            document.getElementById("redirect-windows").style.display = 'block';
                            document.getElementById("redirection-text").style.display = 'block';
                            await copyUrlToClipboard(linkUrl);
                            window.location.href = windows_url;
                        }else{
                            document.getElementById("loader").style.display = 'none';
                            document.getElementById("instruction-text").style.display = 'none';
                            document.getElementById("close-text").style.display = 'block';

                        }
                        break;
                    case "linux":
                        //Not supported
                        break;
                    default:
                        break;
                }
            };

            function getBrowserOs() {
                const userAgent = window.navigator.userAgent;
                const platform =
                    (window.navigator?.userAgentData?.platform || window.navigator.platform).toLowerCase();
                console.log("navigator.platform", platform, platform.includes("mac"));

                if (platform.includes("mac")) {
                    return "macosx";
                }
                if (platform.includes("win")) {
                    return "windows";
                }
                if (platform.includes("iphone") || platform.includes("ipad")) {
                    return "ios";
                }
                if (platform.includes("android")) {
                    return "android";
                }
                if (/Android/.test(userAgent)) {
                    return "android";
                }
                if (platform.includes("linux")) {
                    return "linux";
                }
            }

            async function isAppInstalled(appURL) {
                let isReady = await waitForWebviewToBeReady();
                if (isReady) {
                    return new Promise((resolve, reject) => {
                        var iframe = document.createElement('iframe');
                        iframe.style.display = 'none';
                        iframe.src = appURL;
                        document.body.appendChild(iframe);

                        var timer = setTimeout(() => {
                            // If the iframe is still loaded after a short delay, the app is likely installed
                            if (!iframe.contentWindow.closed) {
                                document.body.removeChild(iframe);
                                resolve(true);
                            } else {
                                document.body.removeChild(iframe);
                                reject(false);
                            }
                        }, 1000); // Adjust the delay as needed

                        // Handle errors
                        iframe.onerror = () => {
                            clearTimeout(timer);
                            reject(false);
                        };
                    });
                } else {
                    throw new Error("Webview not ready");
                }
            }

            async function waitForWebviewToBeReady() {
                let platform = getPlatform();
                console.log("platform", platform);
                if (platform == "flutter") {
                    console.log("waitForFlutterInAppWebViewPlatformReady called");
                    return new Promise(resolve => {
                        const checkCondition = () => {
                            if (isFlutterInAppWebViewReady) {
                                console.log("Webview is ready");
                                resolve(true);
                            } else {
                                setTimeout(checkCondition, 100); // Check again after 100 milliseconds
                            }
                        };

                        checkCondition();
                    });
                } else {
                    return true;
                }

            }

            function getPlatform() {
                var platform;
                if ((typeof window.flutter_inappwebview) != "undefined") {
                    platform = "flutter";
                } else if ((typeof window.ReactNativeWebView) != 'undefined') {
                    platform = "react_native";
                } else if ((typeof window.webkit) != "undefined") {
                    platform = "ios_native";
                } else if (((typeof AndroidInterface) != "undefined") && (typeof AndroidInterface.messageHandlers) != "undefined") {
                    platform = "android_native";
                } else if (typeof window != "undefined" && typeof window.chrome != "undefined" && typeof window.chrome.webview != "undefined") {
                    platform = "flutter_windows";
                } else {
                    platform = "other";
                }
                return platform;
            }

            function isCustomSchemeRegistered(scheme) {
                return new Promise(async function (resolve, reject) {
                    await delay(1000)
                    var iframe = document.createElement("iframe");
                    iframe.style.display = "none";
                    iframe.src = scheme;

                    document.body.appendChild(iframe);

                    var timeout = setTimeout(function () {
                        document.body.removeChild(iframe);
                        resolve(false); // Timeout occurred, assuming the scheme is not registered
                    }, 4000); // Timeout in milliseconds

                    function checkHandler() {
                        clearTimeout(timeout);
                        document.body.removeChild(iframe);
                        resolve(true); // Scheme is registered
                    }

                    function errorHandler() {
                        clearTimeout(timeout);
                        document.body.removeChild(iframe);
                        resolve(false); // Scheme is not registered
                    }

                    // Add event listeners
                    window.addEventListener("blur", checkHandler); // iOS Safari
                    iframe.onload = checkHandler; // Other browsers
                    iframe.onerror = errorHandler; // Other browsers
                });
            }

            function delay(millisec) {
                return new Promise(resolve => {
                    setTimeout(() => { resolve('') }, millisec);
                })
            }

            function copyEncodedUrlToIosClipboard(content) {
                var TempText = document.createElement("input");
                TempText.value = content;
                document.body.appendChild(TempText);
                TempText.select();
                document.execCommand("copy");
                document.body.removeChild(TempText);
            }

            function copyUrlToClipboard(content) {
                return navigator.clipboard.writeText(content)
                    .then(() => console.log('URL copied to clipboard:', content))
                    .catch(error => console.error('Failed to copy URL to clipboard:', error));
            }
        </script>
    </body>
</html>
