worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    upstream qlikverify {
       server qlikverify:8443;
    }

    upstream minio {
       server minio:9000;
    }

    include /etc/nginx/conf.d/*.conf;

    server
    {
        # Replace with your own multi-tenant wildcard domain (e.g. ~(.*)\.example.com)
        server_name "~(.*).your-domain.example";
        listen 443 ssl;
        ssl_certificate /etc/ssl/ssl.crt;
        ssl_certificate_key /etc/ssl/ssl.key;
        #ssl_dhparam /etc/ssl/dhparam.pem;

        # client certificate
        # ssl_client_certificate /etc/ssl/client_certs/ca.crt;
        # make verification optional, so we can display a 403 message to those
        # who fail authentication
        # ssl_verify_client optional;

        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256';
        ssl_prefer_server_ciphers on;

        #change to override default header size (8k) to 64k for Cookie too large issue
        large_client_header_buffers 8 2048k;
        client_max_body_size 9M;

        # ssl_trusted_certificate /etc/ssl/ssl.crt;

        #Increase proxy buffer
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
        #Security hardening settings
        server_tokens off;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        # Enable XSS protection
        add_header X-XSS-Protection "1; mode=block";
        add_header Content-Security-Policy "frame-src 'self' https://wchat.in.freshchat.com/ https://*.duosecurity.com/ https://www.google.com/ https://www.google.com/recaptcha https://recaptcha.google.com/recaptcha; frame-ancestors 'self'; object-src 'none'";
        add_header Referrer-Policy "no-referrer";
        add_header Cache-Control no-cache;
        # HSTS (ngx_http_headers_module is required) (15768000 seconds = 6 months)
        add_header Strict-Transport-Security "max-age=31536000; includeSubdomains";
        #Do not release header information unnecessarily
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Generator;
        set $domain $1;

        # location ~ /public/(.*).md {
        #     set $mdfile $1;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_set_header Host $http_host;

        #     proxy_connect_timeout 300;
        #     # Default is HTTP/1, keepalive is only enabled in HTTP/1.1
        #     proxy_http_version 1.1;
        #     proxy_set_header Connection "";
        #     chunked_transfer_encoding off;

        #     proxy_pass http://minio/markdowns/$mdfile.md;
        # }
        
        location ~ (.*)/public/(.*)\.(md|png|svg|jpg|jpeg) {
            set $tenantpath $1;
            set $filepath  $2; 
            set $filext    $3; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;

            proxy_connect_timeout 300;
            # Default is HTTP/1, keepalive is only enabled in HTTP/1.1
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;

            proxy_pass http://minio/$tenantpath/public/$filepath.$filext;
        }

        location ~ /public/(.*)\.(md|png|svg) {
            set $filepath  $1; 
            set $filext    $2; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;

            proxy_connect_timeout 300;
            # Default is HTTP/1, keepalive is only enabled in HTTP/1.1
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;

            proxy_pass http://minio/public/$filepath.$filext;
        }

        location / {
            proxy_pass https://qlikverify/;
            proxy_redirect  https://qlikverify/ /;
            proxy_read_timeout 720s;
            proxy_cookie_path ~^/auth/.*$ /;

            # May not need or want to set Host. Should default to the above hostname.
            proxy_set_header          Host            $host;
            proxy_set_header          X-Real-IP       $remote_addr;
            proxy_set_header          X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
