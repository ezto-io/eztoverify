server.port=8070
springdoc.packagesToScan=com.ezto.bg
management.info.env.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=ALWAYS
management.endpoint.health.db.enabled=true
info.application.name=Ezto Background Job Management
info.application.version=@project.version@
library.directory=./providers
spring.threads.virtual.enabled=true

# Full (non-truncated) request/response body logging for debugging.
# DEBUG caps body at ~100 chars ("(truncated)..."); TRACE logs full payload.
spring.mvc.log-request-details=true
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=TRACE
