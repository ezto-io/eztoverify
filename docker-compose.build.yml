# Contributor overlay: restores build-from-source for the five buildable
# services. The deployment file (docker-compose.yml) pulls registry images and
# needs no toolchain; this file is how a contributor builds them locally.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# The image NAME still comes from REGISTRY and TAG in .env, so a locally built
# image lands on exactly the reference the deployment file expects and the two
# paths cannot drift. Set them to anything you like locally, for example
# REGISTRY=local TAG=dev.
#
# Face liveness is a roughly 15 GB build and stays behind the face-biometrics
# profile, so it is only built when that profile is active.

services:
  idp:
    build:
      context: ./idp

  background:
    build:
      context: ./services/background

  socket:
    build:
      context: ./services/socket

  url-shortener:
    build:
      context: ./services/url-shortener

  liveness:
    build:
      context: ./services/liveness
