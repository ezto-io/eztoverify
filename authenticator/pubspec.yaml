name: eztoverify_getting_started
description: A new Flutter project.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 5.1.0+25111401

environment:
  sdk: ">=3.1.0 <4.0.0"

# To upgrade your package to latest versions `flutter pub upgrade --major-versions`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  #ezto SDK
  eztoverify:
    path: "./ezto_verify_sdk"
  cupertino_icons: ^1.0.2
  flutter_bloc: ^9.1.1
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.1
  permission_handler: ^12.0.1
  shared_preferences: ^2.3.2
  device_info_plus: ^11.2.2
  package_info_plus: ^8.0.2
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.0
  apple_product_name: ^3.2.0
  flutter_secure_storage: ^9.2.2
  windows_notification: ^1.3.0
  window_manager: ^0.5.1
  get_it: ^7.2.0
  tray_manager: ^0.5.1

dependency_overrides:
  get_it: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  msix: ^3.16.8

msix_config:
  display_name: ezto verify
  publisher_display_name: ezto
  identity_name: io.ezto.verify.demo
  msix_version: 1.0.0.0
  logo_path: assets/launcher/ios_launcher.png
  capabilities: internetClient, location, microphone, webcam
  enable_at_startup: true
  store: false
  protocol_activation: eztovrfy

flutter:
  fonts:
    - family: "Poppins"
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700

  assets:
    - assets/images/background/
    - assets/images/flavor/
    - assets/images/navigation/

  uses-material-design: true
