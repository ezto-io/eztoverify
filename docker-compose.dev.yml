# Dev infra — backing services ONLY, so you can run the app code locally (IdP via kc.sh /
# IDE, the Node/Java/Python services via their own start scripts) against containerised infra.
# No app images, no source builds.
#
#   docker compose -f docker-compose.dev.yml up -d        # start infra
#   docker compose -f docker-compose.dev.yml down         # stop
#   docker compose -f docker-compose.dev.yml down -v      # stop + wipe data
#
# Exposes on localhost: postgres 5432, minio 9000 (console 9001), elasticsearch 9200,
# maildev SMTP 1025 (UI 1080). Point your locally-run services at these:
#   KC_DB_URL_HOST=localhost KC_DB_URL_PORT=5432 KC_DB_USERNAME=admin KC_DB_PASSWORD=admin
#   MINIO_SERVER_URL=http://localhost:9000  ES_HOST=localhost ES_PORT=9200
#   SMTP_HOST=localhost SMTP_PORT=1025
# Databases eztoverify / jobrnr / urlshortner / socket are created on first start
# (init-databases.sql). Replace the throwaway dev creds before any shared use.

# Own project namespace: without this, volumes below would collide with the main
# docker-compose.yml stack (same directory => same project => same pgdata/miniodata/
# esdata volumes, so `down -v` here would wipe the HTTPS stack's data).
name: ezto-dev

services:
  postgres:
    image: postgres:14-alpine
    container_name: ezto-dev-postgres
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: ezto-dev-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: ezto-dev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb -p local/ezto-verify || true &&
      mc anonymous set download local/ezto-verify/public || true
      "
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
    container_name: ezto-dev-elasticsearch
    restart: unless-stopped
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: ["esdata:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  maildev:
    image: maildev/maildev
    container_name: ezto-dev-maildev
    restart: unless-stopped
    ports: ["1025:1025", "1080:1080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:1080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata: { driver: local }
  miniodata: { driver: local }
  esdata: { driver: local }
